# Load local backend/.env when running from the backend directory.
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: mtmx-converter
  # Applying SNAKE_CASE globally means every Java POJO (camelCase fields)
  # serializes/deserializes as snake_case JSON automatically - which is
  # exactly the wire format the existing frontend already expects
  # (raw_text, source_format, rendered_output, field_trace, etc.) without
  # needing @JsonProperty annotations scattered everywhere.
  jackson:
    property-naming-strategy: SNAKE_CASE
  # Spring's defaults (1MB file / 10MB request) are too small for some
  # real ISO 20022 XSDs bundled with several xs:include'd common types.
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

# Server runs on 8000 by default specifically so the existing React
# frontend (VITE_API_BASE_URL default = http://localhost:8000) keeps
# working unmodified, per "keep the frontend as is".
server:
  port: ${SERVER_PORT:8000}

mtmx:
  # Folder containing one mapping-doc YAML file per conversion direction.
  mappings-dir: ${MTMX_MAPPINGS_DIR:./mappings}
  # Optional folder of official ISO 20022 .xsd files, named <target_format>.xsd
  xsd-dir: ${MTMX_XSD_DIR:}
  provider: ${MTMX_PROVIDER:gemini}
  model-name: ${MTMX_MODEL:openai/gpt-oss-20b}
  max-tokens: 1536
  max-converter-retries: 2
  gemini-api-key: ${GEMINI_API_KEY:}
  groq-api-key: ${GROQ_API_KEY:}
  # Opt-in structured-address enrichment (see address-parser-service/ and
  # ConverterService.enrichWithStructuredAddress) - off by default so
  # existing deployments without the sidecar running keep today's
  # AdrLine-only behavior. Enable ahead of the 14 November 2026 Swift
  # structured/hybrid address requirement.
  address-parser-enabled: ${MTMX_ADDRESS_PARSER_ENABLED:false}
  address-parser-url: ${MTMX_ADDRESS_PARSER_URL:http://localhost:8090/parse-address}

# Automated dashboard's Oracle source (pmtb_msg_dly_msg_out) - see OracleProperties and
# automation/OracleMessageFetchService. All blank by default; the automated dashboard's fetch
# endpoint fails with a clear "not configured" message rather than attempting a connection with
# empty credentials.
oracle:
  host: ${ORACLE_DB_HOST:}
  port: ${ORACLE_DB_PORT:1521}
  service-name: ${ORACLE_DB_SERVICE_NAME:}
  username: ${ORACLE_DB_USERNAME:}
  password: ${ORACLE_DB_PASSWORD:}

# OBPS/FLEXCUBE file-drop integration - see FlexcubeProperties, FlexcubeFileStore (and its two
# implementations FlexcubeSftpClient/FlexcubeLocalFileStore), FlexcubeFileWatcherJob. Disabled by
# default; the scheduled job checks isEnabled()/isConfigured() on every cycle and simply skips
# (logging a warning) rather than attempting a connection/read with missing config.
#
# access-mode: "sftp" (default - backend runs on a separate machine from FLEXCUBE, reaches it over
# SFTP) or "local" (backend runs directly on the FLEXCUBE app server - base-path is then a plain
# local filesystem path, and every FLEXCUBE_SFTP_* variable below is unused).
flexcube:
  enabled: ${FLEXCUBE_ENABLED:false}
  access-mode: ${FLEXCUBE_ACCESS_MODE:sftp}
  base-path: ${FLEXCUBE_BASE_PATH:}
  # The four subfolder names under base-path - defaults match the names originally described, but
  # a real deployment may use different literal names (e.g. plain "out" instead of "MT_out") -
  # override to match whatever actually exists rather than assuming.
  mt-out-folder: ${FLEXCUBE_MT_OUT_FOLDER:MT_out}
  mt-history-folder: ${FLEXCUBE_MT_HISTORY_FOLDER:MT_history}
  mx-out-folder: ${FLEXCUBE_MX_OUT_FOLDER:MX_out}
  mt-failed-folder: ${FLEXCUBE_MT_FAILED_FOLDER:MT_failed}
  poll-interval-ms: ${FLEXCUBE_POLL_INTERVAL_MS:300000}
  min-file-age-ms: ${FLEXCUBE_MIN_FILE_AGE_MS:30000}
  # Pause between two consecutive files that actually reach the converter (each involves an LLM
  # call) - keeps a cycle with many files from bursting the LLM provider. Set to 0 to disable.
  conversion-delay-ms: ${FLEXCUBE_CONVERSION_DELAY_MS:5000}
  # Local folder on THIS backend's own filesystem (never the remote FLEXCUBE/OBPS server) holding
  # failure.json/successful.json - see FlexcubeFileTrackingService. Survives a backend restart,
  # unlike FlexcubeStatsService's in-memory dashboard counters.
  state-dir: ${FLEXCUBE_STATE_DIR:./flexcube-state}
  # sftp mode only - ignored entirely when access-mode=local.
  host: ${FLEXCUBE_SFTP_HOST:}
  port: ${FLEXCUBE_SFTP_PORT:22}
  username: ${FLEXCUBE_SFTP_USERNAME:}
  private-key-path: ${FLEXCUBE_SFTP_PRIVATE_KEY_PATH:}
  passphrase: ${FLEXCUBE_SFTP_PASSPHRASE:}
  password: ${FLEXCUBE_SFTP_PASSWORD:}
  known-hosts-path: ${FLEXCUBE_SFTP_KNOWN_HOSTS_PATH:}

logging:
  level:
    com.wiredesk.mtmx: INFO
    # Set FLEXCUBE_SFTP_DEBUG_LOGGING=DEBUG in backend/.env for a stuck SFTP auth failure - shows
    # the raw SSH protocol exchange (which key algorithms were offered/tried, SSH_MSG_USERAUTH_PK_OK
    # vs FAILURE, etc.), far more detail than FlexcubeSftpClient's own log lines alone can surface.
    net.schmizz.sshj: ${FLEXCUBE_SFTP_DEBUG_LOGGING:INFO}
