important_limitation: >
  v1.3 STATUS, READ FIRST (supersedes the v1.2 note below): the v1.2 fail-closed SttlmMtd position has been revised.
  On the user's explicit direction to re-check this document's own primary worked-example source (the Bank of America
  SWIFT Reference Guide) specifically, two real cited worked examples were found showing SttlmMtd resolving to INDA -
  once with 53a present, once with 53a/54a both absent (see scope_notes SUPERSEDED DECISION HISTORY and the
  GENERATED:SttlmMtd field_mappings entry for full citations). SttlmMtd is now populated as a constant "INDA". This
  document CAN now convert a CORE MT202/MT202COV message end to end, PROVIDED Dbtr also resolves (52A or 52D present -
  see the Dbtr entries and known_limitations for that separate, still-fail-closed gap, unchanged from v1.2). The
  residual SttlmMtd gap: no source reviewed demonstrates any scenario resolving to INGA/COVE/CLRG, so this document
  will emit INDA even for a real message that should genuinely receive a different value - this is disclosed, not
  hidden, and closing it requires an equally concrete cited worked example for that trigger condition.

  As with the companion MT103 -> pacs.008 document: Swift states that the authoritative field-level MT<->MX translation
  rules are maintained in MyStandards / the Translation Portal. The sources above confirm the great majority of this
  mapping with a high degree of confidence (including a complete, consistent worked example), but a small number of
  specific points - the INGA/COVE/CLRG trigger condition for SttlmMtd (the INDA case IS now confirmed by two cited
  worked examples, see above), network validated rule C2's exact condition, and the field 103/111 -> SvcLvl/Cd lookup -
  could not be pinned down from publicly available material without guessing, and are explicitly left unresolved in
  known_limitations rather than invented.
