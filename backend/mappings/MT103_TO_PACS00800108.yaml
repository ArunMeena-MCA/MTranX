    v2.16 SOURCING CAVEAT: same as the TILTIME entry above - FROTIME is not in the official SWIFT MT103 Field 13C
    CODES table either (only CLSTIME/RNCTIME/SNDTIME are), a disclosed, unresolved gap.
    v2.21 BUG FIX: switched from llm_assisted to time_offset_format - see the CLSTIME entry's identical v2.21 note above.
  edge_cases:
