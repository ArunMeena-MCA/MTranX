- source_field: "51A"
  source_name: "Sending Institution (deliberately not value-mapped - see notes)"
  target_path: "CdtTrfTxInf.InstgAgt"
  mandatory: false
  transformation: skip_with_warning
  notes: >-
    v2.24 GAP FIX (2026-09-07, from live test case TC18): field 51A was previously entirely unmapped, causing
    checkUnmappedFields to hard-reject any message carrying it. Directly verified against the real SWIFT MT103 MRG
    (fetched and read directly, section 10 "Field 51A: Sending Institution") - two findings, neither of which
    support adding a normal value-producing entry: (1) NETWORK VALIDATED RULES states verbatim "Field 51A is only
    valid in FileAct (Error code(s): D63)" - i.e. in a standard FIN-transmitted MT103 (what this entire converter
    targets - see scope_notes), field 51A should not legitimately appear at all; its presence here is either a
    FileAct-specific message this converter isn't scoped for, or test/malformed input. (2) DEFINITION states
    verbatim "This field identifies the Sender of the message" and USAGE RULES adds "At least the first 8 characters
    of the BIC in this field must be identical to the originator of this FileAct message" - i.e. even when valid,
    51A's content is REDUNDANT with the MT header's own Sender BIC, which this document already captures
    deterministically as __MT_SENDER_BIC__ -> CdtTrfTxInf/InstgAgt (see that entry). There is therefore no distinct
    information in 51A this document doesn't already have from a more reliable source (the header), and no
    sourced target to put it in without either duplicating InstgAgt or inventing a place. DECISION: recognized via
    skip_with_warning (not no_op) so its presence is surfaced, not silently dropped, but the rest of the message is
    not blocked - matches this document's identical v2.21 treatment of 26T for the same "recognized field, correctly
    not value-mapped, presence shouldn't hard-fail the conversion" shape. target_path names the closest existing
    element (InstgAgt) for documentation only; skip_with_warning never actually writes there.
  edge_cases:
  - condition: "Field absent"
    handling: "not an error - this entry produces no value and no warning either (skip_with_warning only fires when the field IS present)"
  - condition: "Field present"
    handling: "not a hard failure - surfaced as a conversion warning citing rule D63 and the InstgAgt redundancy; value intentionally not carried anywhere separately (see notes)"

- source_field: "52A"
  source_name: "Ordering Institution, option A (BIC)"
  target_path: "CdtTrfTxInf.DbtrAgt.FinInstnId.BICFI"
  mandatory: false
  transformation: decompose_party
  decomposition:
    pattern_description: >-
      v2.9 BUG FIX: was a plain direct_copy assuming the raw value was ALWAYS a bare single-line BIC - the same bug
      class already found and fixed for 56A/57A in this document's v1.1 changelog, but never applied here despite
      this entry's OWN notes already describing an optional Party Identifier line ("must not be silently discarded").
      Field 52A's real format is "[/1!a][/34x]" (optional leading Party Identifier/account line) then
      "4!a2!a2!c[3!c]" (the BIC) - direct_copy on a genuine two-line value would corrupt BICFI. Uses the same
      strip_account_line_prefix mechanism as 56A/57A. A leading "//..." (clearing-system) line is ALSO matched by
      this broad account_line_pattern - see the new dedicated "//" entry below, which extracts the clearing-system
      content from the SAME line.
      v2.18 BUG FIX (2026-09-04, from live test case TC19): previously this was a deliberate, acknowledged
      redundancy - the "//SC123456" content ended up written to BOTH the correct ClrSysMmbId/MmbId AND, wrongly,
      DbtrAgtAcct/Id/Othr/Id as if it were a generic account identifier. That was accepted at the time because
      "this schema's decomposition model does not support" routing one extracted value two different ways by
      content. It now does: conditional_sub_element_targets.Id gained skip_pattern (new field, see
      ConditionalSubElementTarget's Javadoc) - "^/.*$" matches the captured Id value when the ORIGINAL line had a
      SECOND leading slash (a genuine account never does; account_line_pattern only strips the first "/", so a
      "//SC123456" line's captured content is "/SC123456" - itself still slash-prefixed - while a real
      "/12345678" account's captured content is "12345678", no leading slash). When skip_pattern matches, this
      sub-element is written nowhere at all, not even Othr/Id - DbtrAgtAcct now correctly stays absent for a
      clearing-system-only line, with zero behavior change for a genuine account line.
    strip_account_line_prefix: true
    account_line_pattern: "^/(.+)$"
    account_sub_element: "Id"
    sub_elements:
      BICFI: "line:0"
    sub_element_targets:
      BICFI: "CdtTrfTxInf.DbtrAgt.FinInstnId.BICFI"
    conditional_sub_element_targets:
      Id:
        skip_pattern: "^/.*$"
        pattern: "[A-Z]{2}[0-9]{2}[A-Za-z0-9]{1,30}"
        if_match_target: "CdtTrfTxInf.DbtrAgtAcct.Id.IBAN"
        else_target: "CdtTrfTxInf.DbtrAgtAcct.Id.Othr.Id"
    sub_element_case_normalize:
      BICFI: upper
    fallback_if_unparseable: raise_error
  notes: >-
    52A Ordering Institution -> DebtorAgent. BIC is mapped to FinInstnId/BICFI. If 52a is absent, the MT sender is the standard
    fallback for the mandatory DebtorAgent role in the MT103->pacs.008 translation context. The optional Party Identifier
    must not be silently discarded: account identifiers belong in DbtrAgtAcct (v2.13: now IBAN-vs-Othr conditional, see
    conditional_sub_element_targets); clearing-system identifiers require a configured
    clearing-system mapping - see the new dedicated "//" entry below for that specific case.
    v2.18: a genuine "//..." clearing-system line's captured content still starts with "/" (account_line_pattern only
    strips the FIRST slash) - now used as the skip_pattern signal to route it to NEITHER DbtrAgtAcct target, since the
    dedicated "//" entries below already own that content. A single-slash account line's captured content never starts
    with "/", so skip_pattern never fires for a real account - no behavior change for that case.
  edge_cases:
  - condition: "Field absent"
    handling: "not an error on its own - falls through to 52D, then to the Sender-BIC fallback below"
  - condition: "No leading-slash account line present"
    handling: "not an error - the common case; only BICFI is produced"

- source_field: "52A"
  source_name: "Ordering Institution, option A - clearing-system member id (line starts with '//', code stripped)"
  target_path: "CdtTrfTxInf.DbtrAgt.FinInstnId.ClrSysMmbId.MmbId"
  mandatory: false
  transformation: llm_assisted
  gate_pattern: "^//"
  notes: >-
    v2.22 BUG FIX (2026-09-07, from live test cases TC24/25/26/82/100): this and the paired ClrSysId/Cd entry below
    (and the identical pair on 56A/57A) were built in v2.9/v2.19, BEFORE the gate_pattern mechanism existed (added
    v2.21 for 13C/23E/77B, from the same root-cause class of bug). Both ran unconditionally for EVERY 52A/56A/57A
    occurrence regardless of whether a "//"-prefixed line was actually present - a plain single-line BIC with no
    clearing code (e.g. "ABNAUS33") caused this entry's own LLM call to correctly recognize "there's no // line
    here" and refuse, which - being an uncaught TransformationException - failed the WHOLE conversion, including the
    unrelated BICFI extraction that would otherwise have succeeded. Retrofitted gate_pattern: "^//" (checked with
    MULTILINE, matches a LINE starting with "//") so this entry is skipped entirely, deterministically, whenever no
    clearing-code line exists - exactly the fix already proven for 13C/23E/77B, now closing the same hole here.
    v2.9 CORRECTION (same-turn fix): the original v2.9 version of this entry output everything after "//" verbatim
    as MmbId - WRONG, caught immediately by re-extracting TARGET2 Annex 5.1.3's "ClearingSystemIdentification
    mapping" table as an image (it is embedded as a picture in the source PDF, not text - plain text extraction
    returned only the table's column headers, which is why the original entry treated the table as unrecoverable;
    re-extracted via PyMuPDF + direct visual reading instead of OCR). The table's own worked example is decisive:
    MT "52A://BL12345678\nBANKDEFF" -> XML "<ClrSysMmbId><ClrSysId><Cd>DEBLZ</Cd></ClrSysId><MmbId>12345678</MmbId></ClrSysMmbId>"
    - i.e. the content after "//" is ITSELF composite: a 2-character MT clearing-system code (here "BL") immediately
    followed by the member id (here "12345678"), NOT one opaque string. DECISION PROCEDURE: if a 52A line begins with
    "//", take the 2 characters immediately following it as the MT clearing-system code, and take remainder of that
    line (after those 2 characters) as MmbId. See the paired ClrSysId/Cd entry below for the code itself, which uses
    the exact same 2-character prefix to look up the ISO 20022 equivalent.
  edge_cases:
  - condition: "Field absent, or no line begins with '//'"
    handling: "not an error - this entry produces no value"
  - condition: "Line begins with '//' but has fewer than 2 characters after it"
    handling: "reject - malformed, cannot contain both a clearing-system code and a member id"

- source_field: "52A"
  source_name: "Ordering Institution, option A - clearing-system code (line starts with '//', first 2 chars, looked up)"
  target_path: "CdtTrfTxInf.DbtrAgt.FinInstnId.ClrSysMmbId.ClrSysId.Cd"
  mandatory: false
  transformation: llm_assisted
  gate_pattern: "^//"
  notes: >-
    v2.22 BUG FIX (2026-09-07, TC24/25/26/82/100): added gate_pattern - see the paired MmbId entry above's identical
    v2.22 note for the full root-cause explanation.
    v2.9 GAP FIX: paired with the MmbId entry above - see its notes for the worked-example citation and the same
    TARGET2 Annex 5.1.3 image table this entry's code list is transcribed from verbatim (Country / System / MT code /
    ISO 20022 code): Australia (Australian BSB) AU->AUBSB; Austria (Bankleitzahl) AT->ATBLZ; Canada (Payments
    Association Payment Routing Number) CC->CACPA; China (CNAPS Identifier) CN->CNAPS; Germany (Bankleitzahl)
    BL->DEBLZ; Greece (Hellenic Bank Identification Code) GR->GRHIC; Hong Kong (Hong Kong Bank Code) HK->HKNCC; India
    (Indian Financial System Code) IN->INFSC; Ireland (Irish National Clearing Code) IE->IENCC; Italy (Italian
    Domestic Identification Code) IT->ITNCC; Japan (Zengin Clearing Code) JP->JPZGN; New Zealand (National Clearing
    Code) NZ->NZNCC; Poland (National Clearing Code) PL->PLKNR; Portugal (National Clearing Code) PT->PTNCC; Russia
    (Central Bank Identification Code) RU->RUCBC; South Africa (National Clearing Code) ZA->ZANCC; Spain (Domestic
    Interbanking Code) ES->ESNCC; Switzerland BC Code SW->CHBCC; Switzerland SIC Code SW->CHSIC (NOTE: Switzerland
    has TWO systems sharing the same MT code "SW" - genuinely ambiguous from the MT side alone; this document does
    NOT guess which one, see edge_cases); UK (Domestic Sort Code) SC->GBDSC; US CHIPS Participant Identifier
    CP->USPID; US United States Routing Number FW->USABA. DECISION PROCEDURE: take the 2-character MT clearing-system
    code identified by the paired MmbId entry above; if it matches exactly one row in this table, output that row's
    ISO 20022 code to Cd. If it matches zero rows, or matches the ambiguous "SW" case, produce no value for Cd (the
    MmbId entry above still fires independently - a member id without a resolved ClrSysId/Cd is valid pacs.008,
    just less complete).
  edge_cases:
  - condition: "Field absent, or no line begins with '//'"
    handling: "not an error - this entry produces no value"
  - condition: "MT clearing-system code is not in the table above, or is 'SW' (ambiguous between BC Code and SIC Code)"
    handling: "not an error - do not guess; Cd is left unpopulated rather than picking arbitrarily"

- source_field: "52D"
  source_name: "Ordering Institution, option D (name/address)"
  target_path: "CdtTrfTxInf.DbtrAgt.FinInstnId"
  mandatory: false
  transformation: decompose_party
  decomposition:
    pattern_description: >
      USER-PROVIDED RULE (2026-08-28): "52D present -> DbtrAgt using the
      institution identification/address data." No exact SWIFT
      line-format spec attached for 52D specifically; reusing this
      document's existing optional-party-identifier-line convention
      (same shape already used for 50F/50K/59F) as the closest
      structurally-grounded parallel - first line beginning '/' is a
      party identifier, remaining line(s) are name/address. UNVERIFIED
      against actual 52D samples.
    strip_account_line_prefix: true
    account_line_pattern: "^/(.+)$"
    account_sub_element: "Id"
    sub_elements:
      Nm: line:0
      AdrLine:
        rule: lines_from:1
        optional: true
    sub_element_targets:
      Nm: CdtTrfTxInf.DbtrAgt.FinInstnId.Nm
      AdrLine: CdtTrfTxInf.DbtrAgt.FinInstnId.PstlAdr.AdrLine
      Id: CdtTrfTxInf.DbtrAgt.FinInstnId.Othr.Id
    fallback_if_unparseable: raise_error
  notes: >-
    52D Ordering Institution option D maps name to FinInstnId/Nm and remaining name/address lines to FinInstnId/PstlAdr/AdrLine.
    v2.1 BUG FIX: account_sub_element was declared as "Id" but had no corresponding sub_element_targets entry, so an extracted
    Party Identifier line had no destination - it would either be silently dropped or crash the renderer, contradicting this
    entry's own stated requirement that the identifier "must not be mislabelled as the institution name" (which implicitly
    assumed it was being preserved somewhere). Routed to FinInstnId/Othr/Id - the generic identifier container in
    FinancialInstitutionIdentification18, the same safe/no-guess choice already used for the CashAccount38 Othr/Id routing on
    the account-portion entries elsewhere in this document (v1.13 changelog). Not routed to ClrSysMmbId because that requires
    a specific clearing-system scheme code that cannot be reliably derived from an arbitrary "/xxx" line without a configured
    clearing-system mapping table (see known_limitations and the audit's "Recommended next engineering changes").
  edge_cases:
  - condition: "Field absent"
    handling: "not an error on its own - falls through to the Sender-BIC fallback below"
  - condition: "Content doesn't split cleanly"
    handling: "reject - do not guess"
  - condition: "First line is exactly '/' with no content after it"
    handling: "reject - malformed party-identifier line, distinct from 'no leading slash at all' (which is the normal case
      and means line:0 is the name, not an account/identifier line)"

- source_field: "__MT_SENDER_BIC__"
  source_name: "Debtor Agent fallback to the MT header Sender (Block 1) - used when 52A and 52D are both absent"
  target_path: "CdtTrfTxInf.DbtrAgt.FinInstnId.BICFI"
  mandatory: true
  transformation: conditional
  normalize_case: upper
  conditional:
    check_fields: ["52A", "52D"]
    skip_if_any_present: true
    if_none_present_field: "__MT_SENDER_BIC__"
  notes: >
    RULE: DbtrAgt is populated from field 52a's own definition - when 52A/52D are absent, the Sender IS the Ordering
    Institution, so DbtrAgt = the Sender BIC. DbtrAgt can therefore legitimately equal InstgAgt's value in that case
    (both independently derived from the same Sender), or differ when 52A/52D IS present (Ordering Institution
    differs from the Sender) - either outcome is correct, NOT a conflict or duplication between the two fields.
    v2.36 CHANGELOG (2026-09-11): this note previously led with changelog history (see below) rather than the rule
    itself - the same firstSentence()-truncation blind spot already fixed for the InstgAgt/InstdAgt entries in
    v2.32, but missed here and on the CdtrAgt fallback entry, which is exactly why the semantic audit kept
    confusing DbtrAgt/CdtrAgt with InstgAgt/InstdAgt specifically (it had clear rule text for one pair but not the
    other). Reordered so the rule leads; nothing deleted, only reordered - full original history follows below.
    v2.1 CITATION FIX: this fallback was originally recorded only as a "USER-PROVIDED RULE (2026-08-28)" with no independent
    sourcing. It is now confirmed against the official Swift MT103 Standards field definition for 52a (Ordering Institution):
    "Specifies the Financial Institution of the Ordering Customer, when different from the Sender." This is a universal
    Swift FIN usage rule on the MT103 source side itself (not a CBPR+-only or TARGET2-only convention) - by definition, 52a
    is only present when the ordering institution differs from the Sender, so its absence means the Sender IS the ordering
    institution. Mapping that semantic to DbtrAgt on the target side is a faithful translation of the source rule, independent
    of which MX target profile is in use. __MT_SENDER_BIC__ is a synthetic field populated by MtParserService from the MT
    header's Logical Terminal Address (Block 1), which was NOT read at all before this fix - only Block 4 was parsed. Same
    class of previously-unaddressed gap already flagged for Block 3/field 121 (UETR) elsewhere in this document. UNVERIFIED:
    confirm Prowide's getSender()/block1 behavior against the actual pinned version once this compiles - see MtParserService's
    own verification note.
  edge_cases:
  - condition: "52A and 52D both absent, and the MT header Sender cannot be determined"
    handling: "reject - mandatory pacs.008 element, no other sourced fallback"

- source_field: "__MT_SENDER_BIC__"
  source_name: "Instructing Agent (MT header Sender, Block 1) - the CURRENT message hop, distinct from DbtrAgt"
  target_path: "CdtTrfTxInf.InstgAgt.FinInstnId.BICFI"
  mandatory: false
  transformation: direct_copy
  normalize_case: upper
  notes: >
    RULE: InstgAgt is DELIBERATELY DISTINCT from DbtrAgt - InstgAgt is the agent at THIS specific interbank hop
    (the MT header's actual Sender, Block 1), while DbtrAgt is the originating debtor's bank (from field 52a, or
    its own separate Sender-fallback) - these two are ALLOWED to differ (e.g. a correspondent-relay scenario)
    and having the same BIC value appear in only one of them, or different BIC values in each, is NOT a
    conflict or dual-assignment error. v2.32 CHANGELOG (2026-09-08, semantic-audit false-positive, reported
    live): a user-reported CONVERSION_ERROR ("InstdAgt conflicts with DebtorAgent BIC/Sender BIC mapping...")
    was root-caused to GeminiClient.describeRules()'s firstSentence() truncation - this note previously LED
    with a changelog-dated preamble ("v2.3 GAP FIX (real-message comparison, 2026-08-31): InstgAgt/InstdAgt were
    previously entirely unmapped...") and only got to the actual InstgAgt-vs-DbtrAgt rule statement in the
    SECOND sentence, which firstSentence() never reaches - the exact same bug class already fixed once for
    field 71A's code_list (TC43) and generalized here: whichever sentence is first is ALL the semantic-audit
    model ever sees, so the actual rule must lead every note, not the history of how it was discovered. Reordered
    so the rule statement is now the first sentence; no information was deleted, only reordered - the full
    original history follows below unchanged.
    v2.3 GAP FIX (real-message comparison, 2026-08-31): InstgAgt/InstdAgt
    were previously entirely unmapped - flagged as an open gap two rounds
    earlier in this session, which the user deferred answering at the
    time. A shared reference example supplied this round shows InstgAgt
    populated from the message's actual Sender, DISTINCT from DbtrAgt
    (52a/Sender-fallback): InstgAgt/InstdAgt represent the agents at THIS
    specific interbank hop (who sent/received this particular message),
    whereas DbtrAgt/CdtrAgt represent the originating debtor's and
    ultimate creditor's banks across the whole payment chain, which can
    legitimately differ from the immediate Sender/Receiver (e.g. a
    correspondent relay). CdtTrfTxInf.InstgAgt/InstdAgt (not the
    also-optional GrpHdr-level ones) chosen to match where the shared
    reference example places them. Uses the SAME __MT_SENDER_BIC__
    synthetic field already built for the DbtrAgt fallback above (no new
    parsing needed) - unconditional direct_copy here since InstgAgt is
    genuinely optional (minOccurs=0) in the schema, unlike DbtrAgt.
  edge_cases:
  - condition: "MT header Sender cannot be determined"
    handling: "not an error - InstgAgt is optional; this entry simply produces no value"

- source_field: "56A"
  source_name: "Intermediary Institution (option A only)"
  target_path: "CdtTrfTxInf.IntrmyAgt1.FinInstnId.BICFI"
  mandatory: false
  transformation: decompose_party
  decomposition:
    pattern_description: >-
      v2.19 BUG FIX (2026-09-04, from live test case TC24): was a plain direct_copy assuming the raw value was
      ALWAYS a bare single-line BIC - the exact same bug class already found and fixed for 52A/53A/54A/55A/57A (a
      prior version of the 53A entry's own notes wrongly claimed this was "already found and fixed for 56A/57A" -
      that claim was stale/wrong for 56A specifically; this entry was never actually touched). Field 56a's real
      format is "[/1!a][/34x]" (optional leading Party Identifier line, which may itself be a "//"-prefixed
      clearing-system code per this field's own CODES section) then "4!a2!a2!c[3!c]" (the BIC) - direct_copy on a
      genuine two-line raw value copies the WHOLE multi-line string into BICFI, failing BIC pattern validation (the
      exact XSD error TC24 surfaced: "cvc-pattern-valid... Value '//FW021000089\nCHASUS33' is not facet-valid").
      Uses the identical strip_account_line_prefix + skip_pattern mechanism already proven for 52A (see that entry's
      v2.9/v2.18 notes) - skip_pattern prevents the SAME "//FW..." duplication bug TC19 found and fixed for 52A from
      recurring here.
    strip_account_line_prefix: true
    account_line_pattern: "^/(.+)$"
    account_sub_element: "Id"
    sub_elements:
      BICFI: "line:0"
    sub_element_targets:
      BICFI: "CdtTrfTxInf.IntrmyAgt1.FinInstnId.BICFI"
    conditional_sub_element_targets:
      Id:
        skip_pattern: "^/.*$"
        pattern: "[A-Z]{2}[0-9]{2}[A-Za-z0-9]{1,30}"
        if_match_target: "CdtTrfTxInf.IntrmyAgt1Acct.Id.IBAN"
        else_target: "CdtTrfTxInf.IntrmyAgt1Acct.Id.Othr.Id"
    sub_element_case_normalize:
      BICFI: upper
    fallback_if_unparseable: raise_error
  notes: >
    UHB p.225, verbatim: "comparable with the Field 56a in the legacy
    FIN message." Intermediary Agent 2/3 explicitly have "not comparable
    field in the legacy FIN message" - confirmed NOT MAPPED. Option A
    only; 56C/56D not covered.
  edge_cases:
  - condition: "Field absent"
    handling: "not an error - Min 0 per UHB p.225"
  - condition: "No leading-slash account line present"
    handling: "not an error - the common case; only BICFI is produced"

- source_field: "56A"
  source_name: "Intermediary Institution, option A - clearing-system member id (line starts with '//', code stripped)"
  target_path: "CdtTrfTxInf.IntrmyAgt1.FinInstnId.ClrSysMmbId.MmbId"
  mandatory: false
  transformation: llm_assisted
  gate_pattern: "^//"
  notes: >-
    v2.22 BUG FIX (2026-09-07, from live test cases TC24/25/26/82/100): added gate_pattern - see the identical 52A
    ClrSysMmbId/MmbId entry's v2.22 note for the full root-cause explanation (this entry ran unconditionally for
    every 56A occurrence, including a plain BIC with no "//" line - e.g. TC25's bare "56A:IRVTUS3N" - which
    correctly triggered a low-confidence refusal that, being uncaught, failed the whole conversion).
    v2.19 ADDITION (2026-09-04, from live test case TC24): mirrors the 52A clearing-system entries - same TARGET2
    "General Functional Specification of the MX/ISO 20022 migration," Annex 5.1.3 "ClearingSystemIdentification
    mapping" table, whose own worked example is decisive: MT "52A://BL12345678\nBANKDEFF" ->
    "<ClrSysMmbId><ClrSysId><Cd>DEBLZ</Cd></ClrSysId><MmbId>12345678</MmbId></ClrSysMmbId>" - i.e. the content after
    "//" is ITSELF composite: a 2-character MT clearing-system code immediately followed by the member id, not one
    opaque string. Applies identically to field 56a, which shares the same "//"-prefixed Party Identifier line
    format. DECISION PROCEDURE (inlined here, not just cross-referenced, since this entry's own llm_assisted call
    only ever sees ITS OWN notes at runtime, not another entry's): if a 56A line begins with "//", take the 2
    characters immediately following it as the MT clearing-system code, and take the remainder of that line (after
    those 2 characters) as MmbId. See the paired ClrSysId/Cd entry below for the code lookup, which uses the exact
    same 2-character prefix. TC24's own input (":56A://FW021000089\nCHASUS33") is the Fedwire worked case: code
    "FW", MmbId "021000089".
  edge_cases:
  - condition: "Field absent, or no line begins with '//'"
    handling: "not an error - this entry produces no value"
  - condition: "Line begins with '//' but has fewer than 2 characters after it"
    handling: "reject - malformed, cannot contain both a clearing-system code and a member id"

- source_field: "56A"
  source_name: "Intermediary Institution, option A - clearing-system code (line starts with '//', first 2 chars, looked up)"
  target_path: "CdtTrfTxInf.IntrmyAgt1.FinInstnId.ClrSysMmbId.ClrSysId.Cd"
  mandatory: false
  transformation: llm_assisted
  gate_pattern: "^//"
  notes: >-
    v2.22 BUG FIX (2026-09-07, TC24/25/26/82/100): added gate_pattern - see the paired MmbId entry above's identical
    v2.22 note.
    v2.19 ADDITION: paired with the MmbId entry above - see its notes for the TARGET2 Annex 5.1.3 citation. Same
    lookup table as 52A's paired entry (Country / System / MT code / ISO 20022 code), inlined here for the same
    runtime-notes-isolation reason: Australia AU->AUBSB; Austria AT->ATBLZ; Canada CC->CACPA; China CN->CNAPS;
    Germany BL->DEBLZ; Greece GR->GRHIC; Hong Kong HK->HKNCC; India IN->INFSC; Ireland IE->IENCC; Italy IT->ITNCC;
    Japan JP->JPZGN; New Zealand NZ->NZNCC; Poland PL->PLKNR; Portugal PT->PTNCC; Russia RU->RUCBC; South Africa
    ZA->ZANCC; Spain ES->ESNCC; Switzerland BC Code SW->CHBCC; Switzerland SIC Code SW->CHSIC (ambiguous, see
    edge_cases); UK SC->GBDSC; US CHIPS CP->USPID; US Fedwire FW->USABA. DECISION PROCEDURE: take the 2-character MT
    clearing-system code identified by the paired MmbId entry above; if it matches exactly one row in this table,
    output that row's ISO 20022 code to Cd. If it matches zero rows, or matches the ambiguous "SW" case, produce no
    value for Cd. TC24's own case: FW->USABA.
  edge_cases:
  - condition: "Field absent, or no line begins with '//'"
    handling: "not an error - this entry produces no value"
  - condition: "MT clearing-system code is not in the table, or is 'SW' (ambiguous)"
    handling: "not an error - do not guess; Cd is left unpopulated rather than picking arbitrarily"

- source_field: "56C"
  source_name: "Intermediary Institution, option C - Party Identifier only (no BIC), possibly a clearing code"
  target_path: "CdtTrfTxInf.IntrmyAgt1Acct.Id.Othr.Id"
  mandatory: false
  transformation: decompose_party
  decomposition:
    pattern_description: >-
      v2.23 GAP FIX (2026-09-07, from live test case TC78): field 56a option C was entirely unmapped. Directly
      verified against the real SWIFT MT103 MRG, field 56a's own FORMAT table: "Option C /34x (Party Identifier)" -
      unlike options A/B/D, there is no leading "[/1!a]" qualifier and no separate BIC line at all; the ENTIRE field
      is one line, always beginning with "/" per the format, and is either a generic account/party identifier or (per
      the spec's own CODES section for "option C, or D") a national clearing system code preceded by "//". Since
      option C never supplies a BIC, a "//"-prefixed value here is this institution's ONLY identification and
      belongs in ClrSysMmbId (see the two new entries below), not the account - skip_pattern below prevents it from
      ALSO being dumped into IntrmyAgt1Acct as a bogus account, mirroring 52A/56A(option A)/57A's identical mechanism.
    sub_elements:
      Id:
        rule: "regex:^/(.+)$"
        optional: true
    sub_element_targets:
      Id: "CdtTrfTxInf.IntrmyAgt1Acct.Id.Othr.Id"
    conditional_sub_element_targets:
      Id:
        skip_pattern: "^//.*$"
        pattern: "[A-Z]{2}[0-9]{2}[A-Za-z0-9]{1,30}"
        if_match_target: "CdtTrfTxInf.IntrmyAgt1Acct.Id.IBAN"
        else_target: "CdtTrfTxInf.IntrmyAgt1Acct.Id.Othr.Id"
    fallback_if_unparseable: raise_error
  notes: >-
    Option C never supplies a BIC (IntrmyAgt1.FinInstnId.BICFI is left unpopulated for a 56C-only message - not an
    error, BICFI is optional per the XSD). See the clearing-code entries below for the "//"-prefixed case.
  edge_cases:
  - condition: "Field absent"
    handling: "not an error - Min 0"
  - condition: "Line begins with '//' (a clearing code, not a generic account)"
    handling: "not an error here - see the ClrSysMmbId/ClrSysId entries below, which handle this case instead"

- source_field: "56C"
  source_name: "Intermediary Institution, option C - clearing-system member id (line starts with '//', code stripped)"
  target_path: "CdtTrfTxInf.IntrmyAgt1.FinInstnId.ClrSysMmbId.MmbId"
  mandatory: false
  transformation: llm_assisted
  gate_pattern: "^//"
  notes: >-
    v2.23 ADDITION (2026-09-07, TC78): unlike 56A/57A's option-A clearing entries (which pair a SEPARATE BIC line
    with an optional "//"-prefixed Party Identifier line), option C has no BIC at all - if its single line begins
    with "//", that IS this institution's identification. Directly verified against the real SWIFT MT103 MRG, field
    56a's own CODES section ("In option C, or D, Party Identifier may be used to indicate a national clearing system
    code... preceded by a double slash '//'"), which lists a LARGER code set than option A's own table: adds CH (6!n,
    CHIPS Universal Identifier) alongside the same AT/AU/BL/CC/CN/CP/ES/FW/GR/HK/IE/IN/IT/NZ/PL/PT/RU/SC/SW(x2) set
    already used for 52A/56A(A)/57A. DECISION PROCEDURE: if the (single) line begins with "//", take the 2 characters
    immediately following it as the MT clearing-system code, and the remainder as MmbId. See the paired ClrSysId/Cd
    entry below for the code lookup.
  edge_cases:
  - condition: "Field absent, or the line does not begin with '//'"
    handling: "not an error - this entry produces no value (also unreachable in practice: gate_pattern skips it)"
  - condition: "Line begins with '//' but has fewer than 2 characters after it"
    handling: "reject - malformed, cannot contain both a clearing-system code and a member id"

- source_field: "56C"
  source_name: "Intermediary Institution, option C - clearing-system code (line starts with '//', first 2 chars, looked up)"
  target_path: "CdtTrfTxInf.IntrmyAgt1.FinInstnId.ClrSysMmbId.ClrSysId.Cd"
  mandatory: false
  transformation: llm_assisted
  gate_pattern: "^//"
  notes: >-
    RULE: this is the clearing-system CODE half of 56C's "//"-prefixed clearing-system line - the MmbId entry
    right above holds the member-ID half of the SAME source line. The two are sub-parts of one value, not
    independently-derived fields that could conflict with each other.
    v2.23 ADDITION (2026-09-07, TC78): paired with the MmbId entry above. Same lookup table as 52A/56A(A)/57A's
    paired entries (Country / System / MT code / ISO 20022 code): Australia AU->AUBSB; Austria AT->ATBLZ; Canada
    CC->CACPA; China CN->CNAPS; Germany BL->DEBLZ; Greece GR->GRHIC; Hong Kong HK->HKNCC; India IN->INFSC; Ireland
    IE->IENCC; Italy IT->ITNCC; New Zealand NZ->NZNCC; Poland PL->PLKNR; Portugal PT->PTNCC; Russia RU->RUCBC; Spain
    ES->ESNCC; Switzerland BC Code SW->CHBCC; Switzerland SIC Code SW->CHSIC (ambiguous, see edge_cases); UK
    SC->GBDSC; US CHIPS Participant Identifier CP->USPID; US Fedwire FW->USABA. NOT INCLUDED: CH (CHIPS Universal
    Identifier) - this option-C/D-specific code is not in this document's existing ISO 20022 equivalence table (only
    option A's narrower code set was previously sourced with equivalents) and no verified ISO 20022 equivalent for it
    was found this round - rather than guess, CH is treated the same as any other not-in-the-table code below: MmbId
    still populates, Cd does not. DECISION PROCEDURE: take the 2-character MT clearing-system code identified by the
    paired MmbId entry above; if it matches exactly one row in this table, output that row's ISO 20022 code to Cd.
  edge_cases:
  - condition: "Field absent, or the line does not begin with '//'"
    handling: "not an error - this entry produces no value"
  - condition: "MT clearing-system code is not in the table (including CH), or is 'SW' (ambiguous)"
    handling: "not an error - do not guess; Cd is left unpopulated rather than picking arbitrarily"

- source_field: "56D"
  source_name: "Intermediary Institution (option D - name/address, no BIC)"
  target_path: "CdtTrfTxInf.IntrmyAgt1.FinInstnId"
  mandatory: false
  transformation: decompose_party
  decomposition:
    pattern_description: >-
      v2.23 GAP FIX (2026-09-07, from live test case TC79): field 56a option D was entirely unmapped - FORMAT per the
      real SWIFT MT103 MRG: "[/1!a][/34x]" (Party Identifier) then "4*35x" (Name and Address), the SAME shape already
      proven for 52D/53D/57D. Mirrors those entries' exact mechanism.
    strip_account_line_prefix: true
    account_line_pattern: "^/(.+)$"
    account_sub_element: "Id"
    sub_elements:
      Nm: "line:0"
      AdrLine:
        rule: "lines_from:1"
        optional: true
    sub_element_targets:
      Nm: "CdtTrfTxInf.IntrmyAgt1.FinInstnId.Nm"
      AdrLine: "CdtTrfTxInf.IntrmyAgt1.FinInstnId.PstlAdr.AdrLine"
    conditional_sub_element_targets:
      Id:
        pattern: "[A-Z]{2}[0-9]{2}[A-Za-z0-9]{1,30}"
        if_match_target: "CdtTrfTxInf.IntrmyAgt1Acct.Id.IBAN"
        else_target: "CdtTrfTxInf.IntrmyAgt1Acct.Id.Othr.Id"
    fallback_if_unparseable: raise_error
  notes: >-
    Option D (name/address, no BIC) - mirrors 52D/53D/57D exactly. Party Identifier (if present) routed to
    IntrmyAgt1Acct (a real account element, unlike 53a/54a/55a's SttlmAcct situation - see 53A's v2.23 note; 56a's
    account lives in CreditTransferTransaction39, not the deprecated-element-affected SettlementInstruction7).
  edge_cases:
  - condition: "Field absent"
    handling: "not an error - Min 0"
  - condition: "No leading-slash account line present"
    handling: "not an error - the common case; only Nm/AdrLine are produced"

- source_field: "71A"
  source_name: "Details of Charges"
  target_path: "CdtTrfTxInf.ChrgBr"
  mandatory: true
  transformation: code_list_lookup
  code_list:
    BEN: CRED
    OUR: DEBT
    SHA: SHAR
  notes: >
    UHB p.215, verbatim: "comparable with MT Field 71A 'Details of
    Charges'." Pairing confirmed via explicit arrows in the source
    diagram (BEN->CRED, OUR->DEBT, SHA->SHAR) - complete code set per
    the page. Target-side SLEV has "no equivalent in legacy MT messages"
    and "is removed from CBPR+ usage guideline specifications."
    v2.8 M/O CORRECTION: mandatory changed false->true, matching this entry's own edge_cases below, which already said
    "reject - Min 1 - Max 1" while the mandatory: flag said false. Field 71A is unconditionally mandatory in every MT103
    per the SWIFT MT103 Standards field table, confirmed by two independent public field-spec sources and already enforced
    at the message level by VR005.
  edge_cases:
  - condition: "Value not one of BEN/OUR/SHA"
    handling: "reject - code_list is exhaustive, no fallback"
  - condition: "Field absent"
    handling: "reject - Min 1 - Max 1 on target side per UHB p.215"

- source_field: "71F"
  source_name: "Sender's Charges - currency portion"
  target_path: "CdtTrfTxInf.ChrgsInf#0.Amt.@Ccy"
  mandatory: false
  transformation: direct_copy
  repeat_lines: true
  extract_pattern: "^([A-Z]{3})"
  allowed_pattern: "^[A-Z]{3}$"
  notes: >-
    v2.6 STRUCTURAL FIX: previously 'unsupported' (hard reject whenever 71F was present) on the reasoning that Charges7's
    Agt (agent BIC) has no source in the raw 71F value - true for the value itself, but NOT true for the field as a whole:
    SWIFT's own field 71F definition is specific about who applied the charge - "Sender's Charges: specifies the currency
    and amount of the transaction charges deducted BY THE SENDER" (i.e. already deducted before the message was sent).
    That means the charging agent for 71F IS the message Sender, already available as __MT_SENDER_BIC__ - see the paired
    Agt entry below. Split into three entries (currency, amount, agent) mirroring the 32A/33B composite-extraction pattern;
    "#0" marks this as the FIRST ChrgsInf occurrence (ChrgsInf is maxOccurs=unbounded) - 71G below uses "#1", so both can
    coexist as two separate repeated elements if both fields are present.
    v2.17 BUG FIX (2026-09-04, from live test case TC07): field 71F is explicitly repetitive per the official SWIFT MT103
    field spec ("This field may be repeated to specify to the Receiver the currency and amount of charges taken by
    preceding banks in the transaction chain... the last occurrence always gives the Sender's charges") - but this entry
    had no repetition handling at all. A message with 71F present twice crashed outright: MtParserService/ParsedMessage
    newline-joins repeated tag occurrences into one raw value ("GBP15,00\nGBP15,00"), and extract_pattern's single-line
    regex cannot match text containing an embedded newline, throwing TransformationException instead of translating.
    Fixed by adding repeat_lines: true (see FieldMapping.repeatLines / ConverterService.applyRepeatedSimpleTransformation)
    - each line of the repeated field is now extracted and transformed independently, producing N separate ChrgsInf
    occurrences (ChrgsInf#0, ChrgsInf#1, ...) matching the source's own occurrence order, rather than crashing or
    collapsing them into one. A single (non-repeated) 71F line still resolves to "#0" - byte-identical output to before
    this fix, confirmed no regression for the already-tested single-occurrence case (TC05/TC06).
    NOTE ON 71G: 71G is NOT given repeat_lines - the real SWIFT field spec's own text for 71G has no "repetitive"
    language (unlike 71F's explicit statement above), and rule C14 makes 71F and 71G mutually exclusive in every valid
    MT103 (OUR forbids 71F, SHA forbids 71G, BEN forbids 71G) - so 71F's growing "#0","#1",... indices can only ever
    collide with 71G's fixed "#1" in an already rule-violating message, not in any valid one.
  conditional_rules:
  - condition: "ChrgBr = DEBT"
    handling: "UHB p.216: only one pre-paid occurrence valid; deducted charges invalid (VR002, not machine-checked - see that rule's notes)"
  edge_cases:
  - condition: "First 3 characters not 3 uppercase letters"
    handling: "reject - do not guess currency (enforced by allowed_pattern)"
  - condition: "Field absent"
    handling: "not an error - Min 0 per UHB p.216; none of the three paired 71F entries fire"

- source_field: "71F"
  source_name: "Sender's Charges - amount portion"
  target_path: "CdtTrfTxInf.ChrgsInf#0.Amt"
  mandatory: false
  transformation: decimal_comma_to_dot
  repeat_lines: true
  extract_pattern: "^[A-Z]{3}(.+)$"
  currency_from_target_path: "CdtTrfTxInf.ChrgsInf#0.Amt.@Ccy"
  notes: >-
    RULE: this is the AMOUNT half of Sender's Charges (71F)'s currency+amount composite - the currency-portion
    entry right above holds the OTHER half of the SAME source line. Sub-parts of one value, not independently-
    derived fields that could conflict.
    Paired with the currency-portion entry above - see its notes, including the v2.17 repeat_lines fix (identical
    reasoning applies here verbatim).
    v2.26 BUG FIX (2026-09-07): added currency_from_target_path, same fix as the 32A amount entry's identical v2.26
    note (TC66) - the repeated variant (applyRepeatedSimpleTransformation) resolves the SAME "#0"->"#i" per-occurrence
    suffix on this path that it already resolves on the amount's own target_path, so each ChrgsInf occurrence pads
    against its own paired currency, not always occurrence 0's.
  edge_cases:
  - condition: "Remainder is not a valid comma-decimal number"
    handling: "reject - enforced by decimal_comma_to_dot"
  - condition: "Field absent"
    handling: "not an error"

- source_field: "71F"
  source_name: "Sender's Charges - charging agent (= MT Sender, per SWIFT field 71F's own definition)"
  target_path: "CdtTrfTxInf.ChrgsInf#0.Agt.FinInstnId.BICFI"
  mandatory: false
  transformation: conditional
  normalize_case: upper
  repeat_lines: true
  conditional:
    check_fields: ["71F"]
    if_any_present_field: "__MT_SENDER_BIC__"
    skip_if_none_present: true
  notes: >-
    Fires only when field 71F is present (gated on 71F's OWN presence, not __MT_SENDER_BIC__'s - the conditional
    mechanism checks check_fields against the full parsed source message regardless of which field this entry nominally
    reads from). Outputs the same __MT_SENDER_BIC__ value already used for the DbtrAgt/InstgAgt fallback entries -
    no new parsing needed, just a new consumer of the existing synthetic field.
    v2.17 BUG FIX: repeat_lines added (see the currency-portion entry's notes) so this fires ONCE PER 71F occurrence
    (each producing the same Sender BIC, since 71F's charging agent is always the Sender regardless of which repetition),
    landing on the same "#N" index the paired currency/amount entries derive for that occurrence - see
    ConverterService.applyRepeatedConditional. Previously this entry alone would have fired once for the whole message
    even if the currency/amount entries had somehow (post-fix) produced multiple ChrgsInf blocks, leaving every
    occurrence but the first without an Agt.
  edge_cases:
  - condition: "71F present but the MT header Sender cannot be determined"
    handling: "reject - Charges7/Agt is mandatory whenever ChrgsInf is populated at all, no other sourced fallback"

- source_field: "71G"
  source_name: "Receiver's Charges - currency portion"
  target_path: "CdtTrfTxInf.ChrgsInf#1.Amt.@Ccy"
  mandatory: false
  transformation: direct_copy
  extract_pattern: "^([A-Z]{3})"
  allowed_pattern: "^[A-Z]{3}$"
  notes: >-
    v2.6 STRUCTURAL FIX: mirrors the 71F entries above. SWIFT's field 71G definition: "Receiver's Charges: specifies the
    currency and amount of the transaction charges to be deducted BY THE RECEIVER" - the charging agent for 71G IS the
    message Receiver, already available as __MT_RECEIVER_BIC__. "#1" (not "#0") so a message carrying BOTH 71F and 71G
    produces two distinct ChrgsInf occurrences rather than one entry's fields overwriting the other's.
  edge_cases:
  - condition: "First 3 characters not 3 uppercase letters"
    handling: "reject - do not guess currency (enforced by allowed_pattern)"
  - condition: "Field absent"
    handling: "not an error - Min 0 per UHB p.216; none of the three paired 71G entries fire"

- source_field: "71G"
  source_name: "Receiver's Charges - amount portion"
  target_path: "CdtTrfTxInf.ChrgsInf#1.Amt"
  mandatory: false
  transformation: decimal_comma_to_dot
  extract_pattern: "^[A-Z]{3}(.+)$"
  currency_from_target_path: "CdtTrfTxInf.ChrgsInf#1.Amt.@Ccy"
  notes: >-
    RULE: this is the AMOUNT half of Receiver's Charges (71G)'s currency+amount composite - the currency-portion
    entry right above holds the OTHER half of the SAME source line. Sub-parts of one value, not independently-
    derived fields that could conflict.
    Paired with the currency-portion entry above - see its notes.
    v2.26 BUG FIX (2026-09-07): added currency_from_target_path, same fix as the 32A amount entry's identical v2.26
    note (TC66).
  edge_cases:
  - condition: "Remainder is not a valid comma-decimal number"
    handling: "reject - enforced by decimal_comma_to_dot"
  - condition: "Field absent"
    handling: "not an error"

- source_field: "71G"
  source_name: "Receiver's Charges - charging agent (= MT Receiver, per SWIFT field 71G's own definition)"
  target_path: "CdtTrfTxInf.ChrgsInf#1.Agt.FinInstnId.BICFI"
  mandatory: false
  transformation: conditional
  normalize_case: upper
  conditional:
    check_fields: ["71G"]
    if_any_present_field: "__MT_RECEIVER_BIC__"
    skip_if_none_present: true
  notes: "Mirrors the 71F agent entry above, using __MT_RECEIVER_BIC__ instead of __MT_SENDER_BIC__."
  edge_cases:
  - condition: "71G present but the MT header Receiver cannot be determined"
    handling: "reject - Charges7/Agt is mandatory whenever ChrgsInf is populated at all, no other sourced fallback"

- source_field: "72"
  source_name: "Sender to Receiver Info - first /INS/ occurrence"
  target_path: "CdtTrfTxInf.PrvsInstgAgt1.FinInstnId.BICFI"
  mandatory: false
  transformation: decompose_party
  decomposition:
    pattern_description: "BIC = value following /INS/ codeword; exact character-position rule not spelled out in attached
      material."
    sub_elements:
      BICFI:
        rule: "regex:/INS/(\\S+)"
        optional: true
        match_index: 0
    sub_element_targets:
      BICFI: "CdtTrfTxInf.PrvsInstgAgt1.FinInstnId.BICFI"
    sub_element_case_normalize:
      BICFI: upper
    fallback_if_unparseable: raise_error
  notes: >
    UHB p.222, verbatim: "comparable with the Field 72 first /INS/
    occurrence." Distinct from Intermediary Agent - a static/historical
    role that "transition[s] into Intermediary Agents in the potential
    return chain" (UHB p.224). Three entries below share source_field
    "72", same pattern as the two 32A entries. v1.16 BUG FIX:
    ConverterService's decompose_party handling always appends the
    sub_elements key onto target_path unless sub_element_targets
    overrides it - without the override above, this entry's actual
    output path was 'CdtTrfTxInf.PrvsInstgAgt1.FinInstnId.BICFI.BICFI'
    (target_path + '.' + 'BICFI'), an invalid double-suffixed path that
    never matched anything a validator or renderer expected. Never
    triggered before because field 72 hadn't been exercised by a test
    message yet. v1.22 BUG FIX: 'optional: true' added to BICFI - this
    entry's own edge_cases always said "No /INS/ occurrence present -> not
    an error - Min 0", but that was only true when field 72 was ABSENT
    entirely (guarded earlier in ConverterService); when field 72 IS
    present but uses a DIFFERENT codeword (e.g. /REC/, /ACC/ - field 72 is
    a general-purpose free-text field, not exclusively /INS/), the regex
    simply failed to match and, without optional:true, that counted as an
    unparseable failure - falling through to an LLM call that would also
    fail, throwing SemanticDecompositionGapException and blocking the
    ENTIRE conversion. A real MT103 with field 72 present for a different
    purpose than /INS/ is a common, not edge, case.
    v2.21 BUG FIX (2026-09-04, from live test case TC46): this entry's own note used to say
    "UNVERIFIED: regex must target the SECOND occurrence specifically" (see the second /INS/
    entry below) - now verified false. All three /INS/ entries ran the identical "/INS/(\S+)"
    pattern with a plain find(), which always returns the FIRST match no matter which entry
    asked - a message with exactly ONE /INS/ occurrence had that same BIC duplicated into
    PrvsInstgAgt1, PrvsInstgAgt2, AND PrvsInstgAgt3 instead of only this one. Added
    match_index: 0 (new engine mechanism - see DecompositionService's match_index branch) so
    this entry explicitly claims the FIRST occurrence only; the second/third entries below now
    claim index 1/2 and correctly produce no value when a second/third /INS/ isn't present.
  edge_cases:
  - condition: "No /INS/ occurrence present"
    handling: "not an error - Min 0"
  - condition: "/INS/ present but unparseable"
    handling: "reject - do not guess intended agent"

- source_field: "72"
  source_name: "Sender to Receiver Info - second /INS/ occurrence"
  target_path: "CdtTrfTxInf.PrvsInstgAgt2.FinInstnId.BICFI"
  mandatory: false
  transformation: decompose_party
  decomposition:
    pattern_description: "Same as first /INS/ above. Targets the SECOND occurrence specifically via match_index: 1
      (v2.21 - see this entry's own notes) - previously unverified whether the engine did occurrence-indexed
      matching at all; confirmed (via TC46) that it did not, now fixed."
    sub_elements:
      BICFI:
        rule: "regex:/INS/(\\S+)"
        optional: true
        match_index: 1
    sub_element_targets:
      BICFI: "CdtTrfTxInf.PrvsInstgAgt2.FinInstnId.BICFI"
    sub_element_case_normalize:
      BICFI: upper
    fallback_if_unparseable: raise_error
  notes: >
    UHB p.222, verbatim: "comparable with the Field 72 second /INS/
    occurrence." v1.16 BUG FIX: see the first /INS/ entry's notes above -
    same double-suffix path bug, same fix. v1.22 BUG FIX: same
    missing-optional:true bug as the first /INS/ entry - see its notes.
    v2.21 BUG FIX (TC46): added match_index: 1 - this entry's own note previously flagged
    this exact gap as unverified ("confirm TransformationEngine does occurrence-indexed
    matching"); it did not, and this entry was silently re-matching the FIRST /INS/
    occurrence whenever only one existed. See the first /INS/ entry's v2.21 note above.
  edge_cases:
  - condition: "No second /INS/ occurrence"
    handling: "not an error - Min 0"
  - condition: "Second /INS/ without a first"
    handling: "reject - do not guess ordering"

- source_field: "72"
  source_name: "Sender to Receiver Info - third /INS/ occurrence"
  target_path: "CdtTrfTxInf.PrvsInstgAgt3.FinInstnId.BICFI"
  mandatory: false
  transformation: decompose_party
  decomposition:
    pattern_description: "Same as second /INS/ above, targeting the THIRD occurrence via match_index: 2 (v2.21)."
    sub_elements:
      BICFI:
        rule: "regex:/INS/(\\S+)"
        optional: true
        match_index: 2
    sub_element_targets:
      BICFI: "CdtTrfTxInf.PrvsInstgAgt3.FinInstnId.BICFI"
    sub_element_case_normalize:
      BICFI: upper
    fallback_if_unparseable: raise_error
  notes: >
    UHB p.222, verbatim: "comparable with the Field 72 third /INS/
    occurrence." UHB p.225: if all three Previous Instructing Agents are
    populated, Intermediary Agent should not also be used (VR004).
    v1.16 BUG FIX: see the first /INS/ entry's notes above - same
    double-suffix path bug, same fix. v1.22 BUG FIX: same
    missing-optional:true bug as the first /INS/ entry - see its notes.
    v2.21 BUG FIX (TC46): added match_index: 2 - see the first /INS/ entry's v2.21 note above.
  edge_cases:
  - condition: "No third /INS/ occurrence"
    handling: "not an error - Min 0"
  - condition: "Third /INS/ without first/second"
    handling: "reject - do not guess ordering"

- source_field: "72"
  source_name: "Sender to Receiver Info - /ACC/ codeword (instruction for the Creditor Agent)"
  target_path: "CdtTrfTxInf.InstrForCdtrAgt.InstrInf"
  mandatory: false
  transformation: llm_assisted
  notes: >-
    v2.9 GAP FIX: field 72 previously had entries for ONLY the /INS/ codeword (-> PrvsInstgAgt1/2/3 above) - every
    other codeword's content was silently dropped, not carried forward anywhere. Confirmed as a real gap, not a
    deliberate exclusion, by a concrete worked example in JPMorgan's "Migration to ISO 20022" guide (section 5.a,
    MT103 -> pacs.008): source ":72:/ACC/Instruct for creditor agent\n/PRIORITY/\n/FND/" produced
    "<InstrForCdtrAgt><InstrInf>Instruct for creditor agent</InstrInf></InstrForCdtrAgt>" in the actual pacs.008
    output - i.e. the free text following the /ACC/ codeword (up to the next codeword or end of field) maps here.
    TARGET2's Annex 5.1.1 is consistent with this in spirit ("None of the codes defined for use in MT field 72 are
    individually mapped with exception of code /INS/") but doesn't name /ACC/ specifically - the JPMorgan worked
    example is the concrete evidence for this exact codeword. DECISION PROCEDURE: scan field 72's lines/segments; if
    one begins with the codeword /ACC/, output the text following it (up to the next "/CODE/" codeword or end of
    field). If no /ACC/ segment exists, output nothing - not an error.
  edge_cases:
  - condition: "Field absent, or no /ACC/ codeword present"
    handling: "not an error - InstrForCdtrAgt is optional; this entry simply produces no value"

- source_field: "72"
  source_name: "Sender to Receiver Info - remaining codeword content (not /INS/ or /ACC/)"
  target_path: "CdtTrfTxInf.InstrForNxtAgt#0.InstrInf"
  mandatory: false
  transformation: llm_assisted
  max_chunk_length: 140
  notes: >-
    RULE: this entry captures any field 72 codeword OTHER than /INS/ (-> PrvsInstgAgt1/2/3) or /ACC/ (-> the
    entry directly above, InstrForCdtrAgt.InstrInf) - routed here to Instruction-for-Next-Agent instead, as
    literal, undecoded codeword text.
    v2.9 GAP FIX: paired with the /ACC/ entry above - see its notes for the sourcing. The SAME JPMorgan worked
    example's remaining codewords ("/PRIORITY/" and "/FND/", neither of which is /INS/ or /ACC/) were collected into
    "<InstrForNxtAgt><InstrInf>/PRIORITY/ /FND/</InstrInf></InstrForNxtAgt>" - i.e. left as literal codeword text,
    space-joined, NOT further interpreted or decoded (this document has no sourced meaning for /PRIORITY/ or /FND/
    specifically, and does not invent one). DECISION PROCEDURE: scan field 72's lines/segments; collect every
    segment that is NOT the /INS/ codeword (handled by the three PrvsInstgAgt entries above) and NOT the /ACC/
    codeword (handled by the entry above), preserving their literal text, and join them with a single space. If no
    such segments exist, output nothing - not an error. RESIDUAL GAP: only one worked example was available, and it
    only demonstrates two codewords (/PRIORITY/, /FND/) with no trailing content of their own - a codeword carrying
    its own free text after it (the way /ACC/ does) is unverified for this entry; treat this decision procedure as
    correct for bare codewords only until a richer example is found.
    v2.27 BUG FIX (2026-09-08, from live test case TC129): field 72 permits up to 6 lines of 35 characters (210
    chars total) with NO codeword anywhere - the DECISION PROCEDURE above still collects it all correctly, but the
    combined text then failed XSD validation outright once it exceeded InstrInf's Max140Text limit, even though the
    source content was entirely valid, standard-permitted field 72 usage. Confirmed directly against
    pacs.008.001.08.xsd: InstrForNxtAgt itself is maxOccurs="unbounded" (the same repeatable-container shape already
    fixed for InstrForCdtrAgt/23E - see that entry's v2.27 note) - so content over 140 chars is now split across
    MULTIPLE InstrForNxtAgt occurrences (max_chunk_length: 140, whitespace-boundary chunking, see
    TransformationEngine.chunkText) instead of being force-fit into one. A single occurrence (the overwhelming
    majority of real messages) resolves to "#0", byte-identical to before this fix.
  edge_cases:
  - condition: "Field absent, or every segment is /INS/ or /ACC/"
    handling: "not an error - InstrForNxtAgt is optional; this entry simply produces no value"
  - condition: "Combined content exceeds 140 characters"
    handling: "split across multiple InstrForNxtAgt#0/#1/... occurrences at whitespace boundaries, not truncated or rejected"

- source_field: "70"
  source_name: "Remittance Info - End To End Id portion (/ROC/ codeword)"
  target_path: "CdtTrfTxInf.PmtId.EndToEndId"
  mandatory: false
  transformation: decompose_party
  decomposition:
    pattern_description: >
      If field begins /ROC/<value>/, <value> = End To End Id. Evidenced
      only in REVERSE direction (pacs.008->MT103) in
      inflow_translation_sample_messages_2025Q3 (e.g. TRAK/TROK/TRNR:
      EndToEndId "e2eid-pacs.008-001" -> ":70:/ROC/e2eid-pacs.008-001").
      Also documented for MT101-to-pacs.008 in
      Derived_Mapping_Guidance.pdf p.10 - a DIFFERENT message type.
      Applying to MT103 forward conversion is extrapolation, not a
      direct citation.
    sub_elements:
      EndToEndId:
        rule: "regex:/ROC/([^/\\n]*)"
        optional: true
    sub_element_targets:
      EndToEndId: "CdtTrfTxInf.PmtId.EndToEndId"
    fallback_if_unparseable: raise_error
  notes: >
    Split from the Ustrd entry below (one target_path per entry). v1.16
    BUG FIX: without the override above, this entry's actual output path
    was 'CdtTrfTxInf.PmtId.EndToEndId.EndToEndId' (target_path + '.' +
    'EndToEndId') - meaning EndToEndId was NEVER actually populated by
    this entry even when /ROC/ was present; every conversion silently
    fell through to the target_defaults NOTPROVIDED fallback instead.
    Same double-suffix bug as the 72/INS and 50A/59A-BIC entries.
    v2.20 CRITICAL BUG FIX (2026-09-04, from live test cases TC35/36/39/40): the sub_elements.EndToEndId regex was a
    BARE STRING, not the map form with optional: true - meaning DecompositionService.isOptional() returned false
    for it regardless of this entry's OWN edge_cases already saying "Field doesn't begin /ROC/ -> not an error." Any
    field 70 value NOT starting with "/ROC/" (a plain /INV/, /RFB/, /TSU/ reference, or a bare ISO 11649 RF
    reference with no codeword at all - i.e. the vast majority of real-world field 70 usage, since /ROC/ is only one
    of five defined codewords) failed to match, set allMatched=false, and fell through to the guided LLM fallback -
    which, given this entry's own pattern_description ONLY describes the /ROC/ case, correctly (from the LLM's own
    perspective) refused rather than guessed, throwing SemanticDecompositionGapException and rejecting the ENTIRE
    message, not just this one optional field. This is the single most severe defect found in this document's own
    testing to date - field 70 is optional and free-form by design, so a field 70 that merely doesn't start with
    /ROC/ should never be able to reject an otherwise-valid message. Fixed by declaring optional: true, matching
    what the edge_cases below already, correctly, said should happen.
    v2.22 CRITICAL BUG FIX (2026-09-07, from live test cases TC37/38/50): the v2.20 fix above closed the crash, but
    the regex itself was still wrong for the mainstream case. Two separate defects: (1) "^/ROC/([^/]+)/" required a
    TRAILING slash after the captured value - but the real input in every one of these tests (":70:/ROC/
    CUSTREF20260315AB") and even this document's OWN cited worked example ("/ROC/e2eid-pacs.008-001", see the
    original pattern_description above) has NO trailing slash at all. The correct SWIFT field 70 shape is
    "/CODE/value" where the value runs to the next "//CODE/" boundary, a newline, or end of field - never a bare
    trailing single slash. (2) The leading "^" anchored the match to the absolute start of the raw value, so TC38's
    "/INV/2026-778/ABC-99//ROC/CUSTREF778899" (a SECOND codeword appearing after "//" mid-line, which the real SWIFT
    field 70 spec explicitly permits) could never match at all - /ROC/ simply isn't at position 0 there. Fixed by
    dropping both the anchor and the trailing-slash requirement: "/ROC/([^/\\n]*)" finds the literal "/ROC/" token
    anywhere in the value (unanchored, matching field 72's already-proven /INS/ extraction's own un-anchored style)
    and captures everything up to the next "/" or newline (or end of string) as the value - correctly handling a
    lone "/ROC/value" (TC37/50) and a mid-line "//ROC/value" following another codeword (TC38) identically.
  edge_cases:
  - condition: "Field doesn't contain /ROC/"
    handling: "not an error - entry doesn't fire; EndToEndId falls back to NOTPROVIDED default (UHB p.209)"
  - condition: "/ROC/ present but unparseable"
    handling: "reject - do not guess"

- source_field: "70"
  source_name: "Remittance Info - free-text portion"
  target_path: "CdtTrfTxInf.RmtInf.Ustrd"
  mandatory: false
  transformation: decompose_party
  decomposition:
    pattern_description: "Content after any /ROC/<value> prefix (or entire field if no /ROC/) = Remittance Info. Same directionality
      caveat as the EndToEndId entry above. v2.22: trailing-slash requirement dropped from the optional /ROC/-prefix
      strip, matching the EndToEndId entry's identical v2.22 fix - see its notes for the full explanation."
    sub_elements:
      Ustrd:
        rule: "regex:^(?:/ROC/[^/\\n]*)?(.*)$"
        optional: true
        concat: true
    sub_element_targets:
      Ustrd: "CdtTrfTxInf.RmtInf.Ustrd"
    fallback_if_unparseable: raise_error
  notes: >
    v1.16 BUG FIX: without the override above, this entry's actual
    output path was 'CdtTrfTxInf.RmtInf.Ustrd.Ustrd' - same
    double-suffix bug as the EndToEndId entry above and the 72/INS and
    50A/59A-BIC entries; RmtInf/Ustrd was never actually populated by
    this entry before this fix.
    UHB p.243 gives the 140-char target limit ("to ensure backward
    compatibility... during coexistence") but does not itself cite
    Field 70 by name - correspondence inferred from naming symmetry plus
    /ROC/ sample evidence.
    v2.22 BUG FIX (2026-09-07, from live test case TC84): field 70 can legitimately carry up to 4 lines of narrative
    (SWIFT format "4*35x"), newline-joined by this engine's field parser into one raw value - but this entry's regex
    ran under Pattern.MULTILINE without Pattern.DOTALL, so "." never crosses a newline, and with no all_matches/
    concat flag set, find() returned only the FIRST match (the first line) and stopped - lines 2-4 of a genuine
    multi-line, no-codeword field 70 were silently dropped, a severe, undetected data-loss bug (same underlying
    "repeated occurrence" class as 71F/50F/59F/13C/23E elsewhere in this document, just manifesting differently
    here since this entry wasn't a numbered/codeword line to begin with). Fixed with concat: true - each line
    independently matches (MULTILINE's per-line boundaries, the optional /ROC/-prefix strip only consuming a line that
    actually starts with it), and all surviving lines are space-joined into one Ustrd value, preserving the full
    narrative instead of only its first line.
    v2.24 BUG FIX (2026-09-07, from live test cases TC37/50/100, introduced by the v2.22 concat fix above): a field
    70 that is ONLY "/ROC/value" (nothing else - TC37/TC50/TC100's exact case) now has EVERY line's regex match
    consumed entirely by the optional /ROC/-prefix strip, producing a single EMPTY captured string - concat still
    joined it (String.join on a one-element list containing "" is still ""), and that empty value was written
    unconditionally into RmtInf/Ustrd by ConverterService's decompose_party handling (which, unlike llm_assisted,
    had no blank-value guard), producing an empty <Ustrd/> element and failing XSD minLength validation. Root cause
    was in ConverterService, not this entry's own regex - fixed generically there (any decompose_party sub-element
    now skips writing when its value is blank, matching llm_assisted's existing behavior) rather than special-cased
    here. TC38 (which has real leftover content after /ROC/ is stripped) was never affected - this only manifests
    when literally nothing survives.
  edge_cases:
  - condition: "Combined content exceeds 140 chars"
    handling: >
      reject rather than silently truncate. Sample TRNR
      (inflow_translation_sample_messages_2025Q3): a 139-char source
      Ustrd was still truncated once /ROC/ was appended - budget is
      shared with the codeword, no exact formula sourced.
  - condition: "Field absent"
    handling: "not an error - optional"

- source_field: "23B"
  source_name: "Bank Operation Code"
  target_path: "CdtTrfTxInf.PmtTpInf.LclInstrm.Prtry"
  mandatory: true
  transformation: direct_copy
  notes: >-
    23B:CRED/SPAY/SSTD/SPRI/CRTS -> PmtTpInf/LclInstrm/Prtry is retained. This is corroborated by public ISO migration mapping
    material and current commercial MT103/pacs.008 mapping guides, and is consistent with the ISO purpose of LocalInstrument.
    However, the exact current CBPR+ field-level rule is maintained in Swift MyStandards/Translation Portal and is not publicly
    retrievable here; therefore this entry is NOT labelled as directly Swift-portal-certified. Do not remap 23B to SvcLvl/Cd:
    that would be a closed ISO code-list guess.
    v2.8 M/O CORRECTION: mandatory changed false->true. Field 23B (Bank Operation Code) is unconditionally mandatory in every
    MT103 per the SWIFT MT103 Standards field table - confirmed consistently by two independent public field-spec sources
    (Paiementor's MT103 format specification table and iotafinance's MT103 detail view), and already independently enforced
    at the message level by this document's own VR005 (source_alternative_group_required, required_source_fields includes
    "23B"). This entry's own mandatory flag was left at the old placeholder false despite that - now corrected to match,
    giving a second, field-level layer of the same protection VR005 already provides at the message level (same
    defense-in-depth pattern as VR006). See the superseded "M/O status" known_limitations entry for why every field was
    originally left false.
  edge_cases:
  - condition: "Field absent"
    handling: "reject - field 23B is unconditionally mandatory per the SWIFT MT103 standard (v2.8); also caught earlier,
      pre-conversion, by VR005 via ConversionOrchestrator.checkMandatorySourceFields()"
  - condition: "Value contains characters invalid for LclInstrm/Prtry per the pacs.008 XSD"
    handling: "reject - do not silently strip or re-encode; no sourced rule for how to handle this"

- source_field: "50A"
  source_name: "Ordering Customer, option A - full decomposition (BIC + optional account, IBAN/Othr split)"
  target_path: "CdtTrfTxInf.Dbtr.Id.OrgId.AnyBIC"
  mandatory: false
  transformation: decompose_party
  decomposition:
    pattern_description: >-
      Source: user-provided top-level mapping (Field 50 -> Debtor). Format "[/34x]" (optional leading account line)
      then "4!a2!a2!c[3!c]" (the BIC), same general shape as 52A/53A/54A/55A/56A/57A's option-A fields.
      v2.22 REDESIGN (2026-09-07, from investigating the same architecture class of bug that broke 52A/56A/57A -
      TC24-26/82/100): this entry was previously THREE separate entries - this decompose_party BIC extraction plus
      two unconditional llm_assisted calls for the IBAN-vs-Othr account routing (v2.11). That dual-llm_assisted
      pattern is the IDENTICAL vulnerability shape already found and fixed for 52A/56A/57A's clearing-code entries
      in v2.22: a value that clearly IS (or clearly is NOT) an IBAN could still cause the "wrong" entry's own LLM
      call to hesitate and refuse, which - being an uncaught TransformationException - would fail the whole
      conversion even though 50A's OWN companion field (50F/50K, mutually exclusive with 50A) was never touched by
      this bug in the same way, because 50F/50K already use the deterministic conditional_sub_element_targets
      mechanism (built in v2.13, AFTER this entry's v2.11 IBAN/Othr split) instead. Not yet triggered by any test,
      but the same class of latent bug - retrofitted proactively to the same proven mechanism every other
      party/agent account field in this document already uses: strip_account_line_prefix extracts the optional
      leading account line deterministically, and conditional_sub_element_targets routes it to IBAN or Othr/Id by
      testing its own shape with a plain regex - no LLM call anywhere in this entry at all.
    strip_account_line_prefix: true
    account_line_pattern: "^/(.+)$"
    account_sub_element: "AccountId"
    sub_elements:
      BIC: "line:0"
    sub_element_targets:
      BIC: "CdtTrfTxInf.Dbtr.Id.OrgId.AnyBIC"
    conditional_sub_element_targets:
      AccountId:
        pattern: "[A-Z]{2}[0-9]{2}[A-Za-z0-9]{1,30}"
        if_match_target: "CdtTrfTxInf.DbtrAcct.Id.IBAN"
        else_target: "CdtTrfTxInf.DbtrAcct.Id.Othr.Id"
    sub_element_case_normalize:
      BIC: upper
    fallback_if_unparseable: raise_error
  notes: >
    Split into per-option entries (50A/50F/50K) - Prowide never reports
    a bare "50". v1.16 BUG FIX: without the override above, this
    entry's actual output path was
    'CdtTrfTxInf.Dbtr.Id.OrgId.AnyBIC.BIC' - same double-suffix bug as
    the 72/INS and 70 entries; Dbtr's BIC was never actually populated
    by this entry before this fix.
    NOTE (v2.22): this is a structural IBAN pattern check only, not a full ISO 7064 mod-97 checksum validation - a
    string that merely LOOKS like an IBAN (right shape, wrong checksum) is still routed to IBAN; this document does
    not attempt checksum validation, consistent with its "no invented complexity beyond what's sourced" stance.
  edge_cases:
  - condition: "Content doesn't split into account line + BIC"
    handling: "reject - do not guess"
  - condition: "Field absent"
    handling: "not an error; M/O unverified"
  - condition: "No leading-slash account line present"
    handling: "not an error - the common case; only BIC is produced"

- source_field: "50F"
  source_name: "Ordering Customer, option F - full decomposition (account, name, structured address)"
  target_path: "CdtTrfTxInf.Dbtr"
  mandatory: false
  transformation: decompose_party
  decomposition:
    pattern_description: >-
      ENGINE FIX (v2.15, 2026-09-03): previously six separate llm_assisted entries (account IBAN/Othr split, plus
      one llm_assisted call per numbered line). Consolidated into one decompose_party entry, mirroring the already
      -proven 50K/bare-59 pattern (strip_account_line_prefix + conditional_sub_element_targets for IBAN-vs-Othr
      routing, structured_address for libpostal enrichment) instead of leaving 50F as the only customer-party field
      not using this document's own established mechanism. Numbered-line format (1/=Name, 2/=AddressLine,
      3/=Country+TownName) per TARGET2 Annex 5.1.2 and JPMorgan's worked example (already cited in the prior
      version, retained). Name/Ctry/TwnNm extraction is now deterministic regex, not an LLM call - the position is
      fixed once a line is confirmed to start with "1/"/"2/"/"3/", the same reasoning the prior version already gave
      for using extract_pattern on the Ctry sub-entry specifically, now applied consistently to all three.
      SOURCED CORRECTION (Bank of America "PACS 008 and MT 103 Commercial payments formatting guide," fetched and
      read directly 2026-09-03): its own 50F worked example (":50F:/12345678\n1/ABC Corporation\n2/123 Main
      Street\n3/ISO Country Code /\nAnytown, State,\n55555") resolves to FULLY STRUCTURED PstlAdr
      (StrtNm/TwnNm/PstCd/Ctry), not a single unstructured AdrLine - confirming structured output is the correct
      target shape now, not merely a November 2026 future requirement as an earlier review of this field assumed.
      AdrLine is still populated too, unchanged - this document's existing "hybrid address" policy (see the ADDRESS
      POLICY note and the 50K/bare-59 entries) adds structured fields ALONGSIDE the free-text fallback, never
      instead of it.
      Country/TownName stay on the deterministic line-3 regex (more reliable than a general-purpose address parser
      for a field that explicitly names its own country code). Street/PostCode have no equivalent deterministic
      source in the numbered-line format - line 2 is free text, and no corroborating source for a dedicated
      building/postcode line was ever found for 50F specifically (same RESIDUAL GAP already noted for lines 4-8) -
      so ONLY those two are routed through the same libpostal structured_address enrichment 50K/bare-59 already use,
      opt-in and confidence-gated.
      IMPORTANT, checked deliberately: structured_address.targets below does NOT include city/country even though
      ParsedAddress can produce them. ConverterService.enrichWithStructuredAddress() unconditionally overwrites
      whatever is already at a target_path (tree.put(), not put-if-absent) - mapping city/country there too would
      let a less-certain libpostal guess silently clobber the more-certain, directly-cited line-3 regex extraction
      above. This was checked against the actual ConverterService code, not assumed.
      v2.18 BUG FIX (2026-09-04, from live test case TC14): the SWIFT field spec explicitly permits numbers 1, 2 and
      3 to repeat (max twice each) - a two-line street address is a realistic, spec-legal input (e.g. "2/INDUSTRIE
      STRASSE 45" then "2/GEBAUDE C, 3RD FLOOR"). DecompositionService's regex sub_elements previously used
      Matcher.find() once, silently discarding every occurrence after the first. AdrLine's rule now sets
      all_matches: true (new opt-in flag, see DecompositionService), producing AdrLine#0/AdrLine#1/... via the same
      "#N" repeated-element convention lines_from already uses for 50K/bare-59 - both lines now survive.
      Deliberately NOT applied to Nm or Ctry/TwnNm: a repeated "1/" or "3/" line is meant to be concatenated into one
      longer value (Dbtr/Nm and Dbtr/PstlAdr/Ctry are not repeatable in the XSD - splitting them into multiple
      elements would produce invalid XML), not split into separate elements the way AdrLine genuinely can be
      (PostalAddress24/AdrLine is maxOccurs=7). No worked example or citation for HOW to concatenate a repeated
      Nm/Ctry/TwnNm was found, so that case remains unhandled (single occurrence still works; a second occurrence of
      "1/" or "3/" is silently dropped, same as before) rather than guessed at.
      v2.18 GAP FIX (2026-09-04, from live test cases TC13/TC15/TC16): two previously entirely-unimplemented parts of
      field 50a's own official SWIFT spec, now added using the exact citations already fetched and read directly
      this session (Standards MT November 2021, section 9 "Field 50a: Ordering Customer"):
      (1) Subfield 1 (Party Identifier) in the "(Code)(Country Code)(Identifier)" format - one line, e.g.
      "CCPT/US/AB1234567" (format "4!a/2!a/27x") - codes ARNU/CCPT/CUST/DRLC/EMPL/NIDN/SOSE/TXID. Routed to
      Dbtr/Id/PrvtId/Othr per pacs.008.001.08.xsd's real Party38Choice (OrgId|PrvtId) - GenericPersonIdentification1
      = {Id, SchmeNm?, Issr?}. IdNumber->Othr/Id, IdCode->Othr/SchmeNm/Prtry (NOT SchmeNm/Cd - Cd is typed
      ExternalPersonIdentification1Code, an ISO EXTERNAL code list this document has no verified MT-code-to-ISO-code
      table for; Prtry is the correct choice-branch for "not drawn from the enumerated external list," and preserves
      the exact SWIFT codeword unambiguously rather than guessing an ISO equivalent), IdCountry->Othr/Issr (a
      reasonable, but NOT directly-cited, structural placement for "which country's registry issued this identifier"
      - Issr is generic Max35Text, not a dedicated country-code element; flagged as a judgment call, not a worked
      example).
      (2) Numbers 4 (Date of Birth, format YYYYMMDD) and 5 (Place of Birth, "ISO country code, slash, place") ->
      Dbtr/Id/PrvtId/DtAndPlcOfBirth (BirthDt/CityOfBirth/CtryOfBirth all mandatory per DateAndPlaceOfBirth1's XSD
      when that element is used at all). BirthDt reformatted YYYYMMDD->YYYY-MM-DD via the new regex_date_yyyymmdd:
      rule (ISODate requires dashes; the raw MT value has none - see DecompositionService). The SWIFT spec's own
      pairing rule ("Number 4 must not be used without number 5 and vice versa") is NOT enforceable inside this
      per-sub-element-independently-optional decomposition model - each of the three DtAndPlcOfBirth sub-elements is
      independently optional here, so a message violating the pairing would otherwise silently produce a PARTIALLY
      populated (and therefore XSD-invalid) DtAndPlcOfBirth. Enforced instead post-conversion via VR010 (new
      target_presence_requires_target_presence rule), which rejects that case with a clear validation error rather
      than emitting invalid XML.
      Deliberately NOT extended to 59F: the fetched SWIFT spec's own CODES section for field 59a documents only
      numbers 1/2/3 (Name/AddressLine/Country+Town) - it does NOT repeat the identity-code or DOB/POB table for 59a
      the way it does for 50a. Adding this to 59F would be an unsourced extrapolation, the exact "by analogy, lower
      confidence" pattern this document has already been burned by once (see 59F's own v2.15/v2.16 changelog) and is
      now deliberately avoiding.
      v2.20 BUG FIX (2026-09-04, from live test case TC32): Ctry's regex required a TRAILING slash ("^3/([A-Z]{2})/"),
      implicitly requiring a town to follow - but the spec explicitly says number 3's town detail is optional ("the
      first occurrence of number 3 must be followed by... the ISO country code and, OPTIONALLY, additional
      details"). A bare "3/SG" (country, no town) silently failed to match (optional:true meant this wasn't a hard
      failure, just silent data loss - Ctry simply never appeared). Fixed to "^3/([A-Z]{2})(?:/|$)", accepting the
      country code at end-of-line OR followed by "/" and more content.
      v2.20 GAP FIX (from live test case TC34): repeated "1/" (Name) lines - explicitly permitted by the spec
      ("Numbers 1, 2, and 3 may be repeated") - were previously silently dropped after the first occurrence (same
      class of bug as TC14's AdrLine issue, but Nm can't use all_matches: true since Dbtr/Nm is not repeatable in
      the XSD). Nm now uses the new concat: true flag (see DecompositionService) - all matches space-joined into
      ONE value instead of split into multiple elements or dropped.
    strip_account_line_prefix: true
    account_line_pattern: "^/(.+)$"
    account_sub_element: "AccountId"
    sub_elements:
      Nm:
        rule: "regex:^1/(.+)$"
        optional: true
        concat: true
      AdrLine:
        rule: "regex:^2/(.+)$"
        optional: true
        all_matches: true
      Ctry:
        rule: "regex:^3/([A-Z]{2})(?:/|$)"
        optional: true
      TwnNm:
        rule: "regex:^3/[A-Z]{2}/(.+)$"
        optional: true
      IdCode:
        rule: "regex:^(ARNU|CCPT|CUST|DRLC|EMPL|NIDN|SOSE|TXID)/[A-Z]{2}/.+$"
        optional: true
      IdCountry:
        rule: "regex:^(?:ARNU|CCPT|CUST|DRLC|EMPL|NIDN|SOSE|TXID)/([A-Z]{2})/.+$"
        optional: true
      IdNumber:
        rule: "regex:^(?:ARNU|CCPT|CUST|DRLC|EMPL|NIDN|SOSE|TXID)/[A-Z]{2}/(.+)$"
        optional: true
      BirthDt:
        rule: "regex_date_yyyymmdd:^4/(\\d{8})$"
        optional: true
      CtryOfBirth:
        rule: "regex:^5/([A-Z]{2})/"
        optional: true
      CityOfBirth:
        rule: "regex:^5/[A-Z]{2}/(.+)$"
        optional: true
    sub_element_targets:
      Nm: "CdtTrfTxInf.Dbtr.Nm"
      AdrLine: "CdtTrfTxInf.Dbtr.PstlAdr.AdrLine"
      Ctry: "CdtTrfTxInf.Dbtr.PstlAdr.Ctry"
      TwnNm: "CdtTrfTxInf.Dbtr.PstlAdr.TwnNm"
      IdCode: "CdtTrfTxInf.Dbtr.Id.PrvtId.Othr.SchmeNm.Prtry"
      IdCountry: "CdtTrfTxInf.Dbtr.Id.PrvtId.Othr.Issr"
      IdNumber: "CdtTrfTxInf.Dbtr.Id.PrvtId.Othr.Id"
      BirthDt: "CdtTrfTxInf.Dbtr.Id.PrvtId.DtAndPlcOfBirth.BirthDt"
      CtryOfBirth: "CdtTrfTxInf.Dbtr.Id.PrvtId.DtAndPlcOfBirth.CtryOfBirth"
      CityOfBirth: "CdtTrfTxInf.Dbtr.Id.PrvtId.DtAndPlcOfBirth.CityOfBirth"
    conditional_sub_element_targets:
      AccountId:
        pattern: "[A-Z]{2}[0-9]{2}[A-Za-z0-9]{1,30}"
        if_match_target: "CdtTrfTxInf.DbtrAcct.Id.IBAN"
        else_target: "CdtTrfTxInf.DbtrAcct.Id.Othr.Id"
    structured_address:
      source_sub_element: "AdrLine"
      targets:
        street: "CdtTrfTxInf.Dbtr.PstlAdr.StrtNm"
        postcode: "CdtTrfTxInf.Dbtr.PstlAdr.PstCd"
    fallback_if_unparseable: raise_error
  notes: >-
    RESIDUAL GAP (unchanged from the prior version): TARGET2's Annex 5.1.2 also documents numbered lines 4-8 for
    50F (BirthDate, CountryOfBirth/CityOfBirth, PrivateIdentification/Other with scheme codes) - NOT implemented
    here; that part of the source table had layout/ordering issues and no corroborating worked example, so
    implementing it would have been a guess. StrtNm/PstCd depend on the address-parser sidecar being enabled and
    confident (mtmx.address-parser-enabled) - if disabled or unreachable, AdrLine alone is still populated, exactly
    today's behavior; this is a strict enhancement, never a regression path.
  edge_cases:
  - condition: "No account line present"
    handling: "not an error - AccountId is simply left unpopulated from this source, the common case"
  - condition: "Leading slash present with empty content after it"
    handling: "reject - genuinely malformed, distinct from no-account-line-at-all"
  - condition: "Field absent, or no line begins with '1/'/'2/'/'3/'"
    handling: "not an error - the corresponding sub-element simply produces no value"
  - condition: "Line begins with '3/' but is not followed by a 2-letter uppercase country code"
    handling: "reject - do not guess the country"
  - condition: "Address parser sidecar disabled, unreachable, or not confident"
    handling: "not an error - StrtNm/PstCd simply stay unpopulated; AdrLine (already written) is unaffected"

- source_field: "50K"
  source_name: "Ordering Customer, option K - name/address portion"
  target_path: "CdtTrfTxInf.Dbtr"
  mandatory: false
  transformation: decompose_party
  anti_gate_pattern: "(?m)^\\d/"
  decomposition:
    pattern_description: >
      USER-PROVIDED RULE (2026-08-31, business-correctness review):
      MT103 field 50K (Ordering Customer) maps to pacs.008 Dbtr -
      name/address, not just the account portion the entry above
      already extracts. 50K carries PLAIN unstructured lines (unlike
      50F's numbered 1/2/3/ line-code convention - see the 50F entry
      above), so: first non-account line = Nm; every remaining line =
      its own repeated AdrLine (PostalAddress24/AdrLine, maxOccurs=7).
      CORRECTION (v2.15, 2026-09-03): this note previously said
      "EXPLICITLY NOT decomposing address text into TwnNm/Ctry/PstCd" -
      stale prose left behind when the structured_address block below
      was added; the two directly contradicted each other. This entry
      DOES now derive StrtNm/PstCd via the libpostal structured_address
      sidecar (see structured_address below), confidence-gated and
      additive to AdrLine, never replacing it - the "hybrid address"
      model SWIFT requires from 14 November 2026 (structured fields
      ALONGSIDE unstructured AdrLine, confirmed against the Bank of
      America PACS008/MT103 guide's own Annexure 1). Unlike the new
      50F/59F entries, City/Country ARE included in
      structured_address.targets below - 50K has no numbered-line
      convention and therefore no deterministic alternate source for
      TwnNm/Ctry at all, so there is nothing for a libpostal guess to
      conflict with here (the overwrite risk documented on the 50F
      entry applies specifically to fields that ALSO extract Ctry/TwnNm
      deterministically from elsewhere, which 50K does not). What IS
      still true: no NUMBERED-LINE convention (50F's 1/2/3/) is assumed
      here - 50K is genuinely free text, and only the libpostal parser
      (not this document's own logic) infers any structure from it.
    strip_account_line_prefix: true
    account_line_pattern: "^/(.+)$"
    account_sub_element: "AccountId"
    sub_elements:
      Nm: "line:0"
      AdrLine:
        rule: "lines_from:1"
        optional: true
    sub_element_targets:
      AdrLine: "CdtTrfTxInf.Dbtr.PstlAdr.AdrLine"
    conditional_sub_element_targets:
      AccountId:
        pattern: "[A-Z]{2}[0-9]{2}[A-Za-z0-9]{1,30}"
        if_match_target: "CdtTrfTxInf.DbtrAcct.Id.IBAN"
        else_target: "CdtTrfTxInf.DbtrAcct.Id.Othr.Id"
    structured_address:
      source_sub_element: "AdrLine"
      adr_line_target_path: "CdtTrfTxInf.Dbtr.PstlAdr.AdrLine"
      targets:
        street: "CdtTrfTxInf.Dbtr.PstlAdr.StrtNm"
        city: "CdtTrfTxInf.Dbtr.PstlAdr.TwnNm"
        postcode: "CdtTrfTxInf.Dbtr.PstlAdr.PstCd"
        country: "CdtTrfTxInf.Dbtr.PstlAdr.Ctry"
    fallback_if_unparseable: raise_error
  notes: >-
    v2.40 ADDITION (2026-09-15, user-requested "act intelligently wherever confident"): added
    adr_line_target_path so once libpostal confidently resolves street/city from this entry's own AdrLine
    content, any individual AdrLine occurrence that is an EXACT (case-insensitive) duplicate of that street or
    city is removed - e.g. a real message with AdrLine=["Street","Chennai","India New Delhi"] resolving
    StrtNm="street"/TwnNm="chennai" now keeps only AdrLine=["India New Delhi"] (the genuinely un-captured
    remainder), not all three lines including the two that are now purely redundant with the structured fields.
    Deliberately conservative: only a clean, whole-line match is removed - "India New Delhi" is NOT touched even
    though it contains the word "India" (Ctry=IN came from a raw-text substring scan, not a clean match to the
    whole line), since removing it would also discard "New Delhi" with nowhere else for that content to go. See
    ConverterService.enrichWithStructuredAddress and StructuredAddressRule.adrLineTargetPath's own Javadoc.
    v2.39 ADDITION (2026-09-15): added anti_gate_pattern, mirroring the identical fix applied to bare-59 the same
    day (that entry's own notes give the full reasoning and the live message that motivated it) - this entry
    steps aside when 50K's raw content actually contains Option-F-style numbered markers ("1/", "2/", "3/"),
    which belongs to the new dedicated entry immediately below instead. No live 50K example with this exact
    problem was reported (the reported case was on field 59), but the identical risk exists here by construction
    - both fields share the same "plain, first-line-is-name" convention this document already uses, so the same
    numbered-line collision is possible on either one; applied proactively for symmetry rather than waiting for
    a second live report of the same bug class.
    v1.16 GAP FIX: this document previously had NO entry populating Dbtr.Nm/PstlAdr for 50K at all - only a separate
    account-only entry existed (targeting DbtrAcct.Id.Othr.Id), so Dbtr rendered entirely empty even when a real name/address
    was present (the v1.12 empty-Dbtr placeholder default masked this by making it schema-VALID, but not business-correct).

    v2.1 DEDUP FIX: the standalone account-only 50K entry (llm_assisted, same target CdtTrfTxInf.DbtrAcct.Id.Othr.Id) has been
    removed. It independently re-parsed the identical raw 50K value through a different mechanism (LLM-driven free-text
    instruction vs this entry's deterministic account_line_pattern regex) to produce the same output - a genuine duplicate
    write, not merely "redundant-but-harmless" as previously documented, since the two mechanisms had no guarantee of staying
    in agreement on edge cases (whitespace, multiple slash-prefixed lines, etc.) and any future divergence would go
    undetected. This entry alone is now the single source of both Dbtr/Nm+PstlAdr/AdrLine and DbtrAcct/Id/Othr/Id for 50K.

    Strict profile: if the MT field is selected as the ordering/beneficiary customer, the name must populate Dbtr/Cdtr. Do
    not emit an empty party merely to satisfy XSD; missing mandatory customer data must fail conversion.
  edge_cases:
  - condition: "Field absent"
    handling: "not an error - Dbtr then falls back to the v1.12 empty-placeholder target_default"
  - condition: "Only a name line present, no address line"
    handling: "not an error - AdrLine is optional"
  - condition: "No line begins with '/' (plain name/address content, e.g. 'JOHN DOE 123 MAIN STREET')"
    handling: "not an error - this is the normal, common case for 50K; AccountId/DbtrAcct is simply left unpopulated from
      this source"
  - condition: "A line is exactly '/' with no content after it"
    handling: "reject - genuinely malformed account line, distinct from 'no account line present at all'"

- source_field: "50K"
  source_name: "Ordering Customer, option K, but content uses Option-F-style numbered lines"
  target_path: "CdtTrfTxInf.Dbtr"
  mandatory: false
  transformation: decompose_party
  gate_pattern: "(?m)^\\d/"
  decomposition:
    pattern_description: >-
      v2.39 ADDITION (2026-09-15): symmetric counterpart to the equivalent new entry added for field 59 the same
      day (see that entry's own notes for the live-reported message that motivated this fix, and the reasoning
      for why detecting an explicit "1/"/"2/"/"3/" marker is a content-driven fact, not a position-based or
      address-pattern-based guess). Reuses 50F's own decomposition VERBATIM, including the Party
      Identifier/DOB/POB sub-elements (50F's own numbered-line convention already extends to 1-5, per its own
      v2.18 sourcing) - if a sender writes numbered-line content under plain 50K, there is no reason to assume
      they only used markers 1-3 and not the fuller set 50F itself supports.
      v2.40 BUG FIX (2026-09-15, user-reported real message: field 59's ':59:000005632\n1/ZZZ CORPRATION\nCENTER
      350 N,\nST PAUL, SUITE 1300, DALLAS,' - see the mirrored 59-numbered entry below for the exact case this
      was found on): AdrLine's regex previously ONLY matched lines explicitly starting with "2/" - any trailing
      line with NO marker at all (a real, common mixed convention: a numbered Name line followed by plain
      unmarked address continuation lines) matched nothing and was silently dropped entirely, nowhere in the
      output. Broadened to ALSO capture any line that isn't claimed by another recognized marker (1/, 3/-5/, or
      an ARNU/CCPT/CUST/DRLC/EMPL/NIDN/SOSE/TXID identity code) - this is the SAME "unmarked content is address
      text" rule the plain 50K entry already applies to ALL its lines, just extended here to the leftover lines
      a numbered entry doesn't otherwise claim. Deliberately excludes lines that are PURELY digits (no letters
      at all) - a bare number is at least as likely to be a malformed/unmarked account reference (missing its
      required leading "/") as it is address text, and this document does not guess between those two readings;
      it stays uncaptured rather than being placed, possibly wrongly, into either.
      v2.40 SELF-CAUGHT FIX (2026-09-15, found during this same change's own pre-ship verification, before any
      user report): the broadened regex above initially had no exclusion for a leading account line (e.g. 50K's
      "/00099887" line 1). strip_account_line_prefix already extracts that line into AccountId via its OWN
      line-index-based pass (DecompositionService strips lines.get(0) before line:/lines_from: rules run) - but
      a `regex:` sub_element rule (like this AdrLine one) matches against the FULL raw field value directly, a
      separate code path strip_account_line_prefix does not touch. Net effect verified against a real
      "50K:/00099887\n1/NAME\n2/Street\n3/GB/City" shape: the account line was captured a SECOND time as bogus
      AdrLine text and fed into the libpostal sidecar alongside the real street line, producing a garbled
      StrtNm. Added "(?!\\A/)" - matches strip_account_line_prefix's own exact scope (only the field's very
      first line, only if it starts with "/") since \A anchors to the whole string start regardless of
      MULTILINE, not just "any line starting with /" (which could be too broad if a later line coincidentally
      started with "/"). Caught before this change was ever reported as working, per the standing "verify
      against real behavior before shipping" rule.
    strip_account_line_prefix: true
    account_line_pattern: "^/(.+)$"
    account_sub_element: "AccountId"
    sub_elements:
      Nm:
        rule: "regex:^1/(.+)$"
        optional: true
        concat: true
      AdrLine:
        rule: "regex:^(?:2/)?(?!\\A/)(?!\\d/)(?!(?:ARNU|CCPT|CUST|DRLC|EMPL|NIDN|SOSE|TXID)/)(?!\\d+$)(.+)$"
        optional: true
        all_matches: true
      Ctry:
        rule: "regex:^3/([A-Z]{2})(?:/|$)"
        optional: true
      TwnNm:
        rule: "regex:^3/[A-Z]{2}/(.+)$"
        optional: true
      IdCode:
        rule: "regex:^(ARNU|CCPT|CUST|DRLC|EMPL|NIDN|SOSE|TXID)/[A-Z]{2}/.+$"
        optional: true
      IdCountry:
        rule: "regex:^(?:ARNU|CCPT|CUST|DRLC|EMPL|NIDN|SOSE|TXID)/([A-Z]{2})/.+$"
        optional: true
      IdNumber:
        rule: "regex:^(?:ARNU|CCPT|CUST|DRLC|EMPL|NIDN|SOSE|TXID)/[A-Z]{2}/(.+)$"
        optional: true
      BirthDt:
        rule: "regex_date_yyyymmdd:^4/(\\d{8})$"
        optional: true
      CtryOfBirth:
        rule: "regex:^5/([A-Z]{2})/"
        optional: true
      CityOfBirth:
        rule: "regex:^5/[A-Z]{2}/(.+)$"
        optional: true
    sub_element_targets:
      Nm: "CdtTrfTxInf.Dbtr.Nm"
      AdrLine: "CdtTrfTxInf.Dbtr.PstlAdr.AdrLine"
      Ctry: "CdtTrfTxInf.Dbtr.PstlAdr.Ctry"
      TwnNm: "CdtTrfTxInf.Dbtr.PstlAdr.TwnNm"
      IdCode: "CdtTrfTxInf.Dbtr.Id.PrvtId.Othr.SchmeNm.Prtry"
      IdCountry: "CdtTrfTxInf.Dbtr.Id.PrvtId.Othr.Issr"
      IdNumber: "CdtTrfTxInf.Dbtr.Id.PrvtId.Othr.Id"
      BirthDt: "CdtTrfTxInf.Dbtr.Id.PrvtId.DtAndPlcOfBirth.BirthDt"
      CtryOfBirth: "CdtTrfTxInf.Dbtr.Id.PrvtId.DtAndPlcOfBirth.CtryOfBirth"
      CityOfBirth: "CdtTrfTxInf.Dbtr.Id.PrvtId.DtAndPlcOfBirth.CityOfBirth"
    conditional_sub_element_targets:
      AccountId:
        pattern: "[A-Z]{2}[0-9]{2}[A-Za-z0-9]{1,30}"
        if_match_target: "CdtTrfTxInf.DbtrAcct.Id.IBAN"
        else_target: "CdtTrfTxInf.DbtrAcct.Id.Othr.Id"
    structured_address:
      source_sub_element: "AdrLine"
      adr_line_target_path: "CdtTrfTxInf.Dbtr.PstlAdr.AdrLine"
      targets:
        street: "CdtTrfTxInf.Dbtr.PstlAdr.StrtNm"
        city: "CdtTrfTxInf.Dbtr.PstlAdr.TwnNm"
        postcode: "CdtTrfTxInf.Dbtr.PstlAdr.PstCd"
        country: "CdtTrfTxInf.Dbtr.PstlAdr.Ctry"
    fallback_if_unparseable: raise_error
  notes: >-
    v2.41 BUG FIX (2026-09-15): mirrors the identical fix on the 59-numbered entry below (found via that
    entry's own real user-reported message) - city/country are now included here too, safe from overwriting
    this entry's own deterministic "3/XX/City" Ctry/TwnNm because ConverterService.putIfPresent (v2.41) never
    overwrites an already-populated target path. Also added adr_line_target_path for the same AdrLine-dedup
    reason as that entry.
    ---
    Deliberately identical decomposition to 50F above - see that entry's own notes for the full sourcing
    (Bank of America PACS 008/MT 103 formatting guide, TARGET2 Annex 5.1.2). Exists only to catch the same
    numbered-line CONTENT when it arrives under the plain "50K" tag instead of "50F". Not verified against a
    real-world 50K example specifically (added proactively for symmetry with the 59 fix - see that entry's
    notes); still safe to keep even if this exact case never occurs in practice, since gate_pattern means it
    can only ever fire on content that explicitly contains a numbered marker, never on genuine plain free text.
  edge_cases:
  - condition: "No account line present"
    handling: "not an error - AccountId is simply left unpopulated, the common case"
  - condition: "Field absent, or no line begins with '1/'/'2/'/'3/'"
    handling: "not an error on its own - this entry's gate_pattern means it never even runs in that case; the
      plain-50K entry above handles it instead"
  - condition: "Line begins with '3/' but is not followed by a 2-letter uppercase country code"
    handling: "reject - do not guess the country"
  - condition: "Address parser sidecar disabled, unreachable, or not confident"
    handling: "not an error - StrtNm/TwnNm/PstCd/Ctry simply stay unpopulated (or, for Ctry/TwnNm, keep
      whatever the deterministic '3/XX/City' line already produced - see v2.41 note above); AdrLine (already
      written) is unaffected"

- source_field: "59A"
  source_name: "Beneficiary Customer, option A - full decomposition (BIC + optional account, IBAN/Othr split)"
  target_path: "CdtTrfTxInf.Cdtr.Id.OrgId.AnyBIC"
  mandatory: false
  transformation: decompose_party
  decomposition:
    pattern_description: >-
      Same source tier as 50A (Field 59 -> Creditor).
      v2.16 SOURCING (2026-09-03): the real SWIFT "Standards MT November 2021" MT103 Message Reference Guide (fetched
      and read directly, section 17 "Field 59a: Beneficiary Customer") gives the exact FORMAT table for option A,
      verbatim: "[/34x] (Account)" then "4!a2!a2!c[3!c] (Identifier Code)" - i.e. an optional account line followed
      ONLY by a BIC; no name/address subfield exists in option A at all. This directly confirms BIC-only routing to
      Cdtr/Id/OrgId/AnyBIC is structurally correct per the official field definition.
      v2.22 REDESIGN (2026-09-07): mirrors the identical 50A redesign - see that entry's v2.22 note for the full
      explanation. This entry was previously THREE separate entries (this decompose_party BIC extraction plus two
      unconditional llm_assisted calls for IBAN-vs-Othr account routing, v2.11) - the same latent
      unconditional-LLM-call vulnerability already found and fixed for 52A/56A/57A's clearing-code entries (v2.22,
      TC24-26/82/100), not yet triggered here by any test but the same class of risk. Consolidated into one entry
      using strip_account_line_prefix + conditional_sub_element_targets (the mechanism 50K/50F/bare-59/52A/53A/54A/
      55A/56A/57A already use) - zero LLM involvement, the account's IBAN-vs-Othr routing is now a plain regex
      shape check. This ALSO resolves the previously-open "UNVERIFIED against the engine" caveat the old BIC regex
      carried: line:0 after strip_account_line_prefix is unambiguous (BIC is always the only remaining line once an
      optional leading account line is stripped), not a regex needing separate runtime verification.
    strip_account_line_prefix: true
    account_line_pattern: "^/(.+)$"
    account_sub_element: "AccountId"
    sub_elements:
      BIC: "line:0"
    sub_element_targets:
      BIC: "CdtTrfTxInf.Cdtr.Id.OrgId.AnyBIC"
    conditional_sub_element_targets:
      AccountId:
        pattern: "[A-Z]{2}[0-9]{2}[A-Za-z0-9]{1,30}"
        if_match_target: "CdtTrfTxInf.CdtrAcct.Id.IBAN"
        else_target: "CdtTrfTxInf.CdtrAcct.Id.Othr.Id"
    sub_element_case_normalize:
      BIC: upper
    fallback_if_unparseable: raise_error
  notes: >
    Split into per-option entries (59/59A/59F) same as Field 50.
    v1.16 BUG FIX: without the override above, this entry's
    actual output path was 'CdtTrfTxInf.Cdtr.Id.OrgId.AnyBIC.BIC' - same
    double-suffix bug as the 50A-BIC entry; Cdtr's BIC was never
    actually populated by this entry before this fix.
    NOTE (v2.22): structural IBAN pattern check only, not a full ISO 7064 mod-97 checksum validation - same caveat
    as the 50A entry.
  edge_cases:
  - condition: "Content doesn't split into account line + BIC"
    handling: "reject"
  - condition: "Field absent"
    handling: "not an error"
  - condition: "No leading-slash account line present"
    handling: "not an error - the common case; only BIC is produced"

- source_field: "59"
  source_name: "Beneficiary Customer, no letter - name/address portion"
  target_path: "CdtTrfTxInf.Cdtr"
  mandatory: false
  transformation: decompose_party
  anti_gate_pattern: "(?m)^\\d/"
  decomposition:
    pattern_description: >
      USER-PROVIDED RULE (2026-08-31, business-correctness review):
      MT103 field 59 (no letter, Beneficiary Customer) maps to
      pacs.008 Cdtr - name/address, not just the account portion the
      entry above already extracts. Same PLAIN unstructured-line shape
      as 50K (unlike 59F's numbered-line convention - see the 59F
      entry): first non-account line = Nm; every remaining line = its
      own repeated AdrLine. CORRECTION (v2.15, 2026-09-03): see the
      50K entry's identical correction - this note previously said
      "NOT decomposing... TwnNm/Ctry/PstCd," which contradicted the
      structured_address block below (already present, now accurately
      described). Same reasoning as 50K applies verbatim: no
      deterministic alternate source for TwnNm/Ctry exists for bare 59
      either, so including city/country in structured_address.targets
      here carries no overwrite risk.
    strip_account_line_prefix: true
    account_line_pattern: "^/(.+)$"
    account_sub_element: "AccountId"
    sub_elements:
      Nm: "line:0"
      AdrLine:
        rule: "lines_from:1"
        optional: true
    sub_element_targets:
      AdrLine: "CdtTrfTxInf.Cdtr.PstlAdr.AdrLine"
    conditional_sub_element_targets:
      AccountId:
        pattern: "[A-Z]{2}[0-9]{2}[A-Za-z0-9]{1,30}"
        if_match_target: "CdtTrfTxInf.CdtrAcct.Id.IBAN"
        else_target: "CdtTrfTxInf.CdtrAcct.Id.Othr.Id"
    structured_address:
      source_sub_element: "AdrLine"
      adr_line_target_path: "CdtTrfTxInf.Cdtr.PstlAdr.AdrLine"
      targets:
        street: "CdtTrfTxInf.Cdtr.PstlAdr.StrtNm"
        city: "CdtTrfTxInf.Cdtr.PstlAdr.TwnNm"
        postcode: "CdtTrfTxInf.Cdtr.PstlAdr.PstCd"
        country: "CdtTrfTxInf.Cdtr.PstlAdr.Ctry"
    fallback_if_unparseable: raise_error
  notes: >-
    v2.40 ADDITION (2026-09-15, user-requested "act intelligently wherever confident"): added
    adr_line_target_path, mirroring the identical fix on the 50K entry above (see its own v2.40 note for the
    full reasoning) - once libpostal confidently resolves street/city from this entry's own AdrLine content,
    any AdrLine occurrence that is an EXACT (case-insensitive) duplicate is removed as genuinely redundant;
    partial/substring matches are deliberately left untouched.
    v2.39 ADDITION (2026-09-15, from a live message the user reported: field 59 content ":59:000005632\n1/ZZZ
    CORPRATION\nCENTER 350 N,\n..."): added anti_gate_pattern so this plain-line entry steps ASIDE when the raw
    value actually contains Option-F-style numbered markers ("1/", "2/", "3/") - that content belongs to the new
    dedicated entry immediately below (gated on the SAME regex, positively), which reuses 59F's own proven
    numbered-line decomposition instead of this entry's naive "first line = name" rule. Without this,
    "1/ZZZ CORPRATION" would be taken as the literal Cdtr/Nm value (including the "1/" prefix), which is
    exactly the bug reported. See the new entry's own notes for the full reasoning and its scope: this
    detects a real, unambiguous CONTENT signal (an explicit numbered-line marker), not a position-based or
    address-pattern-based guess - a sender who writes "1/" is not leaving that up to interpretation.
    v1.16 GAP FIX: mirrors the 50K Dbtr entry above - this document previously had no entry populating Cdtr.Nm/PstlAdr for
    bare 59 at all, so Cdtr rendered entirely empty even when a real name/address was present.

    v2.1 DEDUP FIX: mirrors the 50K fix above - the standalone account-only bare-59 entry (llm_assisted, same target
    CdtTrfTxInf.CdtrAcct.Id.Othr.Id) has been removed as a genuine duplicate write of the same raw value through two
    different parsing mechanisms. This entry alone is now the single source of both Cdtr/Nm+PstlAdr/AdrLine and
    CdtrAcct/Id/Othr/Id for bare 59.

    Strict profile: if the MT field is selected as the ordering/beneficiary customer, the name must populate Dbtr/Cdtr. Do
    not emit an empty party merely to satisfy XSD; missing mandatory customer data must fail conversion.
  edge_cases:
  - condition: "Field absent"
    handling: "not an error - Cdtr then falls back to the v1.12 empty-placeholder target_default"
  - condition: "Only a name line present, no address line"
    handling: "not an error - AdrLine is optional"
  - condition: "No line begins with '/' (plain name/address content)"
    handling: "not an error - this is the normal, common case for bare 59; AccountId/CdtrAcct is simply left unpopulated
      from this source"
  - condition: "A line is exactly '/' with no content after it"
    handling: "reject - genuinely malformed account line, distinct from 'no account line present at all'"

- source_field: "59"
  source_name: "Beneficiary Customer, no letter, but content uses Option-F-style numbered lines"
  target_path: "CdtTrfTxInf.Cdtr"
  mandatory: false
  transformation: decompose_party
  gate_pattern: "(?m)^\\d/"
  decomposition:
    pattern_description: >-
      v2.39 ADDITION (2026-09-15, from a live message the user reported): field 59 (no letter option) is
      documented as plain, unnumbered free text - see the entry above. But a real message was seen with
      ":59:000005632\n1/ZZZ CORPRATION\nCENTER 350 N,\nST PAUL, SUITE 1300, DALLAS,", where line 2 is
      unmistakably an Option-F-style numbered marker ("1/" = Name, per field 59F's own convention - see that
      entry below). The plain entry above would have taken "1/ZZZ CORPRATION" as the literal name (numbered
      prefix and all), which is wrong. This is NOT a position-based or content-sniffing guess (unlike, say,
      deciding a line "looks like a street address") - a "1/" prefix is an explicit, unambiguous structural
      marker the sender chose to write; honoring it is a straightforward reading of the message, not an
      inference. Reuses 59F's own decomposition rules VERBATIM (same regexes, same targets, same
      structured_address wiring) rather than writing new parsing logic - this is genuinely the same shape of
      content, just carried in the wrong tag (a real, seen phenomenon: some sender-side systems emit
      numbered-line content under a plain 59 tag rather than 59F). gate_pattern above and the anti_gate_pattern
      on the plain-59 entry are two sides of the same regex, making the two entries mutually exclusive by
      CONTENT rather than by which tag the sender happened to use.
      v2.40 BUG FIX (2026-09-15, from the exact real message that motivated this whole entry:
      ':59:000005632\n1/ZZZ CORPRATION\nCENTER 350 N,\nST PAUL, SUITE 1300, DALLAS,'): AdrLine's regex only
      matched lines starting with "2/" - the last two lines here have NO marker at all (a real, common mixed
      convention: a numbered Name line followed by plain unmarked address continuation), so they matched
      nothing and were silently dropped entirely - a real data-loss gap on top of the Nm fix this entry was
      originally built for. Broadened to ALSO capture any line not claimed by another recognized marker (1/ or
      3/) - the same "unmarked content is address text" rule the plain-59 entry above already applies to ALL
      its lines. Deliberately excludes lines that are PURELY digits - a bare number is at least as likely to be
      a malformed account reference (missing its required leading "/") as address text, and this document does
      not guess between those two readings; it stays uncaptured (see this entry's own DISCLOSED SIDE EFFECT
      note in the changelog) rather than being placed, possibly wrongly, into either.
      v2.40 SELF-CAUGHT FIX (2026-09-15, found during pre-ship verification): same fix as the mirrored 50K-numbered
      entry above - added "(?!\\A/)" so a leading "/account" line (already claimed by strip_account_line_prefix)
      is not ALSO captured a second time as bogus AdrLine text. See that entry's own note for the full
      before/after reasoning.
    strip_account_line_prefix: true
    account_line_pattern: "^/(.+)$"
    account_sub_element: "AccountId"
    sub_elements:
      Nm:
        rule: "regex:^1/(.+)$"
        optional: true
        concat: true
      AdrLine:
        rule: "regex:^(?:2/)?(?!\\A/)(?!\\d/)(?!\\d+$)(.+)$"
        optional: true
        all_matches: true
      Ctry:
        rule: "regex:^3/([A-Z]{2})(?:/|$)"
        optional: true
      TwnNm:
        rule: "regex:^3/[A-Z]{2}/(.+)$"
        optional: true
    sub_element_targets:
      Nm: "CdtTrfTxInf.Cdtr.Nm"
      AdrLine: "CdtTrfTxInf.Cdtr.PstlAdr.AdrLine"
      Ctry: "CdtTrfTxInf.Cdtr.PstlAdr.Ctry"
      TwnNm: "CdtTrfTxInf.Cdtr.PstlAdr.TwnNm"
    conditional_sub_element_targets:
      AccountId:
        pattern: "[A-Z]{2}[0-9]{2}[A-Za-z0-9]{1,30}"
        if_match_target: "CdtTrfTxInf.CdtrAcct.Id.IBAN"
        else_target: "CdtTrfTxInf.CdtrAcct.Id.Othr.Id"
    structured_address:
      source_sub_element: "AdrLine"
      adr_line_target_path: "CdtTrfTxInf.Cdtr.PstlAdr.AdrLine"
      targets:
        street: "CdtTrfTxInf.Cdtr.PstlAdr.StrtNm"
        city: "CdtTrfTxInf.Cdtr.PstlAdr.TwnNm"
        postcode: "CdtTrfTxInf.Cdtr.PstlAdr.PstCd"
        country: "CdtTrfTxInf.Cdtr.PstlAdr.Ctry"
    fallback_if_unparseable: raise_error
  notes: >-
    v2.41 BUG FIX (2026-09-15, user-reported real message: ':59:000005632\n1/ZZZ CORPRATION\nCENTER 350
    N,\nST PAUL, SUITE 1300, DALLAS,'): city/country were deliberately left OUT of this entry's
    structured_address.targets in v2.39/v2.40 to avoid overwriting a deterministically-extracted Ctry/TwnNm
    from this entry's OWN "3/XX/City" line - but this real message has NO "3/" line at all, so TwnNm/Ctry
    were never set by ANY path: not deterministically (no 3/ line to extract from) and not via the sidecar
    (excluded from targets). Confirmed via direct sidecar test: parsing ["CENTER 350 N,", "ST PAUL, SUITE
    1300, DALLAS,"] returns city="dallas" - a real, usable result that was being silently thrown away. Fixed
    properly rather than just adding the target back: ConverterService.putIfPresent now only writes a
    structured_address result when the target path ISN'T ALREADY populated (see its own v2.41 comment) - so
    re-adding city/country here is safe even for a message that DOES have a "3/" line, since the
    deterministic Ctry/TwnNm sub_elements run first and the sidecar can no longer clobber them. Also added
    adr_line_target_path (previously null/no-op for this entry, since city/country never populated here
    before) so an AdrLine that exactly duplicates a newly-resolved street/city is deduped the same way the
    plain-59 entry above already does.
    ---
    Deliberately identical decomposition to 59F below (same source, same citation - Bank of America's PACS 008
    and MT 103 formatting guide worked example) - see that entry's own notes for the full sourcing. This entry
    exists only to catch the same numbered-line CONTENT when it arrives under the plain "59" tag instead of
    "59F", per the live message that motivated this addition. Not verified against a second real-world example
    beyond the one reported; if this pattern turns out to be a one-off malformed message rather than a real
    sender convention, this entry is still safe to keep (it only ever fires when the content itself contains an
    explicit numbered marker, so it cannot misfire on genuine plain free text).
  edge_cases:
  - condition: "No account line present"
    handling: "not an error - AccountId is simply left unpopulated, the common case"
  - condition: "Field absent, or no line begins with '1/'/'2/'/'3/'"
    handling: "not an error on its own - this entry's gate_pattern means it never even runs in that case; the
      plain-59 entry above handles it instead"
  - condition: "Line begins with '3/' but is not followed by a 2-letter uppercase country code"
    handling: "reject - do not guess the country"
  - condition: "Address parser sidecar disabled, unreachable, or not confident"
    handling: "not an error - StrtNm/TwnNm/PstCd/Ctry simply stay unpopulated (or, for Ctry/TwnNm, keep
      whatever the deterministic '3/XX/City' line already produced - see v2.41 note above); AdrLine (already
      written) is unaffected"

- source_field: "59F"
  source_name: "Beneficiary Customer, option F - full decomposition (account, name, structured address)"
  target_path: "CdtTrfTxInf.Cdtr"
  mandatory: false
  transformation: decompose_party
  decomposition:
    pattern_description: >-
      ENGINE FIX (v2.15, 2026-09-03): mirrors the 50F consolidation above exactly (same numbered-line shape, same
      account IBAN/Othr split, same reasons) - see that entry's notes for the full rationale, not repeated here.
      SOURCED CORRECTION (Bank of America "PACS 008 and MT 103 Commercial payments formatting guide," fetched and
      read directly 2026-09-03): its own 59F worked example (":59F:/AA24BBBB11111111111111\n1/ABC
      Corporation\n2/Street Name,Building11,\n3/IN/Town Name\n3/ Post Code1") resolves to a FULLY STRUCTURED PstlAdr
      (StrtNm/BldgNb/PstCd/TwnNm/Ctry) - this is a directly-cited 59F-specific worked example, not the by-analogy
      extrapolation-from-50F the prior version of this entry explicitly flagged as lower confidence. That caveat is
      now resolved for the numbered-line shape itself (confirmed real, not assumed); Street/PostCode still route
      through the libpostal structured_address enrichment rather than hand-parsing this example's own comma-based
      Street/BuildingNumber split, since ParsedAddress has no separate building-number field to populate BldgNb
      correctly either way, and re-deriving an ad hoc comma-splitter from one worked example would risk guessing
      beyond what's actually evidenced.
      Country/TownName stay on the deterministic line-3 regex, same reasoning as 50F. structured_address.targets
      deliberately excludes city/country for the identical overwrite-risk reason documented on the 50F entry.
      v2.18 BUG FIX (2026-09-04): AdrLine's all_matches: true added - identical rationale as 50F's own v2.18 note
      (repeated "2/" lines are spec-legal and were previously silently dropped after the first).
      v2.20 BUG FIX (from live test case TC34, which specifically exercises 59F): Ctry's regex fixed to make the
      trailing town-detail optional ("^3/([A-Z]{2})(?:/|$)", was requiring a trailing "/"), and Nm gained
      concat: true - identical rationale as 50F's own v2.20 note, not repeated here.
    strip_account_line_prefix: true
    account_line_pattern: "^/(.+)$"
    account_sub_element: "AccountId"
    sub_elements:
      Nm:
        rule: "regex:^1/(.+)$"
        optional: true
        concat: true
      AdrLine:
        rule: "regex:^2/(.+)$"
        optional: true
        all_matches: true
      Ctry:
        rule: "regex:^3/([A-Z]{2})(?:/|$)"
        optional: true
      TwnNm:
        rule: "regex:^3/[A-Z]{2}/(.+)$"
        optional: true
    sub_element_targets:
      Nm: "CdtTrfTxInf.Cdtr.Nm"
      AdrLine: "CdtTrfTxInf.Cdtr.PstlAdr.AdrLine"
      Ctry: "CdtTrfTxInf.Cdtr.PstlAdr.Ctry"
      TwnNm: "CdtTrfTxInf.Cdtr.PstlAdr.TwnNm"
    conditional_sub_element_targets:
      AccountId:
        pattern: "[A-Z]{2}[0-9]{2}[A-Za-z0-9]{1,30}"
        if_match_target: "CdtTrfTxInf.CdtrAcct.Id.IBAN"
        else_target: "CdtTrfTxInf.CdtrAcct.Id.Othr.Id"
    structured_address:
      source_sub_element: "AdrLine"
      targets:
        street: "CdtTrfTxInf.Cdtr.PstlAdr.StrtNm"
        postcode: "CdtTrfTxInf.Cdtr.PstlAdr.PstCd"
    fallback_if_unparseable: raise_error
  notes: >-
    RESIDUAL GAP (unchanged): numbered lines 4-8 not implemented, same reasoning as 50F. BuildingNumber (BldgNb) is
    not populated by either the deterministic regex or the libpostal enrichment - genuinely unimplemented, not
    silently dropped from a value that was already extracted.
  edge_cases:
  - condition: "No account line present"
    handling: "not an error - AccountId is simply left unpopulated, the common case"
  - condition: "Field absent, or no line begins with '1/'/'2/'/'3/'"
    handling: "not an error - the corresponding sub-element simply produces no value"
  - condition: "Line begins with '3/' but is not followed by a 2-letter uppercase country code"
    handling: "reject - do not guess the country"
  - condition: "Address parser sidecar disabled, unreachable, or not confident"
    handling: "not an error - StrtNm/PstCd simply stay unpopulated; AdrLine (already written) is unaffected"

- source_field: "33B"
  source_name: "Currency/Instructed Amount - currency portion"
  target_path: "CdtTrfTxInf.InstdAmt.@Ccy"
  mandatory: false
  transformation: direct_copy
  extract_pattern: "^([A-Z]{3})"
  allowed_pattern: "^[A-Z]{3}$"
  notes: >
    v1.11 STRUCTURAL FIX: same class of fix as the 32A/IntrBkSttlmAmt
    entries above - split off from a single llm_assisted entry that
    targeted InstdAmt directly, which would hit the identical
    'Attribute Ccy must appear' XSD error as IntrBkSttlmAmt did
    (ActiveOrHistoricCurrencyAndAmount also has a mandatory Ccy
    attribute, not a child element), and a single llm_assisted call is
    structurally incapable of populating both the attribute and the
    text content. See the 32A entries' notes for the full rationale.
    Source (v1.11-v2.15): user-provided instruction, not attached material - zero citation hits for "Field 33B" anywhere in
    the UHB pacs.008 section. UHB p.214 describes the target element's own rule (VR001) without naming the source MT tag -
    that citation supports the target element's behavior, not this source-to-target mapping.
    v2.16 SOURCING (2026-09-03): resolved - the real SWIFT "Standards MT November 2021" MT103 Message Reference Guide
    (fetched and read directly, section 7 "Field 33B: Currency/Instructed Amount") confirms Field 33B is a genuine MT103
    field, format 3!a15d, Presence "Conditional (see rules C2, C15)" - not unconditionally mandatory nor unconditionally
    optional. Rule C1 (page 5, verbatim): "If field 33B is present and the currency code is different from the currency
    code in field 32A, field 36 must be present, otherwise field 36 is not allowed" - this is the actual source for VR001,
    not merely UHB p.214's target-side paraphrase. Note VR001 currently only checks the "36 becomes mandatory" direction
    of C1, not the "36 not allowed when currencies match" direction - a real, disclosed gap this sourcing exposes but does
    not fix here.
  conditional_rules:
  - condition: "InstdAmt currency differs from IntrBkSttlmAmt currency"
    handling: "XchgRate becomes mandatory on the target side (VR001) - not enforced by this entry, see validation_rules"
  edge_cases:
  - condition: "First 3 characters not 3 uppercase letters"
    handling: "reject - do not guess currency (enforced by allowed_pattern)"
  - condition: "Field absent"
    handling: "not an error - 33B is genuinely conditional per SWIFT rule C2 (mandatory only when both Sender and Receiver BICs are in a specific EU/EEA-adjacent country list), not universally mandatory"

- source_field: "33B"
  source_name: "Currency/Instructed Amount - amount portion"
  target_path: "CdtTrfTxInf.InstdAmt"
  mandatory: false
  transformation: decimal_comma_to_dot
  extract_pattern: "^[A-Z]{3}(.+)$"
  currency_from_target_path: "CdtTrfTxInf.InstdAmt.@Ccy"
  notes: >
    RULE: this is the AMOUNT half of field 33B's Instructed Amount currency+amount composite - the currency-
    portion entry right above holds the OTHER half of the SAME source line. Sub-parts of one value, not
    independently-derived fields that could conflict.
    v1.11 STRUCTURAL FIX: paired with the currency-portion entry above.
    Comma-to-dot conversion uses the engine's existing
    decimal_comma_to_dot transformation, applied to whatever
    extract_pattern pulls out past the 3-letter currency prefix -
    deterministic, no LLM needed.
    v2.16 SOURCING: see the paired currency-portion entry above for the now-confirmed SWIFT Field 33B citation (format
    3!a15d, Presence Conditional per rules C2/C15) - applies identically here.
    v2.26 BUG FIX (2026-09-07): added currency_from_target_path, same fix and rationale as the 32A amount entry's
    identical v2.26 note (TC66) - zero-pads to InstdAmt's own currency's real minor-unit precision.
  conditional_rules:
  - condition: "InstdAmt currency differs from IntrBkSttlmAmt currency"
    handling: "XchgRate becomes mandatory on the target side (VR001) - not enforced by this entry, see validation_rules"
  edge_cases:
  - condition: "Remainder is not a valid comma-decimal number"
    handling: "reject - enforced by decimal_comma_to_dot"
  - condition: "Field absent"
    handling: "not an error - 33B is genuinely conditional per SWIFT rule C2, not universally mandatory"

- source_field: "36"
  source_name: "Exchange Rate"
  target_path: "CdtTrfTxInf.XchgRate"
  mandatory: false
  transformation: decimal_comma_to_dot
  notes: >
    v1.11 BUG FIX: this entry's own previous notes claimed "the
    comma/dot conversion itself still has no dedicated transformation
    type in this schema's enum" and used direct_copy - that claim was
    simply wrong; decimal_comma_to_dot has existed in
    TransformationEngine all along and is used elsewhere in this same
    document (e.g. the 32A/33B amount entries). Under direct_copy, a raw
    value like "1,25" was passed through unconverted into XchgRate,
    which is BaseOneRate (a plain xs:decimal, comma-separators are not
    valid xs:decimal syntax) - this would have failed XSD validation the
    first time a real message carried field 36, the same class of bug
    as the 32A/33B Ccy-attribute issue, just not yet triggered because
    no test message had exercised field 36. Source (v1.11-v2.15): user-provided instruction, not attached material - zero
    citation hits for "Field 36" anywhere in the UHB pacs.008 section. UHB p.214's cross-element rule (VR001) describes the
    target element's own behavior without naming the source MT tag.
    v2.16 SOURCING (2026-09-03): resolved - the real SWIFT "Standards MT November 2021" MT103 Message Reference Guide
    (fetched and read directly, section 8 "Field 36: Exchange Rate") confirms Field 36 is a genuine MT103 field, format
    12d, Presence "Conditional (see rule C1)" - the same rule C1 already cited on the paired 33B entries. Worked example
    given in the spec: ":36:0,9236" - a plain comma-decimal, consistent with this entry's decimal_comma_to_dot handling.
  conditional_rules:
  - condition: "InstdAmt present with currency differing from IntrBkSttlmAmt"
    handling: "this field becomes mandatory per VR001 - not enforced by this entry"
  edge_cases:
  - condition: "Value is not a valid decimal"
    handling: "reject - do not guess rate"
  - condition: "Field absent"
    handling: "not an error unless VR001's condition is met, in which case absence should be flagged by the validator, not
      this entry"

- source_field: "57A"
  source_name: "Account With Institution (option A only)"
  target_path: "CdtTrfTxInf.CdtrAgt.FinInstnId.BICFI"
  mandatory: false
  transformation: decompose_party
  decomposition:
    pattern_description: >-
      v2.12 BUG FIX: was a plain direct_copy assuming the raw value was ALWAYS a bare single-line BIC - the same bug
      class already found and fixed for 52A/53A/54A/55A/56A, but never applied here, despite this entry's OWN notes
      already saying "Preserve a Party Identifier as CreditorAgentAccount... do not drop it" - an acknowledged gap
      that was never actually closed. Field 57A's real format is "[/1!a][/34x]" (optional leading Party
      Identifier/account line) then "4!a2!a2!c[3!c]" (the BIC) - direct_copy on a genuine two-line value would
      corrupt BICFI. Uses the same strip_account_line_prefix mechanism as 52A/53A/54A/55A/56A.
      v2.19 BUG FIX (2026-09-04, from live test case TC24, which exposed the same class of bug on 56A): this entry
      lacked BOTH skip_pattern (so a "//"-prefixed clearing-system line would be duplicated into CdtrAgtAcct, the
      exact bug TC19 found and fixed for 52A) AND dedicated clearing-system-code extraction entries at all. Both
      added below, mirroring 52A exactly.
    strip_account_line_prefix: true
    account_line_pattern: "^/(.+)$"
    account_sub_element: "Id"
    sub_elements:
      BICFI: "line:0"
    sub_element_targets:
      BICFI: "CdtTrfTxInf.CdtrAgt.FinInstnId.BICFI"
    conditional_sub_element_targets:
      Id:
        skip_pattern: "^/.*$"
        pattern: "[A-Z]{2}[0-9]{2}[A-Za-z0-9]{1,30}"
        if_match_target: "CdtTrfTxInf.CdtrAgtAcct.Id.IBAN"
        else_target: "CdtTrfTxInf.CdtrAgtAcct.Id.Othr.Id"
    sub_element_case_normalize:
      BICFI: upper
    fallback_if_unparseable: raise_error
  notes: >-
    57A Account With Institution -> CreditorAgent. BIC maps to FinInstnId/BICFI. If 57a is absent, the receiver BIC is used
    as the CreditorAgent fallback in the MT103->pacs.008 translation context. Preserve a Party Identifier as CreditorAgentAccount
    or clearing-system identification; do not drop it - now actually implemented above (v2.12), not just described.
    v2.19: skip_pattern added so a "//" clearing-system line is no longer ALSO duplicated into CdtrAgtAcct - see the
    dedicated clearing-code entries below, which now own that content exclusively.
  edge_cases:
  - condition: "Field absent"
    handling: "not an error on its own - falls through to 57D, then to the Receiver-BIC fallback below"
  - condition: "No leading-slash account line present"
    handling: "not an error - the common case; only BICFI is produced"

- source_field: "57A"
  source_name: "Account With Institution, option A - clearing-system member id (line starts with '//', code stripped)"
  target_path: "CdtTrfTxInf.CdtrAgt.FinInstnId.ClrSysMmbId.MmbId"
  mandatory: false
  transformation: llm_assisted
  gate_pattern: "^//"
  notes: >-
    v2.22 BUG FIX (2026-09-07, from live test cases TC24/25/26/82/100): added gate_pattern - see the identical 52A
    ClrSysMmbId/MmbId entry's v2.22 note for the full root-cause explanation. TC26's bare "57A:ABNANL2A" (a plain
    BIC with no clearing prefix at all - the most basic possible 57A usage) was the case that made this most
    visible: this entry's own unconditional LLM call correctly recognized no "//" line was present and refused,
    which - being an uncaught TransformationException - failed the whole conversion even though 57A's own BICFI
    extraction (a completely separate, unaffected entry) would have succeeded cleanly.
    v2.19 ADDITION (2026-09-04, from live test case TC24, which exposed this same gap class on 56A): mirrors the 52A
    clearing-system entries - same TARGET2 "General Functional Specification of the MX/ISO 20022 migration," Annex
    5.1.3 "ClearingSystemIdentification mapping" table, whose own worked example is decisive: MT
    "52A://BL12345678\nBANKDEFF" -> "<ClrSysMmbId><ClrSysId><Cd>DEBLZ</Cd></ClrSysId><MmbId>12345678</MmbId></ClrSysMmbId>"
    - the content after "//" is a 2-character MT clearing-system code immediately followed by the member id, not one
    opaque string. Applies identically to field 57a, which shares the same "//"-prefixed Party Identifier line
    format (and per the real SWIFT MT103 field spec, 57a's own CODES table is actually the LARGEST of the three
    agent fields - it additionally allows ZA (South Africa) that 52a/56a's option-A lists do not list explicitly,
    though this document's lookup table already includes ZA regardless). DECISION PROCEDURE (inlined, not just
    cross-referenced, since this entry's llm_assisted call only ever sees ITS OWN notes at runtime): if a 57A line
    begins with "//", take the 2 characters immediately following it as the MT clearing-system code, and the
    remainder of that line as MmbId. See the paired ClrSysId/Cd entry below for the code lookup.
  edge_cases:
  - condition: "Field absent, or no line begins with '//'"
    handling: "not an error - this entry produces no value"
  - condition: "Line begins with '//' but has fewer than 2 characters after it"
    handling: "reject - malformed, cannot contain both a clearing-system code and a member id"

- source_field: "57A"
  source_name: "Account With Institution, option A - clearing-system code (line starts with '//', first 2 chars, looked up)"
  target_path: "CdtTrfTxInf.CdtrAgt.FinInstnId.ClrSysMmbId.ClrSysId.Cd"
  mandatory: false
  transformation: llm_assisted
  gate_pattern: "^//"
  notes: >-
    v2.22 BUG FIX (2026-09-07, TC24/25/26/82/100): added gate_pattern - see the paired MmbId entry above's identical
    v2.22 note.
    v2.19 ADDITION: paired with the MmbId entry above - see its notes for the TARGET2 Annex 5.1.3 citation. Same
    lookup table as 52A/56A's paired entries (Country / System / MT code / ISO 20022 code), inlined here for the
    same runtime-notes-isolation reason: Australia AU->AUBSB; Austria AT->ATBLZ; Canada CC->CACPA; China CN->CNAPS;
    Germany BL->DEBLZ; Greece GR->GRHIC; Hong Kong HK->HKNCC; India IN->INFSC; Ireland IE->IENCC; Italy IT->ITNCC;
    Japan JP->JPZGN; New Zealand NZ->NZNCC; Poland PL->PLKNR; Portugal PT->PTNCC; Russia RU->RUCBC; South Africa
    ZA->ZANCC; Spain ES->ESNCC; Switzerland BC Code SW->CHBCC; Switzerland SIC Code SW->CHSIC (ambiguous, see
    edge_cases); UK SC->GBDSC; US CHIPS CP->USPID; US Fedwire FW->USABA. DECISION PROCEDURE: take the 2-character MT
    clearing-system code identified by the paired MmbId entry above; if it matches exactly one row in this table,
    output that row's ISO 20022 code to Cd. If it matches zero rows, or matches the ambiguous "SW" case, produce no
    value for Cd.
  edge_cases:
  - condition: "Field absent, or no line begins with '//'"
    handling: "not an error - this entry produces no value"
  - condition: "MT clearing-system code is not in the table, or is 'SW' (ambiguous)"
    handling: "not an error - do not guess; Cd is left unpopulated rather than picking arbitrarily"

- source_field: "57B"
  source_name: "Account With Institution, option B - Party Identifier only (no BIC), possibly a clearing code"
  target_path: "CdtTrfTxInf.CdtrAgtAcct.Id.Othr.Id"
  mandatory: false
  transformation: decompose_party
  decomposition:
    pattern_description: >-
      v2.23 GAP FIX (2026-09-07, from live test case TC80): field 57a option B was entirely unmapped. Directly
      verified against the real SWIFT MT103 MRG, field 57a's own FORMAT table: "Option B [/1!a][/34x] (Party
      Identifier) then [35x] (Location)" - the same shape as 53B/54B/55B, but targeting CdtrAgtAcct (a real,
      dedicated account element in CreditTransferTransaction39 - unlike 53a/54a/55a's SttlmAcct situation, this is
      NOT affected by the SettlementInstruction7 deprecated-element finding, see 53A's v2.23 note). Note (per the
      real MT103 MRG's own USAGE RULES for field 57a): "Option B must only be used with a location" - i.e. option B
      is expected to carry the Location line in practice, though the Party Identifier subfield remains structurally
      optional.
    strip_account_line_prefix: true
    account_line_pattern: "^/(.+)$"
    account_sub_element: "Id"
    sub_elements:
      Placeholder:
        rule: "line:5"
        optional: true
    sub_element_targets: {}
    conditional_sub_element_targets:
      Id:
        pattern: "[A-Z]{2}[0-9]{2}[A-Za-z0-9]{1,30}"
        if_match_target: "CdtTrfTxInf.CdtrAgtAcct.Id.IBAN"
        else_target: "CdtTrfTxInf.CdtrAgtAcct.Id.Othr.Id"
    fallback_if_unparseable: raise_error
  notes: >-
    Option B (account/Party Identifier only, no BIC) - mirrors 53B/54B/55B's mechanism (including the Placeholder
    IMPLEMENTATION NOTE, see 53B's notes). RESIDUAL GAP, disclosed not guessed: per the MRG's own usage rule, 57B is
    typically used FOR a Location value, which (same as 53B/54B/55B) has no sourced pacs.008 target and is not
    captured - this entry only ever captures the optional Party Identifier line, if present.
  edge_cases:
  - condition: "Field absent"
    handling: "not an error - CdtrAgt then falls through to 57D, then the Receiver-BIC fallback"
  - condition: "No leading-slash Party Identifier line present (only a Location line)"
    handling: "not an error - this entry produces no value; nothing to route"

- source_field: "57C"
  source_name: "Account With Institution, option C - Party Identifier only (no BIC), possibly a clearing code"
  target_path: "CdtTrfTxInf.CdtrAgtAcct.Id.Othr.Id"
  mandatory: false
  transformation: decompose_party
  decomposition:
    pattern_description: >-
      v2.23 GAP FIX (2026-09-07, from live test case TC81): field 57a option C was entirely unmapped. Directly
      verified against the real SWIFT MT103 MRG, field 57a's own FORMAT table: "Option C /34x (Party Identifier)" -
      mirrors 56C's mechanism exactly (single line, always starting with "/", either a generic account or - per the
      spec's own CODES section for "option C, or D" - a "//"-prefixed national clearing system code, since option C
      never supplies a BIC).
    sub_elements:
      Id:
        rule: "regex:^/(.+)$"
        optional: true
    sub_element_targets:
      Id: "CdtTrfTxInf.CdtrAgtAcct.Id.Othr.Id"
    conditional_sub_element_targets:
      Id:
        skip_pattern: "^//.*$"
        pattern: "[A-Z]{2}[0-9]{2}[A-Za-z0-9]{1,30}"
        if_match_target: "CdtTrfTxInf.CdtrAgtAcct.Id.IBAN"
        else_target: "CdtTrfTxInf.CdtrAgtAcct.Id.Othr.Id"
    fallback_if_unparseable: raise_error
  notes: >-
    Option C never supplies a BIC (CdtrAgt.FinInstnId.BICFI is left unpopulated for a 57C-only message - not an
    error, BICFI is optional per the XSD). See the clearing-code entries below for the "//"-prefixed case.
  edge_cases:
  - condition: "Field absent"
    handling: "not an error - CdtrAgt then falls through to 57D, then the Receiver-BIC fallback"
  - condition: "Line begins with '//' (a clearing code, not a generic account)"
    handling: "not an error here - see the ClrSysMmbId/ClrSysId entries below, which handle this case instead"

- source_field: "57C"
  source_name: "Account With Institution, option C - clearing-system member id (line starts with '//', code stripped)"
  target_path: "CdtTrfTxInf.CdtrAgt.FinInstnId.ClrSysMmbId.MmbId"
  mandatory: false
  transformation: llm_assisted
  gate_pattern: "^//"
  notes: >-
    v2.23 ADDITION (2026-09-07, TC81): mirrors 56C's identical clearing entries - see those notes for the full
    explanation of why option C (no separate BIC line) routes a "//"-prefixed value here rather than to the account.
    DECISION PROCEDURE: if the (single) line begins with "//", take the 2 characters immediately following it as the
    MT clearing-system code, and the remainder as MmbId. See the paired ClrSysId/Cd entry below for the code lookup.
  edge_cases:
  - condition: "Field absent, or the line does not begin with '//'"
    handling: "not an error - this entry produces no value (also unreachable in practice: gate_pattern skips it)"
  - condition: "Line begins with '//' but has fewer than 2 characters after it"
    handling: "reject - malformed, cannot contain both a clearing-system code and a member id"

- source_field: "57C"
  source_name: "Account With Institution, option C - clearing-system code (line starts with '//', first 2 chars, looked up)"
  target_path: "CdtTrfTxInf.CdtrAgt.FinInstnId.ClrSysMmbId.ClrSysId.Cd"
  mandatory: false
  transformation: llm_assisted
  gate_pattern: "^//"
  notes: >-
    RULE: this is the clearing-system CODE half of 57C's "//"-prefixed clearing-system line - the MmbId entry
    right above holds the member-ID half of the SAME source line. The two are sub-parts of one value, not
    independently-derived fields that could conflict with each other.
    v2.23 ADDITION (2026-09-07, TC81): paired with the MmbId entry above. Field 57a's own CODES section for "option
    C, or D" (directly verified against the real SWIFT MT103 MRG) lists the LARGEST code set of the three agent
    fields - the same set as 56C (AT/AU/BL/CC/CH/CN/CP/ES/FW/GR/HK/IE/IN/IT/NZ/PL/PT/RU/SC/SW-x2) PLUS ZA (South
    African National Clearing Code), which 56a's own option C/D table does not list. Same lookup table as 52A/56A(A)/
    57A(A)'s paired entries: Australia AU->AUBSB; Austria AT->ATBLZ; Canada CC->CACPA; China CN->CNAPS; Germany
    BL->DEBLZ; Greece GR->GRHIC; Hong Kong HK->HKNCC; India IN->INFSC; Ireland IE->IENCC; Italy IT->ITNCC; New
    Zealand NZ->NZNCC; Poland PL->PLKNR; Portugal PT->PTNCC; Russia RU->RUCBC; South Africa ZA->ZANCC; Spain
    ES->ESNCC; Switzerland BC Code SW->CHBCC; Switzerland SIC Code SW->CHSIC (ambiguous, see edge_cases); UK
    SC->GBDSC; US CHIPS Participant Identifier CP->USPID; US Fedwire FW->USABA. NOT INCLUDED: CH (CHIPS Universal
    Identifier) - same disclosed gap as 56C's identical entry; no verified ISO 20022 equivalent found this round.
    DECISION PROCEDURE: take the 2-character MT clearing-system code identified by the paired MmbId entry above; if
    it matches exactly one row in this table, output that row's ISO 20022 code to Cd.
  edge_cases:
  - condition: "Field absent, or the line does not begin with '//'"
    handling: "not an error - this entry produces no value"
  - condition: "MT clearing-system code is not in the table (including CH), or is 'SW' (ambiguous)"
    handling: "not an error - do not guess; Cd is left unpopulated rather than picking arbitrarily"

- source_field: "57D"
  source_name: "Account With Institution (option D - name/address)"
  target_path: "CdtTrfTxInf.CdtrAgt.FinInstnId"
  mandatory: false
  transformation: decompose_party
  decomposition:
    pattern_description: >
      User-provided rule (2026-08-28): "57D present -> CdtrAgt using
      institution identification/address data." No exact SWIFT
      line-format spec attached for 57D specifically; reusing this
      document's existing optional-party-identifier-line convention
      (same shape already used for 50F/50K/59F) as the closest
      structurally-grounded parallel - first line beginning '/' is a
      party identifier, remaining line(s) are name/address. UNVERIFIED
      against actual 57D samples.
    strip_account_line_prefix: true
    account_line_pattern: "^/(.+)$"
    account_sub_element: "Id"
    sub_elements:
      Nm: line:0
      AdrLine:
        rule: lines_from:1
        optional: true
    sub_element_targets:
      Nm: CdtTrfTxInf.CdtrAgt.FinInstnId.Nm
      AdrLine: CdtTrfTxInf.CdtrAgt.FinInstnId.PstlAdr.AdrLine
      Id: CdtTrfTxInf.CdtrAgt.FinInstnId.Othr.Id
    fallback_if_unparseable: raise_error
  notes: >-
    57D Account With Institution option D maps name to FinInstnId/Nm and remaining lines to FinInstnId/PstlAdr/AdrLine.
    v2.1 BUG FIX: same class of fix as the 52D entry above - account_sub_element "Id" previously had no sub_element_targets
    destination, so the Party Identifier this entry's own notes said "must be preserved" had nowhere to actually be written.
    Routed to FinInstnId/Othr/Id, the generic identifier container, for the same no-guess reasoning as 52D above. If the
    engine later adds a configured clearing-system mapping table, a value matching a known clearing code should route to
    ClrSysMmbId instead - until then, Othr/Id is the safe default.
  edge_cases:
  - condition: "Field absent"
    handling: "not an error on its own - falls through to the Receiver-BIC fallback below"
  - condition: "Content doesn't split cleanly"
    handling: "reject - do not guess"
  - condition: "First line is exactly '/' with no content after it"
    handling: "reject - malformed party-identifier line, distinct from 'no leading slash at all'"

- source_field: "__MT_RECEIVER_BIC__"
  source_name: "Creditor Agent fallback to the MT header Receiver (Block 2) - used when 57A and 57D are both absent"
  target_path: "CdtTrfTxInf.CdtrAgt.FinInstnId.BICFI"
  mandatory: true
  transformation: conditional
  normalize_case: upper
  conditional:
    check_fields: ["57A", "57D"]
    skip_if_any_present: true
    if_none_present_field: "__MT_RECEIVER_BIC__"
  notes: >
    RULE: CdtrAgt is populated from field 57a's own definition - when 57A/57D are absent, the Receiver IS the
    Account With Institution, so CdtrAgt = the Receiver BIC. CdtrAgt can therefore legitimately equal InstdAgt's
    value in that case (both independently derived from the same Receiver), or differ when 57A/57D IS present
    (Account With Institution differs from the Receiver) - either outcome is correct, NOT a conflict or
    duplication between the two fields.
    v2.36 CHANGELOG (2026-09-11, from a live conversion the user reported: the exact same message intermittently
    passed and failed across repeated attempts on this specific InstdAgt/CdtrAgt pairing): this note previously
    led with changelog history (see below) rather than the rule itself - the same firstSentence()-truncation
    blind spot already fixed for the InstgAgt/InstdAgt entries in v2.32, but missed here and on the DbtrAgt
    fallback entry, which is exactly why the semantic audit kept confusing CdtrAgt/DbtrAgt with InstdAgt/InstgAgt
    specifically (it had clear rule text for one pair but not the other). Reordered so the rule leads; nothing
    deleted, only reordered - full original history follows below.
    v2.1 CRITICAL CORRECTION: this entry previously justified itself by claiming "User confirmed (2026-08-31): this
    deployment targets TARGET2 specifically" and pointed to scope_notes for "the confirmed TARGET2 declaration" - but
    scope_notes explicitly states the opposite: "The user does not target TARGET2 specifically... No TARGET2-specific rule
    is treated as a universal SWIFT rule." That was a direct, uncorrected contradiction between this entry and the document's
    own stated target profile, left over from this entry's original v1.9 drafting before the profile was changed to CBPR+.
    It is also independently unsound on the merits: Target2 stopped using MT altogether after its November 2022 migration to
    native ISO 20022 (MX), so a "TARGET2 MT->ISO mapping" describing an ongoing MT103->pacs.008 translation rule does not
    correspond to anything TARGET2 actually does today; and TARGET2's SettlementMethod is CLRG, not the INDA/COVE binary
    this document's GENERATED:SttlmMtd rule implements a few hundred lines below - so even on its own terms, this document
    was never actually configured for a TARGET2 deployment.

    CORRECTED SOURCING: the underlying fallback behavior (Receiver -> CdtrAgt when 57a absent) is retained, but is now
    grounded in the correct citation - the official Swift MT103 Standards field definition for 57a (Account With Institution):
    "When field 57a is not present, it means that the Receiver is also the account with institution." This is a universal
    Swift FIN usage rule on the MT103 source side itself, not a TARGET2-only or otherwise market-specific convention, and
    it mirrors the equally universal 52a rule used for the DbtrAgt/Sender fallback above. Mapping this source-side semantic
    to CdtrAgt is a faithful translation regardless of which MX target profile (CBPR+ or otherwise) is in use.

    __MT_RECEIVER_BIC__ is a synthetic field populated by MtParserService from the MT header's Block 2 (application header)
    Receiver address - a full 12-character SWIFT LT address (BIC8 + 1-char terminal identifier + 3-char branch), normalized
    to the correct 11-character BIC (BIC8 + branch, dropping ONLY the terminal identifier - see MtParserService's
    normalizeToBicCore(), fixed in v2.3: previously wrongly truncated to bare BIC8, discarding the branch code) since
    BICFIDec2014Identifier's pattern doesn't accept the raw 12-char form.
  edge_cases:
  - condition: "57A and 57D both absent, and the MT header Receiver cannot be determined"
    handling: "reject - mandatory pacs.008 element, no other sourced fallback"

- source_field: "__MT_RECEIVER_BIC__"
  source_name: "Instructed Agent (MT header Receiver, Block 2) - the CURRENT message hop, distinct from CdtrAgt"
  target_path: "CdtTrfTxInf.InstdAgt.FinInstnId.BICFI"
  mandatory: false
  transformation: direct_copy
  normalize_case: upper
  notes: >
    RULE: InstdAgt is DELIBERATELY DISTINCT from CdtrAgt - InstdAgt is the agent at THIS specific interbank hop
    (the MT header's actual Receiver, Block 2), while CdtrAgt is the ultimate creditor's bank (from field 57a,
    or its own separate Receiver-fallback) - these two are ALLOWED to differ (e.g. a correspondent-relay
    scenario) and having the same BIC value appear in only one of them, or different BIC values in each, is
    NOT a conflict or dual-assignment error. v2.32 CHANGELOG (2026-09-08): same semantic-audit firstSentence()
    fix as the InstgAgt entry above (see its own v2.32 note for the full root-cause explanation) - this note
    previously deferred its own explanation to "see its notes above" without restating the rule itself, so even
    the referenced InstgAgt note's truncation left BOTH entries blind to this distinction; now self-contained.
    v2.3 GAP FIX: mirrors the InstgAgt/Sender entry above - see its notes
    for the InstgAgt/DbtrAgt distinction, which applies symmetrically
    here (InstdAgt = this message's Receiver; CdtrAgt = the ultimate
    creditor's bank via 57a/Receiver-fallback, which can differ in a
    correspondent-relay scenario). Uses the SAME __MT_RECEIVER_BIC__
    synthetic field already built for the CdtrAgt fallback above.
  edge_cases:
  - condition: "MT header Receiver cannot be determined"
    handling: "not an error - InstdAgt is optional; this entry simply produces no value"

# ============================================================================
# v2.7 ADDITIONS - 13C, 23E, 77B (see known_limitations for full sourcing).
# 26T was ALSO deliberately excluded from value-mapping at v2.7 (see the
# known_limitations entry below) - v2.21 added a skip_with_warning entry for
# it (see that block, after the 77B entries) so the field's mere PRESENCE no
# longer hard-fails the whole conversion, without reversing the original
# no-confident-target decision.
# ============================================================================

- source_field: "13C"
  source_name: "Time Indication - SNDTIME (Sender's Time Stamp)"
  target_path: "CdtTrfTxInf.SttlmTmIndctn.DbtDtTm"
  mandatory: false
  transformation: settlement_datetime_from_time_offset
  gate_pattern: "/SNDTIME/"
  extract_pattern: "/SNDTIME/(\\d{4}[+-]\\d{4})"
  date_from_target_path: "CdtTrfTxInf.IntrBkSttlmDt"
  notes: >-
    v2.7 GAP FIX: 13C was entirely absent from this document despite being a real, current, optional MT103 field -
    confirmed present against pacs.008.001.08.xsd, which defines the identical SettlementDateTimeIndication1/
    SettlementTimeRequest2 complex types under CreditTransferTransaction39 (lines 199-200, 926-931, 953-960) already
    proven working in the companion MT202_TO_PACS00900108.yaml document's six 13C entries. field 13C is repetitive
    (multiple lines possible, newline-joined by this engine's field parser); if a line contains the codeword SNDTIME
    (format /SNDTIME/HHMM[+/-]HHMM), convert the HHMM+/-HHMM portion to an ISO 8601 time-with-UTC-offset value. If no
    SNDTIME line exists, output nothing - not an error (this entry's gate_pattern skips it entirely in that case).
    v2.16 SOURCING (2026-09-03): the real SWIFT "Standards MT November 2021" MT103 Message Reference Guide (fetched and
    read directly, section 2 "Field 13C: Time Indication") confirms Field 13C is a genuine, current MT103 field (format
    "/8c/4!n1!x4!n", repetitive, Presence Optional) and lists its CODES table verbatim - but that table names only THREE
    codes: CLSTIME, RNCTIME, SNDTIME. SNDTIME is now directly, officially sourced for MT103 (worked example given:
    ":13C:/CLSTIME/0915+0100"). See the TILTIME/FROTIME/REJTIME entries below for the codewords this same check does NOT
    cover - a real, previously undetected gap in this document's own sourcing, not merely an unconfirmed-but-probably-fine
    assumption.
    v2.21 BUG FIX (2026-09-04, from live test cases TC41/TC42): a message carrying ONLY ":13C:/CLSTIME/0915+0100" (no
    SNDTIME/RNCTIME line at all) was rejected with a hard failure whose explanation named CdtDtTm/RNCTIME specifically -
    a codeword that isn't even present in the message. Root cause #1: this and the other five 13C entries were
    llm_assisted and GeminiClient.convertLlmAssisted() ran UNCONDITIONALLY for every entry sharing this source_field,
    regardless of whether that entry's own codeword appeared in the raw value - "confidence=low" is a hard
    TransformationException, not a per-field skip, and nothing in ConverterService caught it per-entry, so ANY one of
    the six calls refusing (even correctly, because its own codeword just isn't there) failed the WHOLE conversion.
    Fixed with gate_pattern (see FieldMapping.java) - each entry is now skipped entirely, deterministically, when its
    own codeword substring is absent. Root cause #2, THIS entry and RNCTIME specifically: even for a message where
    SNDTIME/RNCTIME genuinely IS present (TC42), this entry was STILL unresolved - see the now-superseded "STRUCTURAL
    GAP" note this replaces: DbtDtTm/CdtDtTm are typed ISODateTime (full date+time), but 13C's raw value carries ONLY
    a time, and no source had been checked for which date to pair it with, so this entry was left permanently
    llm_assisted-with-no-good-answer, which the model correctly (but unhelpfully, for TC42's purposes, which expects
    a populated value) kept refusing. RESOLVED this version: paired with CdtTrfTxInf.IntrBkSttlmDt (32A's own value
    date, already deterministically converted earlier in this document's field_mappings order) via the new
    date_from_target_path mechanism and settlement_datetime_from_time_offset transformation (see
    TransformationEngine.java) - SttlmTmIndctn is literally "Settlement Time Indication," so pairing it with this
    same transaction's own settlement date (32A/IntrBkSttlmDt) is the most natural, non-arbitrary choice available in
    the message, not an invented value. This is a genuine, deliberate DECISION (not a directly-cited worked example)
    - GENERATED:CreDtTm (the conversion's own wall-clock timestamp) was considered and rejected as the pairing date,
    since a settlement time indication should describe the underlying TRANSACTION's timing, not when the file
    happened to be converted. Now fully deterministic - no LLM call at all for either SNDTIME or RNCTIME.
  edge_cases:
  - condition: "Field absent, or no SNDTIME line present"
    handling: "not an error - this entry is skipped entirely by gate_pattern"
  - condition: "SNDTIME line present but the time portion is not valid HHMM[+/-]HHMM"
    handling: "reject - do not guess"
  - condition: "SNDTIME line present but CdtTrfTxInf.IntrBkSttlmDt was not yet populated (field_mappings ordering issue)"
    handling: "reject - see settlementDateTimeFromTimeOffset's own guard in TransformationEngine.java"

- source_field: "13C"
  source_name: "Time Indication - RNCTIME (Receiver's Time Stamp)"
  target_path: "CdtTrfTxInf.SttlmTmIndctn.CdtDtTm"
  mandatory: false
  transformation: settlement_datetime_from_time_offset
  gate_pattern: "/RNCTIME/"
  extract_pattern: "/RNCTIME/(\\d{4}[+-]\\d{4})"
  date_from_target_path: "CdtTrfTxInf.IntrBkSttlmDt"
  notes: >-
    RULE: this entry captures field 13C's RNCTIME codeword specifically (Receiver's time stamp) - a distinct
    codeword and target from its sibling 13C entries (SNDTIME/CLSTIME/TILTIME/FROTIME/REJTIME), gated on its own
    "/RNCTIME/" marker so it only ever fires for that specific codeword's content.
    v2.7 GAP FIX: paired with the SNDTIME entry above - identical mechanism, codeword RNCTIME.
    v2.16 SOURCING: RNCTIME is one of the three codes confirmed for MT103 Field 13C by the official SWIFT MT103 field
    spec (see the SNDTIME entry above for the citation) - directly sourced, not just ported from the companion MT202 doc.
    v2.21 BUG FIX (TC41/TC42): same fix as the SNDTIME entry above in every respect (gate_pattern for presence,
    settlement_datetime_from_time_offset + date_from_target_path for the date-pairing resolution) - see its notes for
    the full explanation, including why CdtTrfTxInf.IntrBkSttlmDt (not GENERATED:CreDtTm) was chosen as the paired date.
  edge_cases:
  - condition: "Field absent, or no RNCTIME line present"
    handling: "not an error - this entry is skipped entirely by gate_pattern"
  - condition: "RNCTIME line present but the time portion is not valid HHMM[+/-]HHMM"
    handling: "reject - do not guess"
  - condition: "RNCTIME line present but CdtTrfTxInf.IntrBkSttlmDt was not yet populated (field_mappings ordering issue)"
    handling: "reject - see settlementDateTimeFromTimeOffset's own guard in TransformationEngine.java"

- source_field: "13C"
  source_name: "Time Indication - CLSTIME (Cover Time / latest time by which cover must be received)"
  target_path: "CdtTrfTxInf.SttlmTmReq.CLSTm"
  mandatory: false
  transformation: time_offset_format
  gate_pattern: "/CLSTIME/"
  extract_pattern: "/CLSTIME/(\\d{4}[+-]\\d{4})"
  notes: >-
    RULE: this entry captures field 13C's CLSTIME codeword specifically (cover time / latest settlement cutoff) -
    a distinct codeword and target from its sibling 13C entries, gated on its own "/CLSTIME/" marker so it only
    ever fires for that specific codeword's content.
    v2.7 GAP FIX: paired with the SNDTIME entry above - identical mechanism, codeword CLSTIME.
    v2.16 SOURCING: CLSTIME is one of the three codes confirmed for MT103 Field 13C by the official SWIFT MT103 field
    spec (see the SNDTIME entry above for the citation) - directly sourced, not just ported from the companion MT202 doc.
    v2.21 BUG FIX (2026-09-04, from live test cases TC41/TC42): switched from llm_assisted to the new deterministic
    time_offset_format transformation (TransformationEngine.java) - unlike SNDTIME/RNCTIME above, this entry's target
    (SttlmTmReq/CLSTm) is a bare ISOTime, not ISODateTime, so it has no date-pairing gap at all and never needed an
    LLM call in the first place; the only actual bug was the shared-source-field refusal-cascade already fixed via
    gate_pattern (see the SNDTIME entry's note) - reformatting HHMM[+-]HHMM to HH:MM:SS+HH:MM is a fixed, mechanical
    operation with a single correct answer.
  edge_cases:
  - condition: "Field absent, or no CLSTIME line present"
    handling: "not an error - this entry is skipped entirely by gate_pattern"
  - condition: "CLSTIME line present but the time portion is not valid HHMM[+/-]HHMM"
    handling: "reject - do not guess"

- source_field: "13C"
  source_name: "Time Indication - TILTIME (Till Time)"
  target_path: "CdtTrfTxInf.SttlmTmReq.TillTm"
  mandatory: false
  transformation: time_offset_format
  gate_pattern: "/TILTIME/"
  extract_pattern: "/TILTIME/(\\d{4}[+-]\\d{4})"
  notes: >-
    RULE: this entry captures field 13C's TILTIME codeword specifically ("till time") - a distinct codeword and
    target from its sibling 13C entries, gated on its own "/TILTIME/" marker so it only ever fires for that
    specific codeword's content.
    v2.7 GAP FIX: paired with the SNDTIME entry above - identical mechanism, codeword TILTIME.
    v2.16 SOURCING CAVEAT (2026-09-03): unlike CLSTIME/RNCTIME/SNDTIME (see the SNDTIME entry above), the real SWIFT
    "Standards MT November 2021" MT103 Message Reference Guide's CODES table for Field 13C lists ONLY CLSTIME/RNCTIME/
    SNDTIME - TILTIME is NOT among them. This entry's implementation is ported from the companion MT202 document (which
    has its own, separately-sourced Field 13C entries) and from the target-side pacs.008 XSD's SttlmTmReq/TillTm element
    genuinely existing - but no source checked so far confirms TILTIME is a valid codeword for MT103's Field 13C
    specifically. Not necessarily wrong (a newer Standards MT release may add it, or it may be valid via bilateral
    agreement even if not in the base 2021 spec), but this is now a disclosed, real gap rather than an assumed-safe port.
    v2.21 BUG FIX: switched from llm_assisted to time_offset_format - see the CLSTIME entry's identical v2.21 note
    above (no date-pairing gap for SttlmTmReq targets; the LLM was never actually needed here, only gate_pattern was).
  edge_cases:
  - condition: "Field absent, or no TILTIME line present"
    handling: "not an error - this entry is skipped entirely by gate_pattern"
  - condition: "TILTIME line present but the time portion is not valid HHMM[+/-]HHMM"
    handling: "reject - do not guess"

