conversion_id: MT103_TO_PACS008
source_format: MT103
target_format: pacs.008.001.08
version: "2.21"
last_updated: "2026-09-04"
scope_notes: >
  SWIFT MT103 -> pacs.008.001.08 mapping profile.


  TARGET PROFILE DECISION (2026-08-31): The user does not target TARGET2 specifically. This document therefore treats SWIFT
  CBPR+ / FINplus cross-border payment translation practice as the primary target profile for MT103 -> pacs.008.001.08. The
  supplied pacs.008.001.08 XSD remains the structural authority. Exact CBPR+ translation tables are maintained by Swift in
  MyStandards / the Translation Portal; where a public Swift source does not expose a field-level rule, this document does
  not label the rule "SWIFT-confirmed". It either uses a corroborated public implementation/reference or fails closed.


  SOURCE HIERARCHY:

  1. Supplied pacs.008.001.08 XSD for XML structure and datatype constraints.

  2. Official Swift MT103 Message Reference Guide / public Swift payment guidance for MT field semantics.

  3. Official Swift public CBPR+/PMPG material for pacs.008 usage, settlement, addresses and translation principles.

  4. Public CBPR+ implementation evidence (Prowide translation release notes) only as corroboration where the exact Swift
  Translation Portal rule is not publicly exposed; such evidence is explicitly labelled corroborative, not a substitute for
  MyStandards certification.

  5. No TARGET2-specific rule is treated as a universal SWIFT rule.


  IMPORTANT: The public Swift website confirms that MT103 is translated to pacs.008 under CBPR+ and that the authoritative
  translation rules are available through Swift MyStandards / Translation Portal. Exact portal-only field rules cannot be
  independently certified from public pages without access. This file therefore fails closed on genuinely unresolved mappings
  rather than inventing values.


  ADDRESS POLICY (v2.14 UPDATE): 50K/bare-59's free-text AdrLine content can now OPTIONALLY be additionally enriched with
  structured StrtNm/TwnNm/PstCd/Ctry via a libpostal-based sidecar service (address-parser-service/, called by
  ConverterService.enrichWithStructuredAddress) - implementing the "hybrid address" model (structured fields ALONGSIDE
  free-text AdrLine, not instead of it) Swift requires from 14 November 2026 for in-scope cross-border payment messages.
  This is OFF by default (mtmx.address-parser-enabled=false) - AdrLine-only remains this document's default behavior,
  schema-valid and SWIFT-compliant today. When enabled, structured fields are populated ONLY when the sidecar's own
  country cross-check (against a real ISO 3166 list) succeeds - if it doesn't, or the sidecar is unreachable, the
  message still converts successfully with AdrLine-only, exactly as before enabling the feature; nothing is ever lost,
  and nothing is ever guessed. Still true, unchanged: this document does NOT itself infer Town/Country/PostalCode from
  free text via regex/heuristic - the libpostal service is a real trained statistical model, not a hand-written guess,
  and even it is not trusted blindly (see its own country-confidence gate). For F-option structured addresses (50F/59F),
  the existing numbered-line extraction (unambiguous, since the source itself delimits country by position) is
  unaffected by this change and remains the primary source for those fields. A deployment intended to be
  live after 14 November 2026 must set mtmx.address-parser-enabled=true and actually run address-parser-service/ -
  simply having this capability exist in the codebase does not make a deployment compliant if it isn't turned on.


  SETTLEMENT POLICY: SettlementMethod is not a value that can be safely inferred from the mere absence of 53/54/55. The current
  rule keeps the conservative INDA default for ordinary serial payments and uses COVE only for explicit cover/reimbursement
  patterns supported by the configured source fields. A production deployment must validate this against its actual CBPR+
  Translation Portal rule/corridor configuration.


  OPERATIONAL SCOPE (added v2.1): Swift's CBPR+ MT/MX coexistence period for cross-border payment instructions ended in
  November 2025; new live cross-border FI-to-FI traffic on the Swift network is native ISO 20022 (pacs.008), not MT103. This
  converter is therefore for MT103 input arriving from a source that still legitimately produces it after that date - e.g.
  legacy/archival MT103 conversion, a domestic or non-Swift rail still issuing MT103, back-office reconciliation against
  historical messages, or test/reference tooling - not for translating live Swift cross-border network traffic, which is
  MX-native today. Confirm the actual source of incoming MT103 messages before deploying this mapping in production, since
  that context affects how strict the fail-closed decisions below should be.


  M/O STATUS RESOLUTION (v2.8): supersedes the earlier "M/O status: no MT103 FIN spec attached... all set to false"
  known_limitations entry. Two independent public MT103 field-spec sources (Paiementor's format specification table and
  iotafinance's MT103 detail view) agree on which fields are unconditionally mandatory in every real MT103, independent of
  which option letter is used: 20, 23B, 32A, 50a (any of 50A/50F/50K), 59a (any of 59/59A/59F), and 71A. This document now
  reflects that as follows, and deliberately NOT the same way for every field:
  - 20, 23B, 32A, 71A - single, non-alternative fields. Each one's field_mappings entry/entries now have mandatory: true
    directly, since there is no ambiguity about which entry represents "the field" for these four.
  - 50a and 59a - each has THREE option-letter variants (50A/50F/50K, 59/59A/59F), and only ONE is ever populated in any
    single real message; the other two are legitimately, correctly absent. Setting mandatory: true on all three entries per
    group would be WRONG - it would make the engine reject a perfectly valid 50K-only message merely because 50A and 50F
    (which were never meant to be present) are absent too. mandatory: true is a per-ENTRY flag with no "at least one of
    these entries" semantics, so it is structurally the wrong mechanism for an alternative-letter group; these entries'
    individual mandatory flags therefore correctly stay false. The actual group-level mandatory enforcement is VR005
    (rule_type: source_alternative_group_required, in validation_rules below), which checks "at least one of 50A/50F/50K
    is present in the source message" (and likewise for 59/59A/59F) - the mechanism this document already had for exactly
    this shape of rule, now also run as a fail-fast precondition (ConversionOrchestrator.checkMandatorySourceFields(), called
    immediately after parsing, before the first conversion attempt) rather than only re-checked after a conversion attempt
    had already run. See VR005's own logic note below for the engine-wiring history of that fix.
  - GENERATED:*/__MT_SENDER_BIC__/__MT_RECEIVER_BIC__ entries already marked mandatory: true were untouched by this pass -
    they were correct before and remain correct; this resolution only affects entries whose mandatory flag was previously
    a placeholder false regardless of real status.
  Fields NOT in this mandatory set (13C, 23E, 26T, 33B, 36, 51A, 52a, 53a, 54a, 55a, 56a, 57a, 70, 71F, 71G, 72, 77B) remain
  mandatory: false - genuinely optional per both sources consulted, with 36 additionally having its own conditional
  requirement already covered by VR001 (mandatory only when 33B is present and its currency differs from 32A's), not a
  blanket M/O status.

field_mappings:
- source_field: "20"
  source_name: "Sender's Reference (reused for Message Identification)"
  target_path: "GrpHdr.MsgId"
  mandatory: true
  transformation: direct_copy
  max_length: 35
  notes: >
    v2.3 REVISION (real-message comparison, 2026-08-31): previously
    generated as a fresh random UUID (v1.8) on the reasoning that MsgId
    must be unique per message rather than copied from input. Switched to
    reusing field 20 (Sender's Reference) directly, matching a common
    real-world convention (also seen in a shared reference pacs.008
    example, where MsgId/InstrId/EndToEndId all equal the same sender
    reference) and this document's OWN existing precedent for field 20
    (already cited, UHB-adjacent: 'a point-to-point reference... directly
    comparable with the Sender's Reference'). TRADEOFF, stated plainly:
    field 20 is chosen by the SENDER and is only guaranteed unique within
    that sender's own traffic, not globally the way a UUID is - if this
    deployment needs cross-institution global uniqueness for MsgId, a
    generated UUID (this document's previous approach) may still be more
    appropriate; revisit if that need is confirmed. mandatory:true with no
    default_values fallback is intentional: if field 20 is genuinely
    absent, this now fails closed rather than silently generating a
    disconnected UUID - consistent with this document's broader v2.x
    fail-closed direction. max_length:35 matches Max35Text; field 20
    itself is capped at 16 chars by MT103 FIN Category 1 field length
    rules (see the InstrId entry above), well within that limit.
  edge_cases:
  - condition: "Field absent"
    handling: "reject - GrpHdr/MsgId is mandatory with no other sourced value to fall back to"

- source_field: "GENERATED:CreDtTm"
  source_name: "Creation Date Time (synthetic - not sourced from any MT103 field)"
  target_path: "GrpHdr.CreDtTm"
  mandatory: true
  transformation: generated
  generator: timestamp
  notes: >
    v1.8 GAP FIX: GrpHdr/CreDtTm is mandatory per the pacs.008.001.08
    XSD, same envelope-field status as MsgId above - set to the actual
    conversion time, not any value from the source message.
  edge_cases:
  - condition: "N/A - always generated, never absent"
    handling: "not applicable"

- source_field: "GENERATED:NbOfTxs"
  source_name: "Number Of Transactions (synthetic - not sourced from any MT103 field)"
  target_path: "GrpHdr.NbOfTxs"
  mandatory: true
  transformation: constant
  constant_value: "1"
  notes: >
    v1.8 GAP FIX: GrpHdr/NbOfTxs is mandatory per the pacs.008.001.08
    XSD. Fixed at "1" because this engine converts exactly one MT103
    into exactly one CdtTrfTxInf per message (no batching support) -
    unlike MsgId/CreDtTm this value is genuinely the same for every
    conversion, so 'constant' (not 'generated') is correct here.
  edge_cases:
  - condition: "N/A - always constant"
    handling: "not applicable"

- source_field: "20"
  source_name: "Sender's Reference"
  target_path: "CdtTrfTxInf.PmtId.InstrId"
  mandatory: false
  transformation: truncate
  max_length: 16
  notes: >-
    Field 20 maps to PaymentIdentification/InstructionIdentification. The CBPR+ translation restricts this point-to-point
    reference to 16 characters. Never silently truncate; the engine must reject values longer than 16 characters.
  edge_cases:
  - condition: "Value exceeds 16 characters"
    handling: "reject - do not silently truncate beyond the CBPR+ limit"
  - condition: "Field absent"
    handling: "reject - InstrId is Min 1 - Max 1 per UHB p.209"

- source_field: "121"
  source_name: "UETR (Block 3)"
  target_path: "CdtTrfTxInf.PmtId.UETR"
  mandatory: false
  transformation: direct_copy
  allowed_pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
  notes: >-
    UETR is UUID version 4 and is carried in MT Block 3 field 121. Reject an absent or malformed UETR in this strict profile;
    do not fabricate a replacement in the mapping layer. Public Swift material identifies UETR as a required tracking identifier
    for MT103/pacs.008 payment flows; exact current contingency handling belongs to the Swift Translation Portal.
  edge_cases:
  - condition: "Block 3 Field 121 absent"
    handling: "reject - do not generate a substitute UUID"

- source_field: "32A"
  source_name: "Value Date (of 32A composite)"
  target_path: "CdtTrfTxInf.IntrBkSttlmDt"
  mandatory: true
  transformation: llm_assisted
  notes: >
    UHB p.212, verbatim: "the value date comparable with the MT Field
    32A." Schema has no composite-field substring-extraction transform
    type, so date_format applied directly to the raw 32A value (e.g.
    "240115USD1234,56") throws - llm_assisted used as a workaround, not
    because the rule is judgement-based (it's deterministic fixed-width
    extraction). DECISION PROCEDURE (verbatim, given to the LLM step):
    "Take MT field 32A. First 6 characters = value date, YYMMDD. Convert
    to YYYY-MM-DD, YY = 20YY. Output only the converted date."
    v2.8 M/O CORRECTION: mandatory changed false->true, matching this entry's own edge_cases below, which already said
    "reject - mandatory" even while the mandatory: flag itself said false - a direct inconsistency this fixes. Field 32A is
    unconditionally mandatory in every MT103 per the SWIFT MT103 Standards field table, confirmed by two independent public
    field-spec sources and already enforced at the message level by VR005. See the superseded "M/O status" known_limitations
    entry for why every field was originally left false regardless of real status.
  edge_cases:
  - condition: "YY outside 01-60"
    handling: >
      reject. Confirmed empirically: sample TRNK
      (inflow_translation_sample_messages_2025Q3) with date 2061-07-21
      produced engine error "T50 Year not in range 01 - 60" - legacy
      MT two-digit year is only valid 2001-2060.
  - condition: "Field absent"
    handling: "reject - mandatory pacs.008 element per UHB p.212"
  - condition: "First 6 characters not all digits"
    handling: "reject - malformed 32A"

- source_field: "32A"
  source_name: "Interbank Settled Amount - currency portion (of 32A composite)"
  target_path: "CdtTrfTxInf.IntrBkSttlmAmt.@Ccy"
  mandatory: true
  transformation: direct_copy
  extract_pattern: "^\\d{6}([A-Z]{3})"
  allowed_pattern: "^[A-Z]{3}$"
  notes: >
    v1.11 STRUCTURAL FIX: split off from a single llm_assisted entry
    that targeted IntrBkSttlmAmt directly - which validation rejected
    with 'cvc-complex-type.4: Attribute Ccy must appear on element
    IntrBkSttlmAmt', because MxRenderer had NO way to emit XML
    attributes at all (ActiveCurrencyAndAmount's Ccy is a MANDATORY
    attribute, not a child element - see the XSD) and a single
    llm_assisted entry can only ever produce ONE value at ONE
    target_path, structurally incapable of populating both the
    attribute and the text content from one call. Fixed by adding a
    generic '@AttrName' convention to MxRenderer (any target_path ending
    in .@Foo sets attribute Foo on the parent element) and splitting
    this into two entries. UHB p.212, verbatim: "the point-to-point
    currency amount exchanged, comparable with the MT Field 32A."
    Currency extraction (characters 7-9 of the composite) is
    deterministic fixed-width extraction, not a judgement call, so uses
    extract_pattern + direct_copy instead of an LLM - matches this
    engine's own stated preference for exact operations over LLM calls
    where a single correct answer exists. allowed_pattern enforces the
    ISO 4217 shape this entry's edge_cases already described but the
    prior llm_assisted version never actually enforced.
  edge_cases:
  - condition: "Field absent"
    handling: "reject - mandatory pacs.008 element per UHB p.212"
  - condition: "Characters 7-9 not 3 uppercase letters"
    handling: "reject - do not guess currency (enforced by allowed_pattern)"

- source_field: "32A"
  source_name: "Interbank Settled Amount - amount portion (of 32A composite)"
  target_path: "CdtTrfTxInf.IntrBkSttlmAmt"
  mandatory: true
  transformation: decimal_comma_to_dot
  extract_pattern: "^\\d{6}[A-Z]{3}(.+)$"
  notes: >-
    Deterministic fixed-width extraction of the first 6 characters of MT103 field 32A (YYMMDD) followed by ISO date conversion.
    The mapping schema has no substring/date extraction transform, so llm_assisted remains an engine-schema workaround; the
    decision procedure is deterministic and the LLM must never infer missing data. Reject malformed dates and years outside
    the MT103 01-60 range.
    v2.8 M/O CORRECTION: mandatory changed false->true - see the 32A/IntrBkSttlmDt entry's identical v2.8 note above.
  edge_cases:
  - condition: "Field absent"
    handling: "reject - mandatory pacs.008 element per UHB p.212"
  - condition: "Remainder is not a valid comma-decimal number"
    handling: "reject - enforced by decimal_comma_to_dot"

- source_field: "GENERATED:SttlmMtd"
  source_name: "Settlement Method (derived - not sourced from any single MT103 field)"
  target_path: "GrpHdr.SttlmInf.SttlmMtd"
  mandatory: true
  transformation: conditional
  conditional:
    check_fields:
    - 53A
    - 53B
    - 53D
    - 54A
    - 54B
    - 54D
    - 55A
    - 55B
    - 55D
    if_any_present: COVE
    if_none_present: INDA
  notes: >-
    SettlementMethod is mandatory in pacs.008. Public Swift/PMPG guidance says the method must reflect the actual settlement
    relationship; it must not be guessed merely from XML structure. For this generic CBPR+ profile the mapping uses COVE when
    explicit reimbursement/cover indicators are present in the configured MT fields, otherwise INDA for the ordinary serial
    case. This is a conservative implementation rule, not a universal statement that every 53/54/55 combination means COVE;
    validate against the Swift Translation Portal/corridor configuration before production.
    v2.1 BUG FIX: 54A (Receiver's Correspondent, option A) was missing from check_fields even though 53A and 55A - its exact
    option-A counterparts on the other two reimbursement-agent fields - were both included, and 54A itself is mapped
    elsewhere in this document as an ordinary expected field. A message carrying only 54A (no other 53/54/55 field) would
    previously have been misclassified as INDA despite an explicit correspondent relationship being present. Added for
    symmetry with 53A/53D and 55A/55B/55D.
    v2.19 BUG FIX (2026-09-04, while implementing 53B support for live test case TC22): "53B" was missing from check_fields
    - only 53A and 53D were listed, while 54 and 55 both symmetrically included all three options (A/B/D). A message
    carrying ONLY 53B (a real, common usage per field 53a's own usage rule - see the new 53B entry below) was
    previously misclassified as INDA despite an explicit reimbursement relationship being present. Added for
    consistency with 54B/55B, which were already correctly included.
    v2.16 SOURCING NOTE (2026-09-03): the real SWIFT "Standards MT November 2021" MT103 Message Reference Guide (fetched and
    read directly) confirms there is no MT103 field corresponding to SttlmMtd at all - Fields 1-23 cover Sender's Reference
    through Regulatory Reporting, none of them GrpHdr/SttlmInf/SttlmMtd - consistent with this entry's own "(derived)"
    labelling; the absence itself is now directly confirmed, not assumed. A secondary source (a core-banking vendor's
    settlement-method documentation, found via web search but NOT independently read at the primary-source page - the page
    itself returned HTTP 404 on direct fetch) describes settlement-method derivation as driven by the SENDING BANK'S OWN
    account-master configuration (whether the correspondent account is held as Nostro or Vostro), not by inspecting which
    MT fields are present in the incoming message. That is consistent with why no universal SWIFT-standard-level formula
    exists to cite here: the real trigger lives in each bank's own systems, which this converter has no access to. This
    document's check_fields heuristic (COVE if 53/54/55 present) remains a documented, disclosed IMPLEMENTATION DEFAULT,
    not a discovered SWIFT rule - unchanged in substance from earlier versions, but now more precisely justified as to WHY
    no better citation exists, rather than left as an open question further searching might resolve.
  edge_cases:
  - condition: "None of 53A/54A/55A present, and the real settlement method for this corridor is not INDA"
    handling: "reject is safer than silently mislabeling - change if_none_present to the correct code, or add a stricter check_fields/value-based
      rule if INDA is not always correct"

- source_field: "53A"
  source_name: "Sender's Correspondent (option A only)"
  target_path: "GrpHdr.SttlmInf.InstgRmbrsmntAgt.FinInstnId.BICFI"
  mandatory: false
  transformation: decompose_party
  decomposition:
    pattern_description: >-
      v2.9 BUG FIX: was a plain direct_copy assuming the raw value was ALWAYS a bare single-line BIC - the same bug
      class already found and fixed for 56A/57A in this document's own v1.1 changelog ("was a plain direct_copy
      assuming the raw value was ALWAYS a bare single-line BIC"), but never applied here. Field 53A's real format is
      "[/1!a][/34x]" (an OPTIONAL leading Party Identifier / account line) THEN "4!a2!a2!c[3!c]" (the BIC) - a
      direct_copy on a genuine two-line raw value would copy the WHOLE multi-line string into BICFI, failing BIC
      pattern validation. Confirmed against TARGET2 "General Functional Specification of the MX/ISO 20022 migration,"
      Annex 5.1.3: 53A's Party Identifier line maps to GroupHeader/SettlementInformation/SettlementAccount/Identification
      - not dropped, as this entry previously did by never reading it at all. Mirrors the identical, already-proven
      account_line_pattern/strip_account_line_prefix mechanism this document's companion MT202_TO_PACS00900108.yaml
      document already uses for its own 53A entry, targeting the same SttlmAcct path.
    strip_account_line_prefix: true
    account_line_pattern: "^/(.+)$"
    account_sub_element: "Id"
    sub_elements:
      BICFI: "line:0"
    sub_element_targets:
      BICFI: "GrpHdr.SttlmInf.InstgRmbrsmntAgt.FinInstnId.BICFI"
    conditional_sub_element_targets:
      Id:
        pattern: "[A-Z]{2}[0-9]{2}[A-Za-z0-9]{1,30}"
        if_match_target: "GrpHdr.SttlmInf.SttlmAcct.Id.IBAN"
        else_target: "GrpHdr.SttlmInf.SttlmAcct.Id.Othr.Id"
    fallback_if_unparseable: raise_error
  notes: >
    UHB p.206, verbatim: "comparable with the Field 53a in the legacy
    FIN message." Relevant only when SttlmMtd=COVE (VR003). Option A
    (BIC) only - see the new dedicated 53B/53D entries below (v2.19,
    from live test cases TC22/TC28) for those two options, previously
    genuinely unmapped (unmapped_fields_policy=error) - a real coverage
    gap for entirely legal SWIFT syntax, not an edge case.
  edge_cases:
  - condition: "Field absent"
    handling: "reject only if SttlmMtd=COVE requires it; otherwise legitimately absent (Min 0)"
  - condition: "No leading-slash account line present"
    handling: "not an error - the common case; only BICFI is produced"

- source_field: "53B"
  source_name: "Sender's Correspondent (option B - account only, no BIC)"
  target_path: "GrpHdr.SttlmInf.SttlmAcct"
  mandatory: false
  transformation: decompose_party
  decomposition:
    pattern_description: >-
      v2.19 GAP FIX (2026-09-04, from live test case TC22): field 53a option B was entirely unmapped
      (unmapped_fields_policy=error rejected any message carrying it) despite being real, common, spec-legal
      syntax - the real SWIFT MT103 field spec's own USAGE RULES for field 53a state: "In those cases where there
      are multiple direct account relationships, in the currency of the transaction, between the Sender and the
      Receiver, and one of these accounts is to be used for reimbursement, the account to be credited or debited
      must be indicated in field 53a, using option B with the party identifier only" - i.e. 53B's realistic,
      documented usage is genuinely account-only, no BIC, no location line, matching TC22's own input
      (":53B:/12345678901"). FORMAT per the spec: "[/1!a][/34x]" (Party Identifier) then "[35x]" (Location) - both
      optional. This entry extracts the account (Party Identifier) via the same strip_account_line_prefix mechanism
      as 53A, routed to the SAME SttlmAcct target 53A's own account-portion already uses. RESIDUAL GAP, disclosed
      not guessed: a 53B carrying a SECOND line (the free-text "Location" subfield) has no sourced pacs.008 target -
      no worked example or citation was found for where a bare location string belongs, and none of
      GroupHeader93/SettlementInstruction15's elements are an obvious fit for unstructured free text. That second
      line is currently NOT captured (silently, since decompose_party only rejects on a DECLARED sub_element failing
      to match, not on unconsumed extra lines) - flagged here rather than left undocumented. Unlike 53A/53D, option
      B never supplies a BIC, so this entry deliberately does NOT populate InstgRmbrsmntAgt at all - it stays
      correctly absent for a 53B-only message (minOccurs=0, valid per schema).
      IMPLEMENTATION NOTE: DecompositionService.decompose() only returns its result directly when sub_elements is
      non-empty AND every declared (non-optional) entry matched - an EMPTY sub_elements map falls through to the
      guided LLM fallback instead, even though the account was already correctly captured via
      strip_account_line_prefix/account_sub_element before that point. The "Placeholder" entry below exists purely
      to satisfy that non-empty check - line:5 is chosen deliberately far beyond option B's real 1-2 line range
      (Party Identifier, optionally Location) so it can never actually match and misroute anything; it is not a
      real field. Checked directly against ConverterService/DecompositionService source, not assumed.
    strip_account_line_prefix: true
    account_line_pattern: "^/(.+)$"
    account_sub_element: "Id"
    sub_elements:
      Placeholder:
        rule: "line:5"
        optional: true
    sub_element_targets: {}
    conditional_sub_element_targets:
      Id:
        pattern: "[A-Z]{2}[0-9]{2}[A-Za-z0-9]{1,30}"
        if_match_target: "GrpHdr.SttlmInf.SttlmAcct.Id.IBAN"
        else_target: "GrpHdr.SttlmInf.SttlmAcct.Id.Othr.Id"
    fallback_if_unparseable: raise_error
  notes: >-
    Option B (account/Party Identifier only, no BIC) - see pattern_description for the full citation and the
    disclosed Location-line residual gap.
  edge_cases:
  - condition: "Field absent"
    handling: "not an error - Min 0"
  - condition: "No leading-slash account line present (e.g. field carries only a Location line, no account)"
    handling: "not an error - this entry produces no value; nothing to route"

- source_field: "53D"
  source_name: "Sender's Correspondent (option D - name/address, no BIC)"
  target_path: "GrpHdr.SttlmInf.InstgRmbrsmntAgt.FinInstnId"
  mandatory: false
  transformation: decompose_party
  decomposition:
    pattern_description: >-
      v2.19 GAP FIX (2026-09-04, from live test case TC28): field 53a option D was entirely unmapped despite being
      real, spec-legal syntax - FORMAT per the real SWIFT MT103 field spec: "[/1!a][/34x]" (Party Identifier) then
      "4*35x" (Name and Address), the SAME shape already proven for 52D/57D. Mirrors those two entries' exact
      mechanism: strip_account_line_prefix extracts an optional leading account line, sub_elements.Nm takes the
      first remaining line, AdrLine takes the rest. Party Identifier (if present) routed to SttlmAcct/Othr/Id, the
      same safe/no-guess default 52D/57D already use for their own Party Identifier line, rather than ClrSysMmbId
      (which needs a configured clearing-system scheme code this document does not have for option D).
    strip_account_line_prefix: true
    account_line_pattern: "^/(.+)$"
    account_sub_element: "Id"
    sub_elements:
      Nm: "line:0"
      AdrLine:
        rule: "lines_from:1"
        optional: true
    sub_element_targets:
      Nm: "GrpHdr.SttlmInf.InstgRmbrsmntAgt.FinInstnId.Nm"
      AdrLine: "GrpHdr.SttlmInf.InstgRmbrsmntAgt.FinInstnId.PstlAdr.AdrLine"
      Id: "GrpHdr.SttlmInf.SttlmAcct.Id.Othr.Id"
    fallback_if_unparseable: raise_error
  notes: >-
    Option D (name/address, no BIC) - mirrors 52D/57D exactly; see pattern_description for the citation. Also the
    concrete case rule C4 restricts: SPRI forbids 53a option D (see VR011).
  edge_cases:
  - condition: "Field absent"
    handling: "not an error on its own - falls through to the 53A/53B account paths above (which independently
      populate SttlmAcct/InstgRmbrsmntAgt if present)"
  - condition: "Content doesn't split cleanly"
    handling: "reject - do not guess"
  - condition: "First line is exactly '/' with no content after it"
    handling: "reject - malformed party-identifier line, distinct from 'no leading slash at all'"

- source_field: "54A"
  source_name: "Receiver's Correspondent (option A only)"
  target_path: "GrpHdr.SttlmInf.InstdRmbrsmntAgt.FinInstnId.BICFI"
  mandatory: false
  transformation: decompose_party
  decomposition:
    pattern_description: "v2.9 BUG FIX: same fix and TARGET2 Annex 5.1.3 citation as the 53A entry above, mirrored for 54a."
    strip_account_line_prefix: true
    account_line_pattern: "^/(.+)$"
    account_sub_element: "Id"
