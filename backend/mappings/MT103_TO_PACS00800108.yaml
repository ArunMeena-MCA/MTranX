  source_name: "Time Indication - FROTIME (From Time)"
  target_path: "CdtTrfTxInf.SttlmTmReq.FrTm"
  mandatory: false
  transformation: time_offset_format
  gate_pattern: "/FROTIME/"
  extract_pattern: "/FROTIME/(\\d{4}[+-]\\d{4})"
  notes: >-
