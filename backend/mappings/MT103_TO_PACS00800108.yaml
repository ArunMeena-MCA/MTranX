- source_field: "23E"
  source_name: "Instruction Code - Instruction3Code-enumerated values (CHQB/HOLD/PHOB/TELB, no trailing narrative)"
  target_path: "CdtTrfTxInf.InstrForCdtrAgt#0.Cd"
  mandatory: false
  transformation: decompose_party
  decomposition:
    pattern_description: >-
      v2.7 GAP FIX: 23E was previously excluded entirely ("NOT MAPPED... No field_mappings entry" per the prior
      known_limitations entry, now superseded). Reopened after directly reading the Bank of America MT103-to-pacs.008
      formatting guide, which gives a real worked example (:23E:CHQB -> <InstrForCdtrAgt><InstrInf>...) and shows 23E
      branches to one of three possible targets depending on the code: InstrForCdtrAgt, PmtTpInf/SvcLvl/Cd, or
      PmtTpInf/CtgyPurp/Cd. Tightened against the actual supplied XSD: InstructionForCreditorAgent1
      (pacs.008.001.08.xsd) has its OWN closed-enum Cd sub-element, Instruction3Code, restricted to exactly {CHQB,
      HOLD, PHOB, TELB} - the same four values shown in the source guide's own 23E code-narrative table. Since these
      four MT codewords are lexically identical to the four valid Cd enum values, writing the codeword directly into
      Cd (not InstrInf) is the more schema-precise translation.
      v2.22 REDESIGN (2026-09-07, from live test case TC96): converted from llm_assisted to decompose_party - see the
      InstrInf entry below's v2.22 note for the full explanation (this class of rule - "is this line one of a small
      fixed set of known codes" - is 100% deterministic, and asking an LLM to follow a per-line prose rule proved to
      NOT reliably generalize past 2 simultaneous codes, confirmed by TC96's 3-code case failing even after the
      earlier gate_pattern fix). A line matching exactly one of CHQB/HOLD/PHOB/TELB is now extracted by regex alone,
      zero LLM involvement, zero risk of a refusal.
      v2.27 BUG FIX (2026-09-08, from live test cases TC105/136): the v2.22 redesign fixed the LLM-reliability
      problem but introduced a NEW collision: a single, non-indexed regex match (no all_matches) means TWO
      Cd-eligible codes on the same message (e.g. "TELB\nPHOB", TC105; "SDVA/CORT/HOLD/CHQB", TC136) silently kept
      only the FIRST match - the second was not just missing from Cd, it was LOST ENTIRELY, since InstrInf's own
      negative-lookahead regex (see that entry below) explicitly EXCLUDES any line that is one of the 7 known codes,
      including the one Cd itself failed to keep. Confirmed directly against pacs.008.001.08.xsd:
      InstrForCdtrAgt itself is maxOccurs="unbounded" (the repeatable unit is the whole InstructionForCreditorAgent1
      container, not Cd within it) - so TWO Cd-eligible codes need TWO SEPARATE InstrForCdtrAgt occurrences, each
      with its own single Cd child, not one InstrForCdtrAgt with two Cd values (which the schema doesn't allow
      anyway). Fixed with all_matches: true (each matching line now becomes "Cd#0", "Cd#1", ...) plus a NEW
      ConverterService mechanism: an override target_path containing a literal "#0" has the repeat suffix
      SUBSTITUTED into it rather than appended at the end (see ConverterService's own comment on this) - so "Cd#0"/
      "Cd#1" resolve to "InstrForCdtrAgt#0.Cd"/"InstrForCdtrAgt#1.Cd", two distinct containers, not
      "InstrForCdtrAgt.Cd#0"/"InstrForCdtrAgt.Cd#1" (invalid - two Cd children under one container). A single
      occurrence (the overwhelming majority of real messages) resolves to "#0", byte-identical to before this fix.
    sub_elements:
      Cd:
        rule: "regex:^(CHQB|HOLD|PHOB|TELB)$"
        optional: true
        all_matches: true
    sub_element_targets:
      Cd: "CdtTrfTxInf.InstrForCdtrAgt#0.Cd"
    fallback_if_unparseable: raise_error
  notes: >-
    23E can appear as MULTIPLE separate MT lines (newline-joined into one raw value) - DecompositionService's regex
    matching runs under Pattern.MULTILINE, so "^...$" naturally checks each line independently. If ANY line is
    exactly one of CHQB/HOLD/PHOB/TELB with no trailing "/narrative", that line's code is written verbatim to its
    own InstrForCdtrAgt occurrence's Cd (other lines, if any, are each independently handled by their own matching
    entry among this document's other 23E entries - not mutually exclusive; TWO Cd-eligible lines produce TWO
    InstrForCdtrAgt occurrences, see the v2.27 note above). A line that is one of these four WITH trailing
    narrative, or any other codeword, is simply not matched by this entry's regex - not an error, falls through to
    the InstrInf entry below.
  edge_cases:
  - condition: "Field absent"
    handling: "not an error - InstrForCdtrAgt is optional"
  - condition: "Code is not one of CHQB/HOLD/PHOB/TELB, or carries trailing narrative"
    handling: "not an error here - see the InstrInf entry below, which handles this case instead"

- source_field: "23E"
  source_name: "Instruction Code - non-enumerated codes and any code with trailing narrative"
  target_path: "CdtTrfTxInf.InstrForCdtrAgt.InstrInf"
  mandatory: false
  transformation: decompose_party
  decomposition:
    pattern_description: >-
      v2.7 GAP FIX: paired with the Cd entry above; the two are mutually exclusive by design so a single 23E value
      never populates both Cd and InstrInf redundantly. SWIFT's 23E codeset also includes PHOI, PHON, REPA, RTGS,
      TELE, and TELI (per the official Swift MT103 field 23E code list), none of which are valid values of this XSD's
      Instruction3Code enum ({CHQB, HOLD, PHOB, TELB} only) - writing them into Cd would fail XSD enumeration
      validation. InstrInf is Max140Text (free text, no enum restriction), so this entry is the correct target for
      any codeword outside that four-value set, and for any of the four WITH trailing narrative (e.g.
      "TELI/3226553478", matching the source guide's own second worked example).
      v2.22 REDESIGN (2026-09-07, from live test case TC96): this entry was llm_assisted through v2.21, gated only by
      a prose "evaluate per line" instruction (no gate_pattern was possible here, since its condition is "none of
      the others matched," not a fixed presence check) - it worked for TC43/44's 2-code combinations but FAILED on
      TC96's 3-code combination (SDVA+INTC+PHOB), confirming the underlying problem was never really about gating:
      an LLM asked to follow a multi-line exclusion rule in prose does not reliably generalize to more codes, even
      though the rule itself ("is this line one of these 7 known codes, yes/no") is 100% deterministic. Converted to
      decompose_party with a negative-lookahead regex: a line is captured into InstrInf ONLY if it is NOT exactly
      one of CHQB/HOLD/PHOB/TELB/SDVA/INTC/CORT (i.e. not fully consumed by the Cd/SvcLvl/CtgyPurp entries above/
      below) - concat: true joins multiple such qualifying lines with a space. If EVERY line is one of those 7
      codes, no line matches the regex, matches is empty, and (since optional: true) this entry correctly produces
      NO value - deterministically, with zero LLM calls and therefore zero risk of a refusal regardless of how many
      codes are combined.
    sub_elements:
      InstrInf:
        rule: "regex:^(?!(?:CHQB|HOLD|PHOB|TELB|SDVA|INTC|CORT)$)(.+)$"
        optional: true
        concat: true
    sub_element_targets:
      InstrInf: "CdtTrfTxInf.InstrForCdtrAgt.InstrInf"
    fallback_if_unparseable: raise_error
  edge_cases:
  - condition: "Field absent"
    handling: "not an error - InstrForCdtrAgt is optional"
  - condition: "Value exceeds 140 characters"
    handling: "reject - do not truncate"
  - condition: "Every line of a multi-line 23E value is exactly one of CHQB/HOLD/PHOB/TELB/SDVA/INTC/CORT"
    handling: "not an error - this entry produces no value, not the raw multi-line string"

- source_field: "23E"
  source_name: "Instruction Code - INTC/CORT (category-purpose codes)"
  target_path: "CdtTrfTxInf.PmtTpInf.CtgyPurp.Cd"
  mandatory: false
  transformation: decompose_party
  decomposition:
    pattern_description: >-
      v2.9 SOURCED CORRECTION: this entry previously also routed SDVA here (see the superseded v2.7 note this
      replaces, kept in the known_limitations changelog for history) on the reasoning that SDVA/INTC/CORT are
      "established ISO 20022 external category-purpose codes" as a group - defensible in the abstract, but wrong per
      an actual authoritative field-level table. Directly verified against Annex 5.1.1 of the TARGET2 "General
      Functional Specification of the MX/ISO 20022 migration": "23E Instruction Code O -> PaymentTypeInformation/
      ServiceLevel/Code (SDVA) [and separately] PaymentTypeInformation/CategoryPurpose/Code (INTC, CORT)" - two
      DIFFERENT targets, not one. SDVA moved to its own entry below (SvcLvl/Cd). INTC and CORT (Intra-Company
      Payment, Trade Settlement Payment) stay here.
      v2.22 REDESIGN (2026-09-07, from live test case TC96): converted from llm_assisted to decompose_party - see the
      InstrInf entry above's v2.22 note for the full explanation of why (an LLM-prose per-line rule did not reliably
      generalize past 2 simultaneous codes). A line matching exactly INTC or CORT is now extracted by regex alone.
    sub_elements:
      Cd:
        rule: "regex:^(INTC|CORT)$"
        optional: true
    sub_element_targets:
      Cd: "CdtTrfTxInf.PmtTpInf.CtgyPurp.Cd"
    fallback_if_unparseable: raise_error
  notes: >-
    23E can appear as MULTIPLE separate MT lines (newline-joined into one raw value) - checked per-line via
    Pattern.MULTILINE. If ANY line is exactly INTC or CORT, that line's code is written verbatim to CtgyPurp/Cd
    (other lines, if any, are each independently handled by their own matching entry among this document's other
    23E entries).
  edge_cases:
  - condition: "Field absent, or code is not INTC/CORT"
    handling: "not an error here - see the SvcLvl and InstrInf entries for SDVA and everything else"

- source_field: "23E"
  source_name: "Instruction Code - SDVA (Same Day Value service level)"
  target_path: "CdtTrfTxInf.PmtTpInf.SvcLvl#0.Cd"
  mandatory: false
  transformation: decompose_party
  decomposition:
    pattern_description: >-
      v2.9 GAP FIX: split out of the CtgyPurp/Cd entry above - see its v2.9 note for the full correction history and
      citation. Confirmed directly against pacs.008.001.08.xsd: PaymentTypeInformation28's SvcLvl is
      maxOccurs="unbounded" (type ServiceLevel8Choice, Cd|Prtry choice) - repeatable, like ChrgsInf/RgltryRptg
      elsewhere in this document, hence the "#0" indexed-target convention already established for those.
      RESIDUAL GAP: the TARGET2 source's own worked-example evidence for this specific path is thin (its table
      states the rule but this document has not independently confirmed it against a second real worked SDVA
      example) - treat as sourced but not doubly-verified, consistent with this document's existing "Yes"/"No"
      SWIFT-verified distinction elsewhere.
      v2.22 REDESIGN (2026-09-07, from live test cases TC43/44/96): converted from llm_assisted to decompose_party -
      see the InstrInf entry above's v2.22 note for the full explanation. This entry's own v2.21 gate_pattern fix
      (from TC43/44) worked for 2-code combinations but the underlying llm_assisted mechanism still failed on TC96's
      3-code case - a line matching exactly SDVA is now extracted by regex alone, zero LLM involvement, zero risk of
      a refusal regardless of how many codes are combined. NOT ADDRESSED here: TC44's second finding, that SWIFT
      rule combinations forbidding certain 23E code pairings (the test's own analysis named "D67", e.g. SDVA+HOLD)
      are not validated - not implemented in this version because this document has not independently verified that
      specific rule citation against a fetched SWIFT source; flagged in known_limitations rather than guessed at.
    sub_elements:
      Cd:
        rule: "regex:^SDVA$"
        optional: true
    sub_element_targets:
      Cd: "CdtTrfTxInf.PmtTpInf.SvcLvl#0.Cd"
    fallback_if_unparseable: raise_error
  notes: >-
    23E can appear as MULTIPLE separate MT lines (newline-joined into one raw value) - checked per-line via
    Pattern.MULTILINE. If ANY line is exactly SDVA, SDVA is written verbatim to SvcLvl#0/Cd (other lines, if any,
    are each independently handled by their own matching entry among this document's other 23E entries - e.g. an
    INTC line on a different row of the same raw value also independently populates CtgyPurp/Cd).
  edge_cases:
  - condition: "Field absent, or code is not SDVA"
    handling: "not an error here - see the CtgyPurp and InstrInf entries for INTC/CORT and everything else"

- source_field: "77B"
  source_name: "Regulatory Reporting - reporting-side indicator (ORDERRES=debtor / BENEFRES=creditor)"
  target_path: "CdtTrfTxInf.RgltryRptg#0.DbtCdtRptgInd"
  mandatory: false
  transformation: llm_assisted
  gate_pattern: "/ORDERRES/|/BENEFRES/"
  notes: >-
    v2.7 GAP FIX: 77B was previously excluded ("Excluded from field_mappings; candidate for a follow-up once
    forward-direction samples exist" per the prior known_limitations entry, now superseded). Reopened after directly
    reading the same Bank of America MT103-to-pacs.008 formatting guide, which gives a genuine forward-direction
    worked example: ":77B:/BENEFRES/CA" -> a populated RgltryRptg element - stronger evidence than this document
    previously had (which was Creditor-side-only and reverse-inferred from pacs.008 samples in a different source).
    Confirmed directly against pacs.008.001.08.xsd: RgltryRptg is type RegulatoryReporting3 =
    {DbtCdtRptgInd (enum: CRED/DEBT/BOTH), Authrty, Dtls[] (Tp/Dt/Ctry/Cd/Amt/Inf[])} - NOT the flat
    <RgltryRptg><Inf>...</Inf></RgltryRptg> shape the source guide's own illustrative XML implies (that rendering
    does not match this document's supplied XSD and is not followed here). /ORDERRES/ and /BENEFRES/ are the two
    standard 77B codewords for "regulatory reporting concerns the Orderer/Debtor" and "...the Beneficiary/Creditor"
    respectively - the well-documented SWIFT pairing that DbtCdtRptgInd's DEBT/CRED enum values exist specifically
    to express. DECISION PROCEDURE: if a 77B line begins with /ORDERRES/, write DEBT; if it begins with /BENEFRES/,
    write CRED; any other or absent codeword produces no value for this entry (the Inf entry below still captures
    the raw text regardless). "#0" marks the first (and, in this version, only) RgltryRptg occurrence - RgltryRptg
    is maxOccurs=10 in the XSD but 77B's realistic multi-line repetition is not handled by this version; see
    known_limitations.
    v2.21 PREVENTIVE FIX (2026-09-04): added gate_pattern as a consistency measure, applying the same fix built
    for TC41-44 (13C/23E) to this entry and the Ctry entry below - not itself triggered by a failing batch-5 test
    case (TC47 passed), but the identical architectural risk exists here too (llm_assisted, unconditional LLM call
    regardless of whether /ORDERRES//BENEFRES/ is actually present) and costs nothing to close pre-emptively.
  edge_cases:
  - condition: "Field absent, or no line starts with /ORDERRES/ or /BENEFRES/"
    handling: "not an error - DbtCdtRptgInd is optional; see the Inf entry below, which still captures the raw text"

- source_field: "77B"
  source_name: "Regulatory Reporting - country-of-residence code (the 2 letters immediately following the codeword)"
  target_path: "CdtTrfTxInf.RgltryRptg#0.Dtls.Ctry"
  mandatory: false
  transformation: llm_assisted
  gate_pattern: "/ORDERRES/|/BENEFRES/"
  notes: >-
    RULE: this is the country-code half of field 77B's regulatory-reporting line - the DbtCdtRptgInd entry right
    above holds the reporting-direction (debit/credit) half of the SAME source line. Sub-parts of one value, not
    independently-derived fields that could conflict.
    v2.7 GAP FIX: paired with the DbtCdtRptgInd entry above - identical codeword detection. Matches the source
    guide's own worked example (":77B:/BENEFRES/CA" - "CA" is a 2-letter ISO country code), which fits Dtls/Ctry's
    CountryCode datatype ([A-Z]{2} pattern) exactly. DECISION PROCEDURE: if a 77B line begins with /ORDERRES/xx or
    /BENEFRES/xx where xx is exactly 2 uppercase letters, output xx; otherwise produce no value.
  edge_cases:
  - condition: "Field absent, or the codeword is present but not immediately followed by a 2-letter uppercase code"
    handling: "not an error - Ctry is optional; the Inf entry below still captures the full raw line regardless"

- source_field: "77B"
  source_name: "Regulatory Reporting - full raw line (verbatim fallback, no interpretation)"
  target_path: "CdtTrfTxInf.RgltryRptg#0.Dtls.Inf"
  mandatory: false
  transformation: direct_copy
  notes: >-
    v2.7 GAP FIX: unconditional companion to the two entries above - copies the COMPLETE raw 77B line (codeword,
    country code, and any trailing free text) verbatim into Dtls/Inf regardless of whether it matched the
    ORDERRES/BENEFRES pattern. This is deliberately the safe, no-guess fallback: if a real message uses a 77B
    convention this document doesn't recognize, the content is still preserved as free text rather than silently
    dropped, while DbtCdtRptgInd/Ctry simply stay unpopulated for that message. Runs unconditionally alongside the
    two entries above (not mutually exclusive with them) - Dtls/Inf and DbtCdtRptgInd/Ctry are sibling elements, so
    having both the structured indicator AND the preserved raw text is valid and intentional, not redundant.
  edge_cases:
  - condition: "Field absent"
    handling: "not an error - RgltryRptg is optional"
  - condition: "Value exceeds 35 characters (Dtls/Inf is Max35Text)"
    handling: "reject - do not truncate; a future version may need to split a long line across multiple Inf occurrences"

- source_field: "26T"
  source_name: "Transaction Type Code"
  target_path: "CdtTrfTxInf.Purp.Prtry"
  mandatory: false
  transformation: direct_copy
  max_length: 35
  notes: >-
    v2.21 GAP FIX (2026-09-04, from live test case TC45): 26T previously had NO field_mappings entry at all - see
    known_limitations for that history. v2.21 stopped the resulting hard-rejection (unmapped_fields_policy=error)
    with skip_with_warning, but deliberately still did NOT map the value, citing the Bank of America guide's "is not
    processed by Bank of America" as evidence against it.
    v2.26 GAP FIX (2026-09-07, from re-review of TC45): re-examined that decision after re-reading field 26T's own
    DEFINITION directly in the real SWIFT MT103 MRG (fetched and read this round, section 5 "Field 26T: Transaction
    Type Code"), verbatim: "This field identifies the nature of, purpose of, and/or reason for the individual
    transaction, for example, salaries, pensions, dividends... Codes from the EUROSTAT list 'Code List for Balance
    of Payments Collection Systems' may be used in this field." This is definitionally ISO 20022's Purpose concept
    (why the payment is being made), not CategoryPurpose (the broader payment-type classification already used for
    23E's INTC/CORT elsewhere in this document) - "not processed by Bank of America" was one bank's own
    implementation choice, not a statement that the field is unmappable or that Purp is the wrong target; it should
    not have outweighed a real, structurally sound target this document had already confirmed against the XSD.
    TARGET CORRECTED from Purp/Cd to Purp/Prtry: 26T's codes are drawn from the EUROSTAT balance-of-payments list,
    NOT ISO 20022's own ExternalPurpose1Code external list that Purp/Cd's type requires - writing a EUROSTAT code
    (e.g. "K90") into Cd would misrepresent it as an ISO-recognized code with no verified MT-code-to-ISO-code
    mapping table to justify it, the exact same reasoning already applied to 50F's IdCode (routed to Othr/SchmeNm/
    Prtry, not Othr/SchmeNm/Cd, for an identical "not drawn from the enumerated external list" reason - see that
    entry's own v2.18 note). Prtry is Max35Text (confirmed against Purpose2Choice in the XSD), well within 26T's own
    3!c format - a direct, verbatim, no-guessing copy, consistent with this document's stated preference for exact
    operations over interpretation wherever a single correct answer exists.
  edge_cases:
  - condition: "Field absent"
    handling: "not an error - Purp is optional"
  - condition: "Value exceeds 35 characters"
    handling: "reject - do not truncate (structurally impossible given 26T's own 3!c format, but enforced defensively)"

known_limitations:
- "Full versioned changelog (v1.0 through v2.29, ~500 lines) moved to CHANGELOG_MT103_TO_PACS008.md alongside
  this file on 2026-09-08 (v2.29) - this field is parsed but never read at runtime (MappingDocument.
  getKnownLimitations() has zero callers in the codebase), so history now lives in a plain doc instead of being
  re-parsed by the app on every request. See that file for the complete, dated, cited history of every fix in
  this document."
unmapped_fields_policy: error

default_values: {}

target_defaults:
  CdtTrfTxInf.PmtId.EndToEndId: NOTPROVIDED

business_application_header:
  enabled: true
  from_target_path: "CdtTrfTxInf.InstgAgt.FinInstnId.BICFI"
  to_target_path: "CdtTrfTxInf.InstdAgt.FinInstnId.BICFI"
  biz_msg_idr_target_path: "GrpHdr.MsgId"
  cre_dt_target_path: "GrpHdr.CreDtTm"
  biz_svc: "swift.cbprplus.02"
  # v2.33 ADDITION (2026-09-10, user request): produces a head.001 AppHdr alongside the
  # Document, resolving the open question this document's own known_limitations previously left
  # undecided ("MxRenderer only emits <Document> - no head.001 - write down which case you're in").
  # From/To reuse InstgAgt/InstdAgt (the CURRENT message hop's Sender/Receiver BIC - see those
  # entries' own v2.3 notes) rather than DbtrAgt/CdtrAgt, since AppHdr's Fr/To describe the two
  # parties EXCHANGING THIS MESSAGE, not the ultimate debtor/creditor banks - the same distinction
  # already established for InstgAgt/InstdAgt elsewhere in this document. BizMsgIdr reuses
  # GrpHdr/MsgId (itself sourced from field 20) rather than inventing a second identifier.
  # CreDt reuses the SAME GrpHdr/CreDtTm timestamp the Document itself carries, so the header and
  # body never disagree on when the message was created. Returned as a SEPARATE field on the
  # conversion result, not merged into the Document XML - see BusinessApplicationHeaderConfig's
  # own Javadoc for why: ISO 20022 does not define a single combining root for AppHdr+Document
  # (confirmed: real integrations agree only that "AppHdr and Document are sibling elements,
  # AppHdr first" - the actual parent wrapper is implementation/network-specific), and nesting
  # Document inside an invented wrapper would break this engine's existing real-XSD structural
  # validation, which validates the Document XML as its own standalone root.
  # v2.34 CORRECTION (2026-09-10, from a real worked CBPR+ example the user supplied): the
  # namespace was wrongly head.001.001.02 (real CBPR+ output uses head.001.001.01) and AppHdr was
  # rendered bare (real output wraps it in <Envelope xmlns="urn:swift:xsd:envelope">) - both fixed
  # in BusinessApplicationHeaderRenderer, see its own v2.34 note for the full correction and why
  # the supplied example is treated as authoritative (BizSvc=swift.cbprplus.02 matches the same
  # JPMorgan worked example already cited elsewhere in this document's v2.9 history). biz_svc
  # added here for the same reason - present in the real example, previously omitted.
validation_rules:
- rule_id: VR001
  description: "If Instructed Amount is present and its currency differs from the Interbank Settlement Amount currency, Exchange
    Rate must be present."
  applies_to: ["CdtTrfTxInf.InstdAmt", "CdtTrfTxInf.IntrBkSttlmAmt", "CdtTrfTxInf.XchgRate"]
  severity: error
  rule_type: conditional_currency_mismatch_requires
  params:
    trigger_field: CdtTrfTxInf.InstdAmt
    compare_field: CdtTrfTxInf.IntrBkSttlmAmt
    required_field: CdtTrfTxInf.XchgRate
  logic: >
    UHB p.214, verbatim: "if the Instructed Amount is present and the
    currency is different from the currency in Interbank Settlement
    Amount, then Exchange Rate must be present." v2.2 CHANGELOG: now
    machine-checked via rule_type - see ValidatorService.evalCurrencyMismatchRequires().

- rule_id: VR002
  description: "When Charge Bearer = DEBT, only one pre-paid Charges Information occurrence is valid; deducted charges are
    invalid."
  applies_to: ["CdtTrfTxInf.ChrgBr", "CdtTrfTxInf.ChrgsInf"]
  severity: error
  logic: >
    UHB p.216. NOT machine-checked, deliberately: ChrgsInf's own
    field_mappings entries (71F/71G) use transformation=skip_with_warning
    (see those entries' v1.19 notes) - this engine cannot currently
    populate ChrgsInf at all, structured or otherwise, so there is no
    "pre-paid vs deducted occurrence" state in the converted output to
    check a rule about. Recorded for human/LLM reviewer judgement until
    ChrgsInf gains real support.

- rule_id: VR003
  description: "Reimbursement Agent elements are only relevant/expected when Settlement Method = COVE."
  applies_to: ["GrpHdr.SttlmInf.SttlmMtd", "GrpHdr.SttlmInf.InstgRmbrsmntAgt", "GrpHdr.SttlmInf.InstdRmbrsmntAgt", "GrpHdr.SttlmInf.ThrdRmbrsmntAgt"]
  severity: warning
  rule_type: presence_requires_value
  params:
    trigger_fields: ["GrpHdr.SttlmInf.InstgRmbrsmntAgt", "GrpHdr.SttlmInf.InstdRmbrsmntAgt", "GrpHdr.SttlmInf.ThrdRmbrsmntAgt"]
    gate_field: GrpHdr.SttlmInf.SttlmMtd
    gate_value: COVE
  logic: >
    UHB pp.199-207. Not a stated hard-rejection rule outside COVE, so
    severity=warning. v2.2 CHANGELOG: now machine-checked via rule_type -
    see ValidatorService.evalPresenceRequiresValue().

- rule_id: VR004
  description: "If all three Previous Instructing Agents are populated, Intermediary Agent should not also be used in the
    same message."
  applies_to: ["CdtTrfTxInf.PrvsInstgAgt1", "CdtTrfTxInf.PrvsInstgAgt2", "CdtTrfTxInf.PrvsInstgAgt3", "CdtTrfTxInf.IntrmyAgt1"]
  severity: warning
  rule_type: mutual_exclusion
  params:
    requires_all: ["CdtTrfTxInf.PrvsInstgAgt1", "CdtTrfTxInf.PrvsInstgAgt2", "CdtTrfTxInf.PrvsInstgAgt3"]
    excludes: CdtTrfTxInf.IntrmyAgt1
  logic: >
    UHB p.225: implies a direct-and-cover message pair would be needed
    instead. v2.2 CHANGELOG: now machine-checked via rule_type - see
    ValidatorService.evalMutualExclusion().

- rule_id: VR005
  description: 'MT103 mandatory source alternatives must be present: exactly one Ordering Customer option (50A/50F/50K), exactly
    one Beneficiary Customer option (59/59A/59F), plus 20, 23B, 32A and 71A.'
  applies_to:
  - '20'
  - 23B
  - 32A
  - 50A
  - 50F
  - 50K
  - '59'
  - 59A
  - 59F
  - 71A
  severity: error
  rule_type: source_alternative_group_required
  params:
    alternative_groups:
      - ['50A', '50F', '50K']
      - ['59', '59A', '59F']
    required_source_fields: ['20', '23B', '32A', '71A']
  logic: >
    SWIFT MT103 field presence rule must be enforced as an
    alternative-group validation; do not rely on empty XML placeholders.
    v2.2 CHANGELOG: now machine-checked via rule_type - checked against
    the SOURCE message (parsedFields), not the converted tree - see
    ValidatorService.evalSourceAlternativeGroup().
    v2.8 CHANGELOG: this rule was only ever evaluated AFTER a full conversion attempt (inside ValidatorService.validate(),
    called from ConversionOrchestrator's retry loop), so a message failing VR005 was indistinguishable from a retryable
    CONVERSION_ERROR - the orchestrator burned up to maxConverterRetries+2 pointless converter re-runs (retrying a source
    message that can never change) before finally throwing ValidationFailedException. VR005's own params are pure
    source-side data (parsedFields only, no dependency on the converted tree), so there was no actual reason to wait for a
    conversion attempt at all. Added ValidatorService.checkMandatorySourceFields() (runs only source_alternative_group_required
    rules) and wired it into ConversionOrchestrator.convert() immediately after parsing, before the retry loop - a message
    missing a mandatory field now throws MandatorySourceFieldMissingException immediately, zero wasted converter attempts.
    The original post-conversion check in ValidatorService.validate() was deliberately left in place too (defense in depth,
    same reasoning as VR006's dual-mechanism note) in case a future caller invokes ConverterService without going through
    this orchestrator.
- rule_id: VR006
  description: Do not emit empty Dbtr or Cdtr elements as a fallback. If the source mandatory customer option is absent
    or cannot be parsed, reject conversion.
  applies_to:
  - CdtTrfTxInf.Dbtr
  - CdtTrfTxInf.Cdtr
  severity: error
  logic: >
    Business-mandatory customer data must be present; XSD structural
    validity alone is insufficient. NOT a separate machine-checked
    rule_type - already naturally enforced by two other mechanisms
    working together: (1) target_defaults has no empty Dbtr/Cdtr
    placeholder (removed for exactly this reason, see that section's
    v1.12/v2.1 history), so Dbtr/Cdtr are only ever populated by a REAL
    field_mappings entry firing; (2) the schema completeness check
    (XsdOrderingIndex.findMissingMandatory, v2.2) then fails the
    conversion outright if Dbtr/Cdtr end up missing entirely. Adding a
    third, redundant rule_type here would just duplicate that enforcement.
- rule_id: VR007
  description: 'Currency-aware amount precision: do not round or truncate amounts; validate fractional digits against the
    currency rules used by the target profile.'
  applies_to:
  - CdtTrfTxInf.IntrBkSttlmAmt
  - CdtTrfTxInf.InstdAmt
  severity: error
  rule_type: currency_precision_check
  params:
    amount_fields: ['CdtTrfTxInf.IntrBkSttlmAmt', 'CdtTrfTxInf.InstdAmt']
  logic: >
    ISO amount datatypes permit more fractional digits than many
    currencies; the converter must enforce currency-specific minor-unit
    precision (standard ISO 4217 exceptions - JPY/KRW/etc.=0 decimals,
    BHD/KWD/etc.=3 decimals, default 2). ChrgsInf removed from applies_to
    (was listed originally) - it's never populated by this document's
    field_mappings (see VR002's note), so there is nothing for this rule
    to check there. v2.2 CHANGELOG: now machine-checked via rule_type -
    see ValidatorService.evalCurrencyPrecision(). Only flags TOO MANY
    fractional digits, not fewer-than-standard (a round amount like "100"
    for USD is legitimate).
- rule_id: VR008
  description: 'SR2026 CBPR+ readiness warning (non-blocking): a party/agent address carries free-text AdrLine content
    with no structured Town Name and Country Code. This will become a hard rejection once SWIFT''s deferred SR2026
    structured-address mandate actually takes effect - see this rule''s own logic for the current, unconfirmed timeline.'
  applies_to:
  - CdtTrfTxInf.Dbtr.PstlAdr
  - CdtTrfTxInf.Cdtr.PstlAdr
  - CdtTrfTxInf.DbtrAgt.FinInstnId.PstlAdr
  - CdtTrfTxInf.CdtrAgt.FinInstnId.PstlAdr
  - CdtTrfTxInf.IntrmyAgt1.FinInstnId.PstlAdr
  severity: warning
  rule_type: structured_address_required
  params:
    address_fields:
      - CdtTrfTxInf.Dbtr.PstlAdr
      - CdtTrfTxInf.Cdtr.PstlAdr
      - CdtTrfTxInf.DbtrAgt.FinInstnId.PstlAdr
      - CdtTrfTxInf.CdtrAgt.FinInstnId.PstlAdr
      - CdtTrfTxInf.IntrmyAgt1.FinInstnId.PstlAdr
  logic: >
    v2.31 CHANGELOG (2026-09-08): re-scoped from a date-gated HARD ERROR to an always-on, non-blocking WARNING,
    directly in response to a real, verified development: SWIFT announced on 27 August 2026 (confirmed against
    swift.com's own news post "Swift accepts community request to extend structured address migration for ISO
    20022 payment messages", corroborated independently by RedCompass Labs and Fintech Garden) a "controlled
    extension" deferring ALL SR2026 payments-related changes - not just this address requirement. SR2025 behavior
    continues to apply; there is no confirmed new enforcement date as of this writing, only a promise that SWIFT
    will publish a revised timeline "by December [2026] at the latest" after industry consultation. The
    previous v2.4 fix (effective_date: "2026-11-14", removed here) would have started HARD-REJECTING valid
    SR2025 traffic on that date regardless of SWIFT's own deferral - now known to be wrong, not just
    theoretically risky. Removing the date gate entirely (rather than updating it to a new guessed date) is
    deliberate: no real replacement date exists yet to gate on, and guessing one would repeat the exact mistake
    the deferral was announced to prevent. This rule now fires unconditionally as a non-blocking warning so the
    user has current visibility into which messages would be affected whenever enforcement actually begins,
    without rejecting anything today. Scope also widened to cover IntrmyAgt1.FinInstnId.PstlAdr (field 56D
    populates this and was previously missing from this rule entirely - an unrelated pre-existing gap found
    while re-verifying this rule's scope, not something introduced by the SR2026 news itself). SEPARATELY
    RESEARCHED, NOT IMPLEMENTED (no rule added - see known_limitations/CHANGELOG for full detail): field 50K/59
    (no letter)/5xD-specific hard-stop translation error codes reported by a third-party consultancy (unverified
    against SWIFT's own CBPR+ Mapping Library text, which sits behind an authenticated MySwift login) are the
    SAME underlying condition this rule already checks (address content routed to free-text AdrLine with no
    structured Town/Country) - not a separate mechanism, so no new rule_type was built for them. Three specific
    change-request numbers a user-supplied summary cited (CR3013/CR3020/CR3102, covering InstdAmt-mandatory,
    GPI service-level enforcement, and message-ID consistency) returned ZERO corroboration from any source
    searched - not implemented, per this document's standing "don't guess, don't implement an unverifiable
    citation" discipline.

- rule_id: VR009
  description: "Field 71G (Receiver's Charges) amount must not equal zero, per SWIFT Network Validated Rule D57."
  applies_to:
  - CdtTrfTxInf.ChrgsInf#1.Amt
  severity: error
  rule_type: amount_not_zero
  params:
    amount_field: "CdtTrfTxInf.ChrgsInf#1.Amt"
  logic: >-
    v2.17 ADDITION (2026-09-04, from live test case TC10): the real SWIFT MT103 Message Reference Guide (already fetched
    and read directly, section 21 "Field 71G: Receiver's Charges", Network Validated Rules) states verbatim: "Amount
    must not equal zero (Error code(s): D57)." Previously this document had no check for this at all - a message with
    ":71G:GBP0,00" was silently accepted and translated to "<ChrgsInf><Amt Ccy=\"GBP\">0.00</Amt>...</ChrgsInf>",
    propagating an invalid value downstream with zero warning. Machine-checked post-conversion (same pattern as
    VR001/VR007), not inside 71G's own decimal_comma_to_dot transformation - that transformation's job is FORMAT
    conversion (comma-to-dot, trailing-comma handling), not business-rule value validation; "0,00" is a syntactically
    valid decimal, just a semantically forbidden one. See ValidatorService.evalAmountNotZero().
    NOT extended to 71F: the real spec's Network Validated Rules for field 71F do not state an equivalent D57-style
    zero-amount prohibition - only 71G's own field spec does. Do not assume symmetry without a citation.

- rule_id: VR010
  description: "Field 50a numbers 4 (Date of Birth) and 5 (Place of Birth) must either both be present or both be absent."
  applies_to:
  - CdtTrfTxInf.Dbtr.Id.PrvtId.DtAndPlcOfBirth.BirthDt
  - CdtTrfTxInf.Dbtr.Id.PrvtId.DtAndPlcOfBirth.CtryOfBirth
  severity: error
  rule_type: target_presence_requires_target_presence
  params:
    target_path_a: "CdtTrfTxInf.Dbtr.Id.PrvtId.DtAndPlcOfBirth.BirthDt"
    target_path_b: "CdtTrfTxInf.Dbtr.Id.PrvtId.DtAndPlcOfBirth.CtryOfBirth"
  logic: >-
    v2.18 ADDITION (2026-09-04, from live test case TC16): the real SWIFT MT103 Message Reference Guide (section 9,
    Field 50a NETWORK VALIDATED RULES) states verbatim: "Number 4 must not be used without number 5 and vice versa."
    pacs.008.001.08.xsd's own DateAndPlaceOfBirth1 independently confirms this structurally - BirthDt and
    CityOfBirth/CtryOfBirth are ALL mandatory children (no minOccurs=0) whenever DtAndPlcOfBirth is used at all, so a
    50a with "4/" but no "5/" (or vice versa) would otherwise silently produce a partially-populated, XSD-invalid
    DtAndPlcOfBirth rather than a clear rejection. Checked against BirthDt vs CtryOfBirth specifically (not
    CityOfBirth) purely as the representative pair - both 5/'s own sub-elements (CityOfBirth, CtryOfBirth) are
    always written together by the SAME decompose_party pass (see 50F's own sub_elements), so checking either one
    against BirthDt is equivalent; this is not a partial check.

- rule_id: VR011
  description: "If field 23B (Bank Operation Code) is SPRI, field 53a must not be used with option D."
  applies_to:
  - "23B"
  - "53D"
  severity: error
  rule_type: value_forbids_presence
  params:
    trigger_field: "23B"
    trigger_values: ["SPRI"]
    forbidden_field: "53D"
  logic: >-
    v2.19 ADDITION (2026-09-04, from live test case TC28): the real SWIFT MT103 Message Reference Guide (section
    "MT 103 Network Validated Rules", rule C4) states verbatim: "If field 23B contains one of the codes SPRI, SSTD
    or SPAY, field 53a must not be used with option D (Error code(s): E03)." Only the SPRI branch is checked here
    (matching TC28's own case) - SSTD/SPAY were not part of this test batch and are left for a future addition
    rather than assumed identical without re-confirming trigger_values against the source. Checked purely against
    parsedFields (source-side, like VR005) since this is a rule about which MT SYNTAX combinations are legal, not
    about the converted output. Previously this combination was rejected only incidentally, because field 53D
    itself was entirely unmapped (see the new 53D entry above) - meaning the message failed for the WRONG reason
    (unmapped field) rather than the right one (an invalid SPRI/53D combination); now that 53D is mapped, this rule
    is the one that actually catches the violation.

- rule_id: VR012
  description: "If field 56a (Intermediary Institution) is present, field 57a must also be present."
  applies_to:
  - "56A"
  - "57A"
  - "57D"
  severity: error
  rule_type: source_presence_requires_source_presence
  params:
    trigger_field: "56A"
    required_any_of: ["57A", "57D"]
  logic: >-
    v2.19 ADDITION (2026-09-04, from live test case TC25): the real SWIFT MT103 Message Reference Guide (section "MT
    103 Network Validated Rules", rule C9) states verbatim: "If field 56a is present, field 57a must also be present
    (Error code(s): C81)." required_any_of covers both 57A and 57D (option D counts as "57a is present" at the
    source-field level, per the spec's own field-numbering convention of grouping options under one rule number).
    Checked purely against parsedFields, not the converted tree - CdtrAgt is ALWAYS populated regardless (it falls
    back to the Receiver BIC when 57A/57D are both absent), so a target-side presence check could never distinguish
    "57a was genuinely given" from "the fallback fired," making this a case where only VR005's source-side pattern
    (not VR001/VR010's target-side pattern) can express the rule correctly. Only trigger 56A -> requires 57a is
    implemented (matching TC25); 56C/56D are separately out of scope, not sourced.

- rule_id: VR013
  description: "If field 23B is SPRI, SSTD, or SPAY, the beneficiary account (subfield 1 of field 59a) is mandatory."
  applies_to:
  - "23B"
  - "CdtTrfTxInf.CdtrAcct"
  severity: error
  rule_type: value_requires_target_presence
  params:
    trigger_field: "23B"
    trigger_values: ["SPRI", "SSTD", "SPAY"]
    target_path: "CdtTrfTxInf.CdtrAcct"
  logic: >-
    v2.19 ADDITION (2026-09-04, from live test case TC30): the real SWIFT MT103 Message Reference Guide (section "MT
    103 Network Validated Rules", rule C12) states verbatim: "If field 23B contains one of the codes SPRI, SSTD or
    SPAY, subfield 1 (Account) in field 59a Beneficiary Customer is mandatory (Error code(s): E10)." Unlike VR011/
    VR012, this checks the CONVERTED TARGET (CdtTrfTxInf.CdtrAcct), not a source field - deliberately: this
    document's own 59/59A/59F entries only populate CdtrAcct when the source itself carries an account line at all
    (see those entries' own edge_cases), so "was CdtrAcct populated" is already an accurate proxy for "did field 59a
    carry subfield 1," with no fallback-masking risk equivalent to VR012's CdtrAgt situation above (there is no
    Receiver-account fallback the way there is a Receiver-BIC fallback for the agent). All three trigger codes
    (SPRI/SSTD/SPAY) are included, per the spec's own C12 wording listing all three together (unlike C4/VR011, where
    only SPRI was directly tested and the others were deliberately left unconfirmed).

- rule_id: VR014
  description: "If field 59F (Beneficiary Customer, option F) is present, the mandatory number-3 (Country) line must be present."
  applies_to:
  - "59F"
  - CdtTrfTxInf.Cdtr.PstlAdr.Ctry
  severity: error
  rule_type: source_presence_requires_target_presence
  params:
    source_trigger_field: "59F"
    target_path: "CdtTrfTxInf.Cdtr.PstlAdr.Ctry"
  logic: >-
    v2.20 ADDITION (2026-09-04, from live test case TC33): the real SWIFT MT103 field spec states verbatim, for
    option F's subfield 2 (Name and Address): "A line starting with number 3 must be present." Checked against the
    SOURCE field 59F's own presence (not a derived target like Cdtr/Nm), deliberately using the new ONE-DIRECTIONAL
    source_presence_requires_target_presence rule type rather than the existing bidirectional
    presence_requires_presence: bare field 59's own structured_address (libpostal) enrichment can ALSO legitimately
    populate this SAME Cdtr/PstlAdr/Ctry path through a completely different mechanism - a bidirectional check would
    incorrectly flag a valid bare-59-plus-successful-libpostal message as a violation, since 59F specifically wasn't
    what populated Ctry that time. This was checked directly (not assumed) after noticing bare-59's
    structured_address.targets already includes "country" (see that entry's own v2.16 note).
    Only the forward direction matters for this rule anyway - "59F present therefore Ctry required" is what C-rule
    C33-equivalent language actually says; "Ctry present therefore 59F required" was never a real constraint (Ctry
    can legitimately come from other sources).

- rule_id: VR015
  description: "Field 20 (Sender's Reference) must not start or end with '/' and must not contain '//' anywhere."
  applies_to:
  - "20"
  severity: error
  rule_type: source_format_forbidden_pattern
  params:
    source_field: "20"
    forbidden_pattern: "^/|/$|//"
  logic: >-
    v2.21 ADDITION (2026-09-04, from live test case TC48): SWIFT Network Validated Rule T26 applies to reference-type
    fields such as field 20 (Sender's Reference) - a value starting or ending with a slash, or containing two
    consecutive slashes anywhere, is invalid. No validation of this existed anywhere in this document previously;
    field 20 was only checked for mandatory-presence and max_length (16/35 chars, see its two field_mappings
    entries), never its internal format - a value like "/20250904REF01" would have been silently copied through into
    both GrpHdr/MsgId and PmtId/InstrId without complaint. Deliberately checks the RAW source value (not the
    converted target), consistent with this being a SOURCE-message format defect, not a conversion-mapping defect -
    the value would be copied through unchanged either way, so checking either side catches it, but the source is the
    more honest place to flag a malformed INPUT.

- rule_id: VR016
  description: "Field 32A's currency (IntrBkSttlmAmt/@Ccy) must not be a precious-metal ISO 4217 code (XAU, XAG, XPD, XPT)."
  applies_to:
  - "32A"
  - CdtTrfTxInf.IntrBkSttlmAmt.@Ccy
  severity: error
  rule_type: target_value_forbidden_set
  params:
    target_path: "CdtTrfTxInf.IntrBkSttlmAmt.@Ccy"
    forbidden_values:
    - XAU
    - XAG
    - XPD
    - XPT
  logic: >-
    v2.21 ADDITION (2026-09-04, from live test case TC49): XAU/XAG/XPD/XPT (gold/silver/palladium/platinum) are
    real, valid ISO 4217 currency codes, but they denote precious-metal trading units, not settleable fund currencies
    - an MT103/pacs.008 interbank funds transfer settling in one of these codes is not a legitimate real-world case
    (precious-metal-related SWIFT traffic uses a different message family entirely). This document's existing
    allowed_pattern on the 32A currency entry ("^[A-Z]{3}$") only enforces ISO 4217's lexical SHAPE (three uppercase
    letters), not this semantic exclusion - a message with currency=XAU previously passed through uncaught.
    SOURCING CAVEAT, stated plainly: this document's fetched primary sources for this session (the SWIFT MT103
    Standards MRG, the Bank of America formatting guide, the TARGET2 Annex 5.1.x tables, the JPMorgan migration
    guide) were re-checked and none of them enumerate a specific MT103 rule ID for this exclusion by name (the batch-5
    test's own analysis referred to it as "rule C08", which this document has NOT independently verified against any
    of those sources) - so this rule is implemented on the well-established, widely-documented real-world convention
    that precious-metal ISO 4217 codes are excluded from ordinary funds-settlement fields, not on a directly-cited
    SWIFT rule number. Flagged here rather than silently assumed, consistent with this document's existing "Yes"/"No"
    SWIFT-verified distinction elsewhere (e.g. the TILTIME/FROTIME/REJTIME 13C entries).

- rule_id: VR017
  description: "Rule C14: if field 71A is OUR, field 71F is not allowed (error code E13)."
  applies_to:
  - "71A"
  - "71F"
  severity: error
  rule_type: value_forbids_presence
  params:
    trigger_field: "71A"
    trigger_values:
    - OUR
    forbidden_field: "71F"
  logic: >-
    v2.22 ADDITION (2026-09-07, from live test cases TC09/TC89): directly verified against the real SWIFT "Standards
    MT November 2021" MT103 Message Reference Guide (re-fetched and read directly this round, Network Validated
    Rules section, rule C14, verbatim): "If field 71A contains OUR, then field 71F is not allowed and field 71G is
    optional (Error code(s): E13)." / "If field 71A contains SHA, then field(s) 71F is(are) optional and field 71G
    is not allowed (Error code(s): D50)." / "If field 71A contains BEN, then at least one occurrence of field 71F is
    mandatory and field 71G is not allowed (Error code(s): E15)." This one verified citation covers FOUR distinct
    sub-rules, split into VR017-VR020 below (one rule_type per direction, consistent with this document's existing
    "don't conflate directions behind one flag" discipline) rather than one combined rule: OUR forbids 71F (this
    entry), SHA forbids 71G (VR018), BEN forbids 71G (VR019), BEN requires >=1 71F (VR020). Previously, NONE of C14
    was validated at all - TC09 predicted the BEN-requires-71F gap; this sourcing pass found the OUR and SHA
    directions were equally unvalidated and equally real.

- rule_id: VR018
  description: "Rule C14: if field 71A is SHA, field 71G is not allowed (error code D50)."
  applies_to:
  - "71A"
  - "71G"
  severity: error
  rule_type: value_forbids_presence
  params:
    trigger_field: "71A"
    trigger_values:
    - SHA
    forbidden_field: "71G"
  logic: >-
    v2.22 ADDITION (2026-09-07): see VR017's logic for the full C14 citation (this is the "SHA" row, error code D50).

- rule_id: VR019
  description: "Rule C14: if field 71A is BEN, field 71G is not allowed (error code E15)."
  applies_to:
  - "71A"
  - "71G"
  severity: error
  rule_type: value_forbids_presence
  params:
    trigger_field: "71A"
    trigger_values:
    - BEN
    forbidden_field: "71G"
  logic: >-
    v2.22 ADDITION (2026-09-07, from live test case TC89): see VR017's logic for the full C14 citation (this is the
    "BEN" row's 71G-forbidden half, error code E15). TC89's own message (71A=BEN, 71F AND 71G both present) violates
    this specific sub-rule - both TC89's own prediction and my earlier draft of "just add BEN-requires-71F" would
    have missed this second, independently-violated half of the same C14 row.

- rule_id: VR020
  description: "Rule C14: if field 71A is BEN, at least one occurrence of field 71F is mandatory (error code E15)."
  applies_to:
  - "71A"
  - "71F"
  severity: error
  rule_type: value_requires_source_presence
  params:
    trigger_field: "71A"
    trigger_values:
    - BEN
    required_field: "71F"
  logic: >-
    v2.22 ADDITION (2026-09-07, from live test case TC09): see VR017's logic for the full C14 citation (this is the
    "BEN" row's 71F-mandatory half, error code E15). New rule_type value_requires_source_presence (ValidatorService.
    evalValueRequiresSourcePresence) - the source-side counterpart to the existing value_requires_target_presence
    (VR013/C12), checking parsedFields directly rather than the converted tree, since ChrgsInf/71F has no dedicated,
    reliably-checkable target presence marker of its own (71F's own field_mappings entries are gated on repeat_lines/
    conditional mechanisms, not a single simple target_path) - checking the SOURCE field's own presence is the more
    direct, unambiguous signal here.

- rule_id: VR021
  description: "Rule C10: if field 23B contains SPRI, field 56A must not be present (error code E16)."
  applies_to:
  - "23B"
  - "56A"
  severity: error
  rule_type: value_forbids_presence
  params:
    trigger_field: "23B"
    trigger_values:
    - SPRI
    forbidden_field: "56A"
  logic: >-
    v2.27 ADDITION (2026-09-08, from live test case TC107): directly verified against the real SWIFT MT103 MRG
    (Network Validated Rules section), rule C10, verbatim: "If field 23B contains the code SPRI, field 56a must not
    be present (Error code(s): E16). If field 23B contains one of the codes SSTD or SPAY, field 56a may be used
    with either option A or option C. If option C is used, it must contain a clearing code (Error code(s): E17)."
    Split across VR021-024 below (one rule per direction/option-letter, consistent with this document's existing
    "don't conflate directions behind one flag" discipline) rather than one combined rule: SPRI forbids 56A (this
    entry), SPRI forbids 56C (VR022), SPRI forbids 56D (VR023), SSTD/SPAY forbids 56D specifically (VR024). NOT
    IMPLEMENTED: the "if option C is used under SSTD/SPAY, it must contain a clearing code" content sub-rule - no
    live test exercises this specific sub-case (TC108 tests option D forbidden under SSTD, not option-C-without-
    clearing-code), and it would need a new content-shape check on 56C's own value, not just presence/absence;
    deferred rather than guessed at.

- rule_id: VR022
  description: "Rule C10: if field 23B contains SPRI, field 56C must not be present (error code E16)."
  applies_to:
  - "23B"
  - "56C"
  severity: error
  rule_type: value_forbids_presence
  params:
    trigger_field: "23B"
    trigger_values:
    - SPRI
    forbidden_field: "56C"
  logic: "v2.27 ADDITION (2026-09-08): see VR021's logic for the full C10 citation."

- rule_id: VR023
  description: "Rule C10: if field 23B contains SPRI, field 56D must not be present (error code E16)."
  applies_to:
  - "23B"
  - "56D"
  severity: error
  rule_type: value_forbids_presence
  params:
    trigger_field: "23B"
    trigger_values:
    - SPRI
    forbidden_field: "56D"
  logic: "v2.27 ADDITION (2026-09-08): see VR021's logic for the full C10 citation."

- rule_id: VR024
  description: "Rule C10: if field 23B contains SSTD or SPAY, field 56D must not be present (option D forbidden; only A or C allowed, error code E17)."
  applies_to:
  - "23B"
  - "56D"
  severity: error
  rule_type: value_forbids_presence
  params:
    trigger_field: "23B"
    trigger_values:
    - SSTD
    - SPAY
    forbidden_field: "56D"
  logic: >-
    v2.27 ADDITION (2026-09-08, from live test case TC108): see VR021's logic for the full C10 citation - this is
    the SSTD/SPAY row's "option A or C only" restriction, expressed as "option D forbidden" (the only one of the
    three 56-option source fields this document maps that C10 excludes under SSTD/SPAY).

- rule_id: VR025
  description: "Rule C11: if field 23B contains SPRI, SSTD or SPAY, field 57B must not be present (only options A, C or D allowed, error code E09)."
  applies_to:
  - "23B"
  - "57B"
  severity: error
  rule_type: value_forbids_presence
  params:
    trigger_field: "23B"
    trigger_values:
    - SPRI
    - SSTD
    - SPAY
    forbidden_field: "57B"
  logic: >-
    v2.27 ADDITION (2026-09-08, from live test case TC109): directly verified against the real SWIFT MT103 MRG,
    rule C11, verbatim: "If field 23B contains one of the codes SPRI, SSTD or SPAY, field 57a may be used with
    option A, option C or option D. Subfield 1 (Party Identifier) in option D must be present (Error code(s): E09)."
    "Allowed only with options A, C or D" is expressed here as "option B forbidden" (the only one of the four
    57-option source fields this document maps that isn't in that allowed list). The second half of C11
    ("in option D, Party Identifier is mandatory under these service levels", TC110) is now implemented
    separately as VR026 below, via a new three-way rule_type - see its own logic field.

- rule_id: VR026
  description: "Rule C11 (second half): if field 23B contains SPRI, SSTD or SPAY, and field 57D is present, 57D's Party Identifier (subfield 1) is mandatory (error code E09)."
  applies_to:
  - "23B"
  - "57D"
  severity: error
  rule_type: value_and_source_presence_requires_target_presence
  params:
    trigger_field: "23B"
    trigger_values:
    - SPRI
    - SSTD
    - SPAY
    required_source_field: "57D"
    target_path: "CdtTrfTxInf.CdtrAgt.FinInstnId.Othr.Id"
  logic: >-
    v2.29 ADDITION (2026-09-08, from live test case TC110): implements the half of rule C11 left deferred in
    VR025 above - directly verified against the real SWIFT MT103 MRG, rule C11, verbatim: "...Subfield 1
    (Party Identifier) in option D must be present (Error code(s): E09)." This is a genuine three-way AND
    (23B's value is SPRI/SSTD/SPAY, AND 57D is present in the source message, AND 57D's own extracted Party
    Identifier is absent from the converted output) that none of the existing 25 rule_type shapes in this
    document could express - each existing shape gates on exactly one source-value condition or one
    source/target-presence pair, never both a value AND a presence together. New rule_type
    value_and_source_presence_requires_target_presence added (ValidatorService.
    evalValueAndSourcePresenceRequiresTargetPresence) rather than composing two existing rule_types, since
    neither alone can express that the requirement only activates when BOTH gates hold simultaneously.
    target_path is CdtTrfTxInf.CdtrAgt.FinInstnId.Othr.Id - the 57D field_mappings entry's own
    account_sub_element "Id", routed there per that entry's v2.1 changelog note (the generic identifier
    container, since no clearing-system table exists yet to route it to ClrSysMmbId instead). NOTE: this
    reuses the SAME "57D present but produced no Id" signal the field_mappings entry's own notes already
    describe - if a future fix changes where 57D's Party Identifier is routed, this rule's target_path must
    move with it.