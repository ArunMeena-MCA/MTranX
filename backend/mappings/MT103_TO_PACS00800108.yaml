  - condition: "REJTIME line present but the time portion is not valid HHMM[+/-]HHMM"
    handling: "reject - do not guess"

- source_field: "23E"
  source_name: "Instruction Code - Instruction3Code-enumerated values (CHQB/HOLD/PHOB/TELB, no trailing narrative)"
  target_path: "CdtTrfTxInf.InstrForCdtrAgt.Cd"
  mandatory: false
  transformation: llm_assisted
  gate_pattern: "^(CHQB|HOLD|PHOB|TELB)$"
  notes: >-
    v2.7 GAP FIX: 23E was previously excluded entirely ("NOT MAPPED... No field_mappings entry" per the prior
    known_limitations entry, now superseded). Reopened after directly reading the Bank of America MT103-to-pacs.008
    formatting guide (images.em.bankofamerica.com/GTS/ISO_20022/PACS008andMT103commercialpaymentsformattingguide.pdf),
    which gives a real worked example (:23E:CHQB -> <InstrForCdtrAgt><InstrInf>...) and shows 23E branches to one of
    three possible targets depending on the code: InstrForCdtrAgt, PmtTpInf/SvcLvl/Cd, or PmtTpInf/CtgyPurp/Cd.
    Rather than following that guide's own InstrInf-only rendering of the CHQB example, this entry was tightened
    against the actual supplied XSD: InstructionForCreditorAgent1 (pacs.008.001.08.xsd) has its OWN closed-enum Cd
    sub-element, Instruction3Code, restricted to exactly {CHQB, HOLD, PHOB, TELB} - the same four values shown in
    the source guide's own 23E code-narrative table. Since these four MT codewords are lexically identical to the
    four valid Cd enum values, writing the codeword directly into Cd (not InstrInf) is the more schema-precise
    translation. DECISION PROCEDURE: 23E can appear as MULTIPLE separate MT lines (newline-joined into one raw
    value) - evaluate EACH LINE independently, not the raw value as a single unit. If ANY line is exactly one of
    CHQB/HOLD/PHOB/TELB with no trailing "/narrative", write that line's code verbatim to Cd (other lines, if any,
    are each independently handled by their own matching entry among this document's other 23E entries - this is
    not mutually exclusive with them producing their own values from the OTHER lines of the same raw value). A line
    that is one of these four WITH trailing narrative, or any other codeword, contributes no value here (falls
    through to the InstrInf entry below instead for that line) - not an error.
    v2.21 BUG FIX (2026-09-04, from live test case TC44): 23E can repeat as separate MT lines (e.g. "SDVA\nHOLD",
    newline-joined into one raw value by this engine's field parser) - "23E's value is exactly one of CHQB/HOLD/
    PHOB/TELB" now means "one of its LINES is exactly one of these four," not "the whole raw value is." Added
    gate_pattern so this is checked deterministically per-line in Java rather than left to the LLM to judge
    strictly-equals against a multi-line string - see the SvcLvl/Cd entry's v2.21 note below for the full root-cause
    explanation shared across all four 23E entries.
  edge_cases:
  - condition: "Field absent"
    handling: "not an error - InstrForCdtrAgt is optional"
  - condition: "Code is not one of CHQB/HOLD/PHOB/TELB, or carries trailing narrative"
    handling: "not an error here - see the InstrInf entry below, which handles this case instead"

- source_field: "23E"
  source_name: "Instruction Code - non-enumerated codes and any code with trailing narrative"
  target_path: "CdtTrfTxInf.InstrForCdtrAgt.InstrInf"
  mandatory: false
  transformation: llm_assisted
  notes: >-
    v2.7 GAP FIX: paired with the Cd entry above; the two are mutually exclusive by design so a single 23E value
    never populates both Cd and InstrInf redundantly. SWIFT's 23E codeset also includes PHOI, PHON, REPA, RTGS,
    TELE, and TELI (per the official Swift MT103 field 23E code list), none of which are valid values of this XSD's
    Instruction3Code enum ({CHQB, HOLD, PHOB, TELB} only) - writing them into Cd would fail XSD enumeration
    validation. InstrInf is Max140Text (free text, no enum restriction), so this entry is the correct target for any
    codeword outside that four-value set, and for any of the four WITH trailing narrative (e.g. "TELI/3226553478",
    matching the source guide's own second worked example). DECISION PROCEDURE (v2.21 REWRITE, 2026-09-04, from live
    test case TC44 - see below): 23E can appear as MULTIPLE separate MT lines (newline-joined into one raw value) -
    evaluate EACH LINE independently, not the raw value as a single unit. For each line: if that line is NOT exactly
    one of CHQB/HOLD/PHOB/TELB/SDVA/INTC/CORT (i.e. it doesn't match the Cd, SvcLvl, or CtgyPurp entries' own
    conditions), OR is one of the four Cd-eligible codes WITH trailing narrative, include that line's full text in
    InstrInf; join multiple such qualifying lines with a newline if more than one exists. If EVERY line of the raw
    value is fully consumed by the Cd/CtgyPurp/SvcLvl entries (e.g. "SDVA\nHOLD" - both lines exactly match another
    entry's condition), this entry produces NO value - not a refusal, and not the raw multi-line string copied
    verbatim (the old, pre-v2.21 instruction here).
    v2.21 BUG FIX EXPLANATION (from live test case TC44): a message with 23E repeated as "SDVA\nHOLD" was rejected
    outright - the OLD decision procedure above told the LLM to copy the full raw value verbatim whenever 23E
    "is not exactly" one of the enumerated codes, but a two-line value is trivially "not exactly" any single code,
    so the old wording forced a verbatim copy of "SDVA\nHOLD" into InstrInf even though SDVA/HOLD are BOTH handled
    elsewhere - the model correctly recognized this contradiction and refused rather than guess, but the underlying
    instruction was genuinely self-contradictory, not just under-specified. This entry has no gate_pattern
    (unlike the other three 23E entries) because its own condition is "none of the others matched," which can't be
    expressed as a simple presence-regex without duplicating those three entries' logic - it still runs
    unconditionally whenever 23E is present, relying on the rewritten decision procedure above instead.
  edge_cases:
  - condition: "Field absent"
    handling: "not an error - InstrForCdtrAgt is optional"
  - condition: "Value exceeds 140 characters"
    handling: "reject - do not truncate"
  - condition: "Every line of a multi-line 23E value is fully consumed by the Cd/CtgyPurp/SvcLvl entries above"
    handling: "not an error - this entry produces no value, not the raw multi-line string"

- source_field: "23E"
  source_name: "Instruction Code - INTC/CORT (category-purpose codes)"
  target_path: "CdtTrfTxInf.PmtTpInf.CtgyPurp.Cd"
  mandatory: false
  transformation: llm_assisted
  gate_pattern: "^(INTC|CORT)$"
  notes: >-
    v2.9 SOURCED CORRECTION: this entry previously also routed SDVA here (see the superseded v2.7 note this replaces,
    kept in the known_limitations changelog for history) on the reasoning that SDVA/INTC/CORT are "established ISO
    20022 external category-purpose codes" as a group - defensible in the abstract, but wrong per an actual
    authoritative field-level table. Directly verified against Annex 5.1.1 of the TARGET2 "General Functional
    Specification of the MX/ISO 20022 migration" (a real MT103-to-pacs.008 field mapping table, not TARGET2-network
    business logic - the field-to-element correspondence itself is not TARGET2-specific): "23E Instruction Code O ->
    PaymentTypeInformation/ServiceLevel/Code (SDVA) [and separately] PaymentTypeInformation/CategoryPurpose/Code
    (INTC, CORT)" - two DIFFERENT targets, not one. SDVA moved to its own new entry below (SvcLvl/Cd). INTC and CORT
    (Intra-Company Payment, Trade Settlement Payment) stay here. DECISION PROCEDURE: 23E can appear as MULTIPLE
    separate MT lines (newline-joined into one raw value) - evaluate EACH LINE independently, not the raw value as
    a single unit. If ANY line is exactly INTC or CORT, write that line's code verbatim to CtgyPurp/Cd (other lines,
    if any, are each independently handled by their own matching entry among this document's other 23E entries).
    v2.21 BUG FIX (2026-09-04, from live test case TC43): added gate_pattern - see the SvcLvl/Cd entry's identical
    v2.21 note below for the full explanation (23E can repeat as separate MT lines with DIFFERENT codewords, e.g.
    "SDVA\nINTC", and the four 23E entries in this document were being asked to judge the whole multi-line value as
    one unit rather than per-line, causing spurious low-confidence refusals).
  edge_cases:
  - condition: "Field absent, or code is not INTC/CORT"
    handling: "not an error here - see the SvcLvl and InstrInf entries for SDVA and everything else"

- source_field: "23E"
  source_name: "Instruction Code - SDVA (Same Day Value service level)"
  target_path: "CdtTrfTxInf.PmtTpInf.SvcLvl#0.Cd"
  mandatory: false
  transformation: llm_assisted
  gate_pattern: "^SDVA$"
  notes: >-
    v2.9 GAP FIX: split out of the CtgyPurp/Cd entry above - see its v2.9 note for the full correction history and
    citation. Confirmed directly against pacs.008.001.08.xsd: PaymentTypeInformation28's SvcLvl is
    maxOccurs="unbounded" (type ServiceLevel8Choice, Cd|Prtry choice) - repeatable, like ChrgsInf/RgltryRptg
    elsewhere in this document, hence the "#0" indexed-target convention already established for those. DECISION
    PROCEDURE: 23E can appear as MULTIPLE separate MT lines (newline-joined into one raw value) - evaluate EACH LINE
    independently, not the raw value as a single unit. If ANY line is exactly SDVA, write SDVA verbatim to
    SvcLvl#0/Cd (other lines, if any, are each independently handled by their own matching entry among this
    document's other 23E entries - e.g. an INTC line on a different row of the same raw value also independently
    populates CtgyPurp/Cd). RESIDUAL GAP: the TARGET2 source's own worked-example evidence for this
    specific path is thin (its table states the rule but this document has not independently confirmed it against a
    second real worked SDVA example) - treat as sourced but not doubly-verified, consistent with this document's
    existing "Yes"/"No" SWIFT-verified distinction elsewhere.
    v2.21 BUG FIX (2026-09-04, from live test cases TC43/TC44): a message with 23E repeated across two lines (e.g.
    "SDVA\nINTC" or "SDVA\nHOLD" - each occurrence newline-joined into one raw value by this engine's field parser,
    same mechanism as 71F/50F/59F elsewhere in this doc) was rejected outright. Root cause: this and the other three
    23E entries are llm_assisted, called UNCONDITIONALLY with the FULL raw value regardless of whether their own
    codeword is present (same class of bug as the 13C fix above - see that entry's v2.21 note for the full mechanism
    explanation) - each entry's own DECISION PROCEDURE says "if 23E's value is exactly SDVA," which a strict reading
    treats as false for a two-line value like "SDVA\nINTC" even though SDVA genuinely IS one of its lines, causing a
    spurious low-confidence refusal that (being an uncaught TransformationException) failed the whole conversion.
    Fixed with gate_pattern: "^SDVA$" (Java-checked with MULTILINE, so it matches a LINE that is exactly SDVA
    within a multi-line value) - this entry, the CtgyPurp/Cd entry, and the Cd entry above now each independently and
    deterministically fire only for their own codeword's line, so "SDVA\nINTC" correctly populates BOTH SvcLvl#0/Cd
    and CtgyPurp/Cd from the same source field with no LLM ambiguity at all. NOT ADDRESSED here: TC44's second
    finding, that SWIFT rule combinations forbidding certain 23E code pairings (the test's own analysis named "D67",
    e.g. SDVA+HOLD) are not validated - not implemented in this version because this document has not independently
    verified that specific rule citation against a fetched SWIFT source; flagged in known_limitations rather than
    guessed at.
  edge_cases:
  - condition: "Field absent, or code is not SDVA"
    handling: "not an error here - see the CtgyPurp and InstrInf entries for INTC/CORT and everything else"

- source_field: "77B"
  source_name: "Regulatory Reporting - reporting-side indicator (ORDERRES=debtor / BENEFRES=creditor)"
  target_path: "CdtTrfTxInf.RgltryRptg#0.DbtCdtRptgInd"
  mandatory: false
  transformation: llm_assisted
  gate_pattern: "/ORDERRES/|/BENEFRES/"
  notes: >-
    v2.7 GAP FIX: 77B was previously excluded ("Excluded from field_mappings; candidate for a follow-up once
    forward-direction samples exist" per the prior known_limitations entry, now superseded). Reopened after directly
    reading the same Bank of America MT103-to-pacs.008 formatting guide, which gives a genuine forward-direction
    worked example: ":77B:/BENEFRES/CA" -> a populated RgltryRptg element - stronger evidence than this document
    previously had (which was Creditor-side-only and reverse-inferred from pacs.008 samples in a different source).
    Confirmed directly against pacs.008.001.08.xsd: RgltryRptg is type RegulatoryReporting3 =
    {DbtCdtRptgInd (enum: CRED/DEBT/BOTH), Authrty, Dtls[] (Tp/Dt/Ctry/Cd/Amt/Inf[])} - NOT the flat
    <RgltryRptg><Inf>...</Inf></RgltryRptg> shape the source guide's own illustrative XML implies (that rendering
    does not match this document's supplied XSD and is not followed here). /ORDERRES/ and /BENEFRES/ are the two
    standard 77B codewords for "regulatory reporting concerns the Orderer/Debtor" and "...the Beneficiary/Creditor"
    respectively - the well-documented SWIFT pairing that DbtCdtRptgInd's DEBT/CRED enum values exist specifically
    to express. DECISION PROCEDURE: if a 77B line begins with /ORDERRES/, write DEBT; if it begins with /BENEFRES/,
    write CRED; any other or absent codeword produces no value for this entry (the Inf entry below still captures
    the raw text regardless). "#0" marks the first (and, in this version, only) RgltryRptg occurrence - RgltryRptg
    is maxOccurs=10 in the XSD but 77B's realistic multi-line repetition is not handled by this version; see
    known_limitations.
    v2.21 PREVENTIVE FIX (2026-09-04): added gate_pattern as a consistency measure, applying the same fix built
    for TC41-44 (13C/23E) to this entry and the Ctry entry below - not itself triggered by a failing batch-5 test
    case (TC47 passed), but the identical architectural risk exists here too (llm_assisted, unconditional LLM call
    regardless of whether /ORDERRES//BENEFRES/ is actually present) and costs nothing to close pre-emptively.
  edge_cases:
  - condition: "Field absent, or no line starts with /ORDERRES/ or /BENEFRES/"
    handling: "not an error - DbtCdtRptgInd is optional; see the Inf entry below, which still captures the raw text"

- source_field: "77B"
  source_name: "Regulatory Reporting - country-of-residence code (the 2 letters immediately following the codeword)"
  target_path: "CdtTrfTxInf.RgltryRptg#0.Dtls.Ctry"
  mandatory: false
  transformation: llm_assisted
  gate_pattern: "/ORDERRES/|/BENEFRES/"
  notes: >-
    v2.7 GAP FIX: paired with the DbtCdtRptgInd entry above - identical codeword detection. Matches the source
    guide's own worked example (":77B:/BENEFRES/CA" - "CA" is a 2-letter ISO country code), which fits Dtls/Ctry's
    CountryCode datatype ([A-Z]{2} pattern) exactly. DECISION PROCEDURE: if a 77B line begins with /ORDERRES/xx or
    /BENEFRES/xx where xx is exactly 2 uppercase letters, output xx; otherwise produce no value.
  edge_cases:
  - condition: "Field absent, or the codeword is present but not immediately followed by a 2-letter uppercase code"
    handling: "not an error - Ctry is optional; the Inf entry below still captures the full raw line regardless"

- source_field: "77B"
  source_name: "Regulatory Reporting - full raw line (verbatim fallback, no interpretation)"
  target_path: "CdtTrfTxInf.RgltryRptg#0.Dtls.Inf"
  mandatory: false
  transformation: direct_copy
  notes: >-
    v2.7 GAP FIX: unconditional companion to the two entries above - copies the COMPLETE raw 77B line (codeword,
    country code, and any trailing free text) verbatim into Dtls/Inf regardless of whether it matched the
    ORDERRES/BENEFRES pattern. This is deliberately the safe, no-guess fallback: if a real message uses a 77B
    convention this document doesn't recognize, the content is still preserved as free text rather than silently
    dropped, while DbtCdtRptgInd/Ctry simply stay unpopulated for that message. Runs unconditionally alongside the
    two entries above (not mutually exclusive with them) - Dtls/Inf and DbtCdtRptgInd/Ctry are sibling elements, so
    having both the structured indicator AND the preserved raw text is valid and intentional, not redundant.
  edge_cases:
  - condition: "Field absent"
    handling: "not an error - RgltryRptg is optional"
  - condition: "Value exceeds 35 characters (Dtls/Inf is Max35Text)"
    handling: "reject - do not truncate; a future version may need to split a long line across multiple Inf occurrences"

- source_field: "26T"
  source_name: "Transaction Type Code (deliberately not value-mapped - see notes)"
  target_path: "CdtTrfTxInf.Purp.Cd"
  mandatory: false
  transformation: skip_with_warning
  notes: >-
    v2.21 GAP FIX (2026-09-04, from live test case TC45): 26T previously had NO field_mappings entry at all - a
    deliberate v2.7 decision (see the known_limitations entry below), not an oversight: the Bank of America
    MT103-to-pacs.008 formatting guide already cited elsewhere in this document states verbatim that 26T 'is not
    processed by Bank of America', which this document treated as evidence AGAINST mapping it, even though
    pacs.008.001.08.xsd does have a structural target (Purp, type Purpose2Choice, Cd sub-element = ExternalPurpose1Code,
    confirmed directly against the XSD, max 4 chars - 26T's own SWIFT format is 3!c, well within that). TC45 surfaced
    the REAL consequence of "no field_mappings entry": ConverterService.checkUnmappedFields() treats any source field
    with zero matching entries as a hard error under the default unmapped_fields_policy, so a real MT103 carrying a
    genuine, current, legitimately-optional field (26T) failed the ENTIRE conversion outright - not merely "26T's
    value goes nowhere," which was the intended, accepted gap. DECISION: this version still does NOT populate Purp/Cd
    from 26T (the "not processed by BofA" caution stands - no second, forward-direction worked example has been found
    to override it) but now uses skip_with_warning (the same mechanism already used for other deliberately-unmapped-value
    fields elsewhere in this document) so the field is recognized and the conversion proceeds, with a visible warning
    telling the caller 26T was present and dropped rather than either failing outright or silently vanishing. Revisit
    if a forward-direction MT103->pacs.008 worked example for 26T is ever found - that would be the evidence needed to
    turn this into a real value-producing entry instead.
  edge_cases:
  - condition: "Field absent"
    handling: "not an error - this entry produces no value and no warning either (skip_with_warning only fires when the field IS present)"
  - condition: "Field present"
    handling: "not a hard failure - surfaced as a conversion warning, value intentionally not carried into Purp/Cd (see notes)"

