  field 70 lacked a /ROC/ prefix."
- Swift publishes the authoritative current MT103<->pacs.008 translation rules in MyStandards / the Translation Portal. 
  Public Swift pages confirm the translation scope but do not expose every field-level rule; those portal-only rules are
  not fabricated here.
- 23B -> PmtTpInf/LclInstrm/Prtry is retained as corroborated mapping, but is not marked direct Swift-portal-certified 
  because the current portal rule was not publicly retrievable in this review.
- 50F/59F numbered customer data requires a dedicated deterministic structured-address parser. Account extraction alone 
  is not a complete business mapping.
- 71F/71G require a structured ChargesInformation builder because the pacs.008.001.08 XSD requires both Amount and 
  Agent. Raw text-to-ChrgsInf is prohibited.
- 52B/52C, 53B/53D, 54B/54D, 55B/55D, 56C/56D, and 57B/57C are not silently guessed. The current mapping must fail 
  closed for unsupported variants until the exact CBPR+ translation rule and clearing-system mapping are implemented.
- Field 77B (ORDERRES/BENEFRES) and 26T have current CBPR+ implementation evidence, but exact target-side 
  codeword/occurrence handling should be added only after the engine supports the required repeated structured elements 
  and the current Swift translation rule is verified.
- SettlementMethod cannot be universally inferred from MT103 presence/absence alone. The current conditional rule is an 
  implementation default and must be verified against the Swift Translation Portal and corridor settlement configuration
  before production.
- "v2.1 VERIFIED CITATIONS: the official Swift MT103 Standards Category 1 field definitions state, for field 52a (Ordering
  Institution), that it 'Specifies the Financial Institution of the Ordering Customer, when different from the Sender' -
  i.e. absence of 52a means the Sender is the ordering institution; and for field 57a (Account With Institution), that
  'When field 57a is not present, it means that the Receiver is also the account with institution.' Both are universal
  Swift FIN usage rules on the MT103 source side, independent of the MX target profile (CBPR+, TARGET2, or otherwise), and
  are the corrected basis for the __MT_SENDER_BIC__ and __MT_RECEIVER_BIC__ fallback entries above - superseding the v2.0
  entries' unsourced 'user-provided rule' framing and the __MT_RECEIVER_BIC__ entry's incorrect TARGET2 citation."
unmapped_fields_policy: error

default_values: {}

target_defaults:
  CdtTrfTxInf.PmtId.EndToEndId: NOTPROVIDED
validation_rules:
- rule_id: VR001
  description: "If Instructed Amount is present and its currency differs from the Interbank Settlement Amount currency, Exchange
    Rate must be present."
  applies_to: ["CdtTrfTxInf.InstdAmt", "CdtTrfTxInf.IntrBkSttlmAmt", "CdtTrfTxInf.XchgRate"]
  severity: error
  rule_type: conditional_currency_mismatch_requires
  params:
    trigger_field: CdtTrfTxInf.InstdAmt
    compare_field: CdtTrfTxInf.IntrBkSttlmAmt
    required_field: CdtTrfTxInf.XchgRate
  logic: >
    UHB p.214, verbatim: "if the Instructed Amount is present and the
    currency is different from the currency in Interbank Settlement
    Amount, then Exchange Rate must be present." v2.2 CHANGELOG: now
    machine-checked via rule_type - see ValidatorService.evalCurrencyMismatchRequires().

- rule_id: VR002
  description: "When Charge Bearer = DEBT, only one pre-paid Charges Information occurrence is valid; deducted charges are
    invalid."
  applies_to: ["CdtTrfTxInf.ChrgBr", "CdtTrfTxInf.ChrgsInf"]
  severity: error
  logic: >
    UHB p.216. NOT machine-checked, deliberately: ChrgsInf's own
    field_mappings entries (71F/71G) use transformation=skip_with_warning
    (see those entries' v1.19 notes) - this engine cannot currently
    populate ChrgsInf at all, structured or otherwise, so there is no
    "pre-paid vs deducted occurrence" state in the converted output to
    check a rule about. Recorded for human/LLM reviewer judgement until
    ChrgsInf gains real support.

- rule_id: VR003
  description: "Reimbursement Agent elements are only relevant/expected when Settlement Method = COVE."
  applies_to: ["GrpHdr.SttlmInf.SttlmMtd", "GrpHdr.SttlmInf.InstgRmbrsmntAgt", "GrpHdr.SttlmInf.InstdRmbrsmntAgt", "GrpHdr.SttlmInf.ThrdRmbrsmntAgt"]
  severity: warning
  rule_type: presence_requires_value
  params:
    trigger_fields: ["GrpHdr.SttlmInf.InstgRmbrsmntAgt", "GrpHdr.SttlmInf.InstdRmbrsmntAgt", "GrpHdr.SttlmInf.ThrdRmbrsmntAgt"]
    gate_field: GrpHdr.SttlmInf.SttlmMtd
    gate_value: COVE
  logic: >
    UHB pp.199-207. Not a stated hard-rejection rule outside COVE, so
    severity=warning. v2.2 CHANGELOG: now machine-checked via rule_type -
    see ValidatorService.evalPresenceRequiresValue().

- rule_id: VR004
  description: "If all three Previous Instructing Agents are populated, Intermediary Agent should not also be used in the
    same message."
  applies_to: ["CdtTrfTxInf.PrvsInstgAgt1", "CdtTrfTxInf.PrvsInstgAgt2", "CdtTrfTxInf.PrvsInstgAgt3", "CdtTrfTxInf.IntrmyAgt1"]
  severity: warning
  rule_type: mutual_exclusion
  params:
    requires_all: ["CdtTrfTxInf.PrvsInstgAgt1", "CdtTrfTxInf.PrvsInstgAgt2", "CdtTrfTxInf.PrvsInstgAgt3"]
    excludes: CdtTrfTxInf.IntrmyAgt1
  logic: >
    UHB p.225: implies a direct-and-cover message pair would be needed
    instead. v2.2 CHANGELOG: now machine-checked via rule_type - see
    ValidatorService.evalMutualExclusion().

- rule_id: VR005
  description: 'MT103 mandatory source alternatives must be present: exactly one Ordering Customer option (50A/50F/50K), exactly
    one Beneficiary Customer option (59/59A/59F), plus 20, 23B, 32A and 71A.'
  applies_to:
  - '20'
  - 23B
  - 32A
  - 50A
  - 50F
  - 50K
  - '59'
  - 59A
  - 59F
  - 71A
  severity: error
  rule_type: source_alternative_group_required
  params:
    alternative_groups:
      - ['50A', '50F', '50K']
      - ['59', '59A', '59F']
    required_source_fields: ['20', '23B', '32A', '71A']
  logic: >
    SWIFT MT103 field presence rule must be enforced as an
    alternative-group validation; do not rely on empty XML placeholders.
    v2.2 CHANGELOG: now machine-checked via rule_type - checked against
    the SOURCE message (parsedFields), not the converted tree - see
    ValidatorService.evalSourceAlternativeGroup().
- rule_id: VR006
  description: Do not emit empty Dbtr or Cdtr elements as a fallback. If the source mandatory customer option is absent
    or cannot be parsed, reject conversion.
  applies_to:
  - CdtTrfTxInf.Dbtr
  - CdtTrfTxInf.Cdtr
  severity: error
  logic: >
    Business-mandatory customer data must be present; XSD structural
    validity alone is insufficient. NOT a separate machine-checked
    rule_type - already naturally enforced by two other mechanisms
    working together: (1) target_defaults has no empty Dbtr/Cdtr
    placeholder (removed for exactly this reason, see that section's
    v1.12/v2.1 history), so Dbtr/Cdtr are only ever populated by a REAL
    field_mappings entry firing; (2) the schema completeness check
    (XsdOrderingIndex.findMissingMandatory, v2.2) then fails the
    conversion outright if Dbtr/Cdtr end up missing entirely. Adding a
    third, redundant rule_type here would just duplicate that enforcement.
- rule_id: VR007
  description: 'Currency-aware amount precision: do not round or truncate amounts; validate fractional digits against the
    currency rules used by the target profile.'
  applies_to:
  - CdtTrfTxInf.IntrBkSttlmAmt
  - CdtTrfTxInf.InstdAmt
  severity: error
  rule_type: currency_precision_check
  params:
    amount_fields: ['CdtTrfTxInf.IntrBkSttlmAmt', 'CdtTrfTxInf.InstdAmt']
  logic: >
    ISO amount datatypes permit more fractional digits than many
    currencies; the converter must enforce currency-specific minor-unit
    precision (standard ISO 4217 exceptions - JPY/KRW/etc.=0 decimals,
    BHD/KWD/etc.=3 decimals, default 2). ChrgsInf removed from applies_to
    (was listed originally) - it's never populated by this document's
    field_mappings (see VR002's note), so there is nothing for this rule
    to check there. v2.2 CHANGELOG: now machine-checked via rule_type -
    see ValidatorService.evalCurrencyPrecision(). Only flags TOO MANY
    fractional digits, not fewer-than-standard (a round amount like "100"
    for USD is legitimate).
- rule_id: VR008
  description: 'If 50F/59F or any D-option agent address is converted after 14 November 2026 for an in-scope Swift cross-border
    flow, hybrid/structured address requirements must be satisfied: Town Name and Country Code must be structured.'
  applies_to:
  - CdtTrfTxInf.Dbtr.PstlAdr
  - CdtTrfTxInf.Cdtr.PstlAdr
  - CdtTrfTxInf.DbtrAgt.FinInstnId.PstlAdr
  - CdtTrfTxInf.CdtrAgt.FinInstnId.PstlAdr
  severity: error
  rule_type: structured_address_required
  params:
    address_fields:
      - CdtTrfTxInf.Dbtr.PstlAdr
      - CdtTrfTxInf.Cdtr.PstlAdr
      - CdtTrfTxInf.DbtrAgt.FinInstnId.PstlAdr
      - CdtTrfTxInf.CdtrAgt.FinInstnId.PstlAdr
    effective_date: "2026-11-14"
  logic: >
    Swift SR2026 address requirement; do not infer Town/Country from free
    text without an explicit deterministic structuring rule. v2.2
    CHANGELOG: now machine-checked via rule_type - flags a PstlAdr
    populated with free-text AdrLine but no structured TwnNm/Ctry; does
    NOT attempt to derive TwnNm/Ctry itself (still requires a real
    structuring rule once one is sourced) - see
    ValidatorService.evalStructuredAddress(). v2.4 BUG FIX: this rule's
    own description says "if converted after 14 November 2026" - the
    v2.2 implementation ignored that and enforced it unconditionally,
    incorrectly failing conversions run months before its own stated
    effective date. Added effective_date (ISO date) to params -
    evalStructuredAddress() now skips the check entirely (not even a
    warning - it isn't in effect yet) until the current date reaches it.
character_set: SWIFT-X